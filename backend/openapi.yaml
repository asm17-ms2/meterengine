      description: |
        단가 버전 하나를 보관합니다. 이번 달까지 적용하고 다음 달부터 멈추며, 아직 시작하지 않은 버전은 시작 전에 취소됩니다. 버전 이력은 남깁니다. 이미 보관한 버전에 다시 보내도 204입니다.
        고객 단가나 아직 시작하지 않은 버전처럼 버전 하나를 골라 보관할 때 이 경로를 씁니다. 구분 값으로 이번 달 공통 단가를 멈추려면 DELETE /v1/billable-metrics/{code}/price-rates?dimension_values=...를 씁니다.
      operationId: deletePriceRateVersion
      parameters:
      - description: 단가 버전이 속한 미터의 미터 코드
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: 보관할 단가 버전 ID(UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 단가 버전 보관
      tags:
      - price-rate-controller
