          description: 고객 이름입니다. read 권한 없이 받은 재등록 응답이면 null입니다.
        version:
          type: integer
          format: int64
          description: 고객 정보의 버전입니다. 고칠 때 큰따옴표로 감싸 If-Match에 보냅니다.
    DashboardInvoice:
