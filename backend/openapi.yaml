  /v1/usage:
    get:
      description: |
        미터마다 event_type이 같은 이벤트를 미터의 집계 함수로 계산합니다.
        달 하나의 모든 미터와 고객을 한 번에 보려면 이 경로를 씁니다. 검색어, 여러 조건, 정렬, 페이지가 필요하면 GET /v1/usage/search를 씁니다.
        기간은 KST 기준의 달입니다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 듭니다.
        지금 이후 시각의 이벤트는 집계에 들지 않습니다.
        그 달 이벤트 가운데 집계 마감 시각(다음 달 2일 00:00 KST) 전에 서버가 받은(received_at) 것만 집계합니다. 마감 뒤에 받은 그 달 이벤트는 저장되지만 집계와 청구에 들지 않습니다.
        그 달에 집계하는 미터는 미터 코드 오름차순으로, 고객은 이름 오름차순으로 모두 나오며, 이벤트가 없는 고객은 quantity가 0이고 dimension_usages가 빈 배열입니다. 페이지를 나누지 않습니다.
        dimension_usages는 미터의 dimension_properties마다 이벤트 properties에서 뽑은 구분 값별로 수량을 나눈 것입니다.
        고객 전체 수량은 원본 이벤트를 따로 집계하므로 구분 값별 수량의 합과 다를 수 있습니다. 청구는 구분 값별 정확한 수량에 단가를 곱합니다. rounding_mode가 none이면 raw_quantity_numerator / (raw_quantity_denominator * unit_size)를, 그 밖의 끝수 처리면 처리한 quantity를 씁니다.
        raw_quantity는 단위 변환 전 집계량, quantity는 unit_size 나눗셈과 끝수 처리를 적용한 결과입니다.
        count는 속성과 관계없이 전체 이벤트를 셉니다. count_distinct는 숫자, 문자열, 불리언 고유값만 세고 나머지는 뺍니다.
        다른 집계 함수는 target_property가 숫자인 이벤트만 계산합니다. 구분 키가 없으면 dimension_values가 빈 객체입니다.
        금액은 싣지 않습니다. 금액은 청구 예정액 조회(GET /v1/invoices/draft)가 줍니다.
      operationId: aggregateBillableMetricUsages
      parameters:
      - description: "집계할 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricUsagesResponse"
          description: "미터별, 고객별 사용량입니다. 그 달에 집계하는 미터가 없으면 billable_metric_usages가\
            \ 빈 배열입니다."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: month가 yyyy-MM이 아니거나 0001-01부터 9999-12까\
            지의 범위 밖입니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 사용량 조회
      tags:
      - billable-metric-usage-controller
  /v1/usage/export:
