        사용자를 도입사에 소속시킨다. 소속된 사용자는 로그인 세션의 도입사를 이 도입사로 바꿀 수 있다.
        operator 로그인 세션만 부를 수 있다.
      operationId: createOrganizationMember
      parameters:
      - description: 사용자를 소속시킬 도입사의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationMemberRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganizationMemberResponse"
          description: 만든 소속
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: user_account_id가 없거나 UUID 형식이 아니거나\
            , 경로의 UUID 형식이 틀렸다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이다."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=organization_not_found: 그런 도입사가 없다.
            code=user_account_not_found: 그런 사용자가 없다.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=organization_member_already_exists: 이미 이 도입사에 소속된 사용자\
            다"
      summary: 도입사 소속 추가
      tags:
      - organization-controller
  /v1/organizations/{id}/status:
    put:
      description: |
        도입사의 상태를 바꾸고 바뀐 도입사를 돌려준다. 승인은 active, 거절은 rejected, 정지는 suspended, 재개는 active로 보낸다.
        허용되는 전이는 pending에서 active나 rejected, active에서 suspended, suspended에서 active뿐이다.
        정지하면 그 도입사의 키와 세션으로 도입사의 데이터를 다루는 요청이 403(organization_not_active)이다.
        operator 로그인 세션만 부를 수 있다.
      operationId: updateOrganizationStatus
      parameters:
      - description: 상태를 바꿀 도입사의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
          description: 바뀐 도입사
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: status가 pending, active, rejected,\
            \ suspended가 아니거나, 경로의 UUID 형식이 틀렸다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이다."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=organization_not_found: 그런 도입사가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=organization_status_transition_invalid: 지금 상태에서 그 상태로\
            는 바꿀 수 없다. 지금과 같은 상태도 여기에 든다"
      summary: 도입사 상태 변경
      tags:
      - organization-controller
  /v1/payment-attempts/{id}/cancellations:
    get:
      description: |
        결제 시도의 취소를 요청 시각이 늦은 것부터 돌려준다.
        requested_at과 completed_at은 KST(+09:00)로 나온다.
      operationId: listPaymentCancellations
      parameters:
      - description: 결제 시도의 id.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPaymentCancellationsResponse"
          description: 결제 취소 목록
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 id가 UUID가 아니다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_attempt_not_found: 그런 결제 시도가 없다"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 결제 취소 목록
      tags:
      - payment-cancellation-controller
    post:
      description: |
        done인 결제 시도의 금액 전부나 일부를 토스페이먼츠에 취소 요청한다. amount를 빼면 남은 결제 금액 전부를 취소한다.
        남은 결제 금액은 시도 금액에서 done인 취소의 합을 뺀 값이다. 시도의 결제 모드 키로 토스페이먼츠를 부른다.
        취소되면 status=done, 거절되면 status=failed와 failure_code, failure_message가 남고 둘 다 201이다.
        토스페이먼츠 응답으로 결과를 확인하지 못하면 status=pending인 취소를 201로 돌려준다.
        시도 하나에 pending인 취소는 하나뿐이다. 있으면 409다. API 키의 모드가 취소 대상과 다르면 409다.
        Idempotency-Key를 주면 같은 도입사의 같은 요청을 다시 보내도 기존 결과를 돌려준다. 같은 키로 다른 요청을 보내면 409다.
        requested_at과 completed_at은 KST(+09:00)로 나온다.
      operationId: createPaymentCancellation
      parameters:
      - description: 취소할 결제 시도의 id.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: 취소 요청마다 발급한 UUID. 응답을 받지 못해 다시 요청할 때는 같은 값을 보낸다.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentCancellationRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentCancellationResponse"
          description: "결제 취소. status는 done, failed, pending 중 하나"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 경로의 id가 UUID가 아니거나, amount가 양수가 아니거나, reason이 비었거나 200자를 넘거나 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있다.
            code=malformed_request_body: 본문을 JSON으로 읽을 수 없거나 amount가 정수가 아니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_attempt_not_found: 그런 결제 시도가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=payment_mode_mismatch: API 키의 모드가 취소 대상의 모드와 다르다.
            code=payment_attempt_not_cancelable: 시도가 done이 아니다.
            code=payment_attempt_fully_canceled: done인 시도를 이미 전액 취소해 남은 결제 금액이 0원이다.
            code=payment_cancellation_in_progress: 이 시도에 pending인 취소가 있다.
            code=payment_cancellation_amount_exceeded: amount가 남은 결제 금액보다 크다.
            code=payment_cancellation_idempotency_conflict: 같은 Idempotency-Key를 다른 취소 요청에 사용했다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 결제 취소 요청
      tags:
      - payment-cancellation-controller
  /v1/payment-method-registrations/{token}:
    get:
      description: |
        카드 등록 페이지가 토스페이먼츠 SDK를 띄우는 데 쓸 값을 돌려준다. 일회용 카드 등록 토큰으로 인증하는 공개 API다.
        token은 응답에 싣지 않는다.
        없거나, 만료됐거나, 이미 카드 등록에 쓴 링크는 모두 404다.
        expires_at은 KST(+09:00)로 나온다.
      operationId: getPaymentMethodRegistration
      parameters:
      - description: 카드 등록 링크를 만들 때 받은 token.
        in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentMethodRegistrationResponse"
          description: 카드 등록 링크
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: token에 NUL 문자나 짝이 없는 UTF-16 서로게이트가\
            \ 있다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_method_registration_not_found: 링크가 없거나, 만료됐거나\
            , 이미 쓰였다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_credential_missing: 링크를 만든 결제 모드의 토스페이먼\
            츠 키가 없다"
      security: []
      summary: 카드 등록 링크 조회
      tags:
      - payment-method-registration-controller
  /v1/payment-method-registrations/{token}/billing-keys:
    post:
      description: |
        카드 등록 페이지가 토스페이먼츠 SDK로 받은 authKey를 보내면 빌링키를 발급하고 고객의 카드로 저장한다.
        일회용 카드 등록 토큰으로 인증하는 공개 API다.
        링크를 만든 결제 모드의 카드로 저장한다. 그 모드에 카드가 있으면 새 카드로 바꾸고 옛 빌링키는 토스페이먼츠에서 지운다.
        성공하면 링크는 쓰인 것이 되어 다시 쓸 수 없다. 토스페이먼츠가 거절했거나 결과를 알 수 없으면 링크는 쓰이지 않은 채 남는다.
        빌링키 원문은 응답에 싣지 않는다. authenticated_at은 KST(+09:00)로 나온다.
      operationId: createBillingKey
      parameters:
      - description: 카드 등록 링크를 만들 때 받은 token.
        in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillingKeyRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentMethodResponse"
          description: 저장한 고객 카드
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: auth_key, customer_key, consent_document_version 중 비었거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, customer_key가 링크의 고객과 다르다.
            code=payment_method_rejected: 토스페이먼츠가 카드 인증을 거절했다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_method_registration_not_found: 링크가 없거나, 만료됐거나\
            , 이미 쓰였다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_credential_missing: 링크를 만든 결제 모드의 토스페이먼\
            츠 키가 없다"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_unavailable: 토스페이먼츠 응답으로 빌링키 발급 결과를 확인하\
            지 못했다"
      security: []
      summary: 빌링키 발급
      tags:
      - billing-key-controller
  /v1/payment-methods:
    get:
      description: |
        지금 결제 모드로 등록한 고객 카드를 customer_id 오름차순으로 전부 돌려준다. 빌링키 원문은 싣지 않는다.
        페이지를 나누지 않는다. authenticated_at은 KST(+09:00)로 나온다.
      operationId: listPaymentMethods
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPaymentMethodsResponse"
          description: 고객 카드 목록. 등록한 카드가 없으면 payment_methods가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 요청 값이 올바르지 않다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 고객 카드 목록 조회
      tags:
      - payment-method-controller
  /v1/payment-reconciliation-mismatches:
    get:
      description: |
        하루치 토스페이먼츠 거래 목록과 MeterEngine의 done 결제 시도, done 취소를 맞춰 보고 남긴 불일치를 돌려준다. 두 결제 모드(test, live)를 모두 담는다.
        기간은 불일치를 찾은 시각(detected_at)의 KST 날짜로 거르고, from 날짜 0시부터 to 날짜가 끝날 때까지다.
        detected_at 내림차순이다. transacted_at과 detected_at은 KST(+09:00)로 나온다. 페이지를 나누지 않는다.
      operationId: listPaymentReconciliationMismatches
      parameters:
      - description: "기간의 첫날(yyyy-MM-dd, KST)"
        example: 2026-10-01
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - description: "기간의 마지막 날(yyyy-MM-dd, KST). 이날 전부를 담는다"
        example: 2026-10-31
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPaymentReconciliationMismatchesResponse"
          description: 불일치 목록. 기간 안에 불일치가 없으면 payment_reconciliation_mismatches가 빈
            배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: from이나 to가 없거나 yyyy-MM-dd가 아니거나 0001-01-01부\
