  /v1/unbilled-events:
    get:
      description: "조회한 달에 발생한 이벤트 가운데 과금에서 빠지거나 확인이 필요한 이벤트를 항목별로 셉니다. 항목은 연결할 미터\
        \ 없음(unmatched_type), 수량을 읽을 수 없음(non_numeric_value), 발생 시각이 미래인 이벤트(future_timestamp),\
        \ 수량이 음수인 이벤트(negative_quantity)입니다. 수량이 음수인 이벤트는 거절하거나 집계에서 빼지 않습니다. 발생 시\
        각이 미래인 이벤트는 occurred_at이 cutoff_at 이후인 이벤트이며, 그 시각이 지나면 집계에 듭니다. 수량 판정은 미터\
        마다 하므로 같은 이벤트가 여러 미터에 잡힐 수 있습니다. 수신 시각(received_at)은 보지 않습니다."
      operationId: getUnbilledEvents
      parameters:
      - description: "조회할 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다."
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UnbilledEventsResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 과금 제외 사용량 조회
