  /v1/public/invoice-links/lookup:
    post:
      description: "본문의 token으로 청구서 하나를 조회합니다. 없거나 만료되거나 폐기된 링크는 모두 404입니다. 내부 식별자\
        , 이메일, 토스페이먼츠 결제 키는 싣지 않습니다. 취소한 금액은 따로 싣고 남은 결제 금액에 다시 더하지 않습니다. 결제가 pending이\
        면 결제한 금액(paid_amount)과 남은 결제 금액(outstanding_amount)은 null입니다."
      operationId: getPublicInvoice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetPublicInvoiceRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicInvoiceResponse"
          description: token의 링크로 공개한 청구서입니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=invoice_view_link_not_found: 링크가 없거나 만료되거나 폐기됐습니다."
      security: []
      summary: 청구서 공개 조회
      tags:
      - invoice-view-link-controller
  /v1/public/invoice-links/payment-retries:
    post:
      description: "조직이 재시도를 허용한 링크로 실패한 결제만 다시 시도합니다. 조회 응답의 payment_retry.version을\
        \ retry_version으로 보내고, 같은 버전으로는 새 결제를 한 번만 만들 수 있습니다. 금액과 카드는 MeterEngine에\
        \ 기록된 청구 금액과 등록 카드를 씁니다. 결과 확인 중(pending)이거나 승인, 취소된 결제, 시도 상한에 닿은 결제, 카드를\
        \ 다시 등록해야 하는 실패는 다시 시도하지 않습니다."
      operationId: createInvoicePaymentRetry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoicePaymentRetryRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicInvoiceResponse"
          description: OK
      security: []
      summary: 고객의 실패 결제 재시도
      tags:
      - invoice-view-link-controller
  /v1/sessions:
    post:
      description: |
        이메일과 비밀번호로 로그인하고 세션 토큰을 돌려줍니다. 토큰 원문은 이 응답에서만 볼 수 있습니다.
        이후 요청의 Authorization 헤더에 Bearer 값으로 싣습니다. 세션은 expires_at에 끝납니다.
        세션의 조직은 소속된 활성 조직 가운데 가장 먼저 소속된 곳입니다.
        활성 소속이 없는 MeterEngine 운영자 계정(operator)과, 활성 소속은 없지만 수락할 수 있는 초대가 있는 계정은 조직 없이 로그인하고 organization이 null입니다.
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"
          description: 만든 세션과 토큰
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: email이나 password가 비었거나 NUL 문자나 짝이 없\
            는 UTF-16 서로게이트를 담았습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=invalid_credentials: 이메일이나 비밀번호가 틀렸습니다. 어느 쪽이 틀렸는지는 알려 주지 않습니다.
            Authorization 헤더를 실었는데 그 값이 올바르지 않을 때도 같습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=email_not_verified: 이 계정은 아직 이메일 인증을 하지 않았습니다. 비밀번호가 맞을 때만 돌려줍니다.
            code=organization_not_active: 소속된 조직의 이용이 모두 정지됐고 수락할 수 있는 초대도 없습니다. MeterEngine 운영자 계정은 이 code를 받지 않습니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 로그인 시도 한도를 넘었습니다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
              style: simple
      security: []
      summary: 로그인
      tags:
      - session-controller
  /v1/sessions/current:
    delete:
      description: 요청에 실은 세션을 끝냅니다. 같은 토큰으로 다시 요청하면 401입니다. API 키로는 부를 수 없습니다.
      operationId: deleteSession
      responses:
        "204":
          description: 끝냈습니다. 본문은 없습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청입니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 로그아웃
      tags:
      - session-controller
    get:
      description: |
        요청에 실은 세션 토큰의 사용자, 세션이 고른 조직, 소속된 조직 목록, 만료 시각을 돌려줍니다.
        조직의 이용이 정지됐어도 조회할 수 있습니다. API 키로는 부를 수 없습니다.
      operationId: getSession
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: 현재 세션
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청입니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 현재 세션 조회
      tags:
      - session-controller
  /v1/sessions/current/consents:
    post:
      description: 로그인한 본인이 약관과 개인정보 처리방침에 동의합니다. 대표관리자나 MeterEngine 운영자가 만든 계정은 처음
        동의할 때 new_password로 본인 비밀번호를 정합니다. 그때 이 세션을 뺀 다른 세션은 모두 끝냅니다.
      operationId: acceptSessionConsents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptSessionConsentsRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: 현재 세션입니다. 이미 동의한 사용자면 새로 기록하지 않습니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: consents가 없거나 비었거나, document가 terms_of_service나 privacy_policy가 아니거나,
            document_version이 비었거나 255자를 넘거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았습니다.
            동의가 남은 사용자인데 consents에 terms_of_service와 privacy_policy가 한 번씩 있지 않거나,
            new_password가 없거나 처음 받은 비밀번호와 같거나 8자 미만이거나 72자 또는 UTF-8 72바이트를 넘을 때도 같습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청입니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 본인의 약관 동의
      tags:
      - session-consent-controller
  /v1/sessions/current/organization:
    put:
      description: |
        세션의 조직을 사용자가 소속된 다른 조직으로 바꾸고 바뀐 현재 세션을 돌려줍니다.
        이용이 정지된 조직으로도 바꿀 수 있지만, 그 조직의 데이터를 다루는 요청은 403(organization_not_active)입니다.
      operationId: updateSessionOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionOrganizationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: 바뀐 현재 세션
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: organization_id가 없거나 UUID 형식이 아닙니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: API 키로 부른 요청이거나, 사용자가 소속되지 않은 조직입니\
            다."
      summary: 조직 전환
      tags:
      - session-controller
  /v1/signups:
    post:
      description: |
        조직과 그 조직의 대표관리자 계정을 만들고 이용약관 동의와 개인정보 처리방침 확인을 기록합니다.
        조직은 active로 만들어져 바로 로그인해 테스트 환경을 쓸 수 있습니다.
        라이브 환경은 잠겨 있고(live_environment_opened_at이 null) 라이브 환경 이용 신청이 승인되면 열립니다.
        잠긴 동안 라이브 환경이나 X-MeterEngine-Environment가 없는 요청은 403(live_environment_locked)입니다.
        이메일은 소문자로 바꿔 저장합니다.
        응답의 user_account.email_verified는 false이고 가입을 마친 뒤 인증 메일을 보냅니다.
        메일을 보내지 못해도 가입은 201이며, POST /v1/email-verifications로 다시 받습니다.
        인증 전에 로그인하면 403(email_not_verified)입니다.
        요청 수 한도를 확인한 뒤 turnstile_token을 Cloudflare Turnstile로 확인하고 나서 가입을 처리합니다.
      operationId: createSignup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSignupRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SignupResponse"
          description: 만든 조직과 계정
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: organization_name이나 name이 비었거나 255자를 넘거나, email이 이메일 형식이 아니거나 254자를 넘거나,
            password가 8자보다 짧거나 72자나 UTF-8 72바이트를 넘거나, consents에 terms_of_service와 privacy_policy가 한 번씩 있지 않거나,
            document_version이 비었거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았습니다.
            code=captcha_failed: turnstile_token이 없거나 확인을 통과하지 못했습니다. 위젯을 다시 풀고 보냅니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=invalid_credentials: Authorization 헤더를 실었는데 그 값이 올바르지\
            \ 않습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=email_already_exists: 대소문자를 가리지 않고 같은 이메일로 가입한 사용자가 있\
            습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 가입 시도 한도를 넘었습니다. Retry-After 헤더의\
            \ 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
              style: simple
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=captcha_unavailable: 캡차 확인 결과를 받지 못해 가입을 받지 않았습니다. 잠시\
            \ 뒤 다시 시도합니다."
      security: []
      summary: 가입
      tags:
      - signup-controller
  /v1/toss-payments-credentials:
    get:
      description: |
        현재 업무 환경에 저장한 토스페이먼츠 키를 mode 오름차순으로 돌려줍니다. 키를 저장한 결제 모드만 나옵니다.
        시크릿 키 원문은 돌려주지 않고 마지막 네 자만 secret_key_last_four로 줍니다.
        verified_at과 updated_at은 KST(+09:00)로 나옵니다.
        status가 archived나 all이면 교체되거나 보관된 이전 키를 현재 행 뒤에 교체되거나 보관된 시각 내림차순으로 붙이고, archived_at에 그 시각을 담습니다. 이전 키는 새 결제에 다시 쓰이지 않습니다.
      operationId: listTossPaymentsCredentials
      parameters:
      - description: 보관 상태입니다. 생략하면 active입니다.
        in: query
        name: status
        required: false
        schema:
          type: string
          default: active
          enum:
          - active
          - archived
          - all
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListTossPaymentsCredentialsResponse"
          description: 키 목록입니다. 저장한 키가 없으면 toss_payments_credentials가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 요청 값이 올바르지 않습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 토스페이먼츠 키 목록 조회
      tags:
      - toss-payments-credential-controller
  /v1/toss-payments-credentials/{mode}:
    delete:
      description: 경로의 결제 모드에 저장한 토스페이먼츠 키를 보관하고 새 결제와 카드 등록을 멈춥니다. 이미 요청한 결제의 결과
        확인과 결제 취소에는 보관한 키를 계속 씁니다. 새 결제에 다시 쓰려면 키를 다시 저장합니다. 로그인 세션만 부를 수 있고 API 키로는
        부를 수 없습니다.
      operationId: deleteTossPaymentsCredential
      parameters:
      - description: 보관할 키의 결제 모드(test 또는 live)
        in: path
        name: mode
        required: true
        schema:
          type: string
          pattern: test|live
      responses:
        "204":
          description: 보관했습니다. 본문 없음
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_credential_not_found: 경로의 mode에 저장한 키가\
            \ 없습니다."
      summary: 토스페이먼츠 키 보관
      tags:
      - toss-payments-credential-controller
    put:
      description: |
        현재 업무 환경에 토스페이먼츠 클라이언트 키와 시크릿 키를 저장합니다.
        테스트 환경과 라이브 환경에서는 경로의 mode가 현재 업무 환경과 같아야 합니다. 그 결제 모드에 키가 있으면 덮어씁니다.
        mode가 test면 test_ck_와 test_sk_로, live면 live_ck_와 live_sk_로 시작하는 키만 받습니다.
        결제위젯 키(test_gck_, test_gsk_ 등)는 받지 않습니다.
        로그인 세션만 부를 수 있고 API 키로는 부를 수 없습니다.
        저장하기 전에 시크릿 키로 토스페이먼츠 결제 조회를 한 번 불러 키가 유효한지 확인합니다.
        시크릿 키는 암호화해 저장하고, 응답에는 마지막 네 자만 싣습니다.
        verified_at과 updated_at은 KST(+09:00)로 나옵니다.
      operationId: updateTossPaymentsCredential
      parameters:
      - description: 키를 쓸 결제 모드(test 또는 live)
        in: path
        name: mode
        required: true
        schema:
          type: string
          enum:
          - test
          - live
          pattern: test|live
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTossPaymentsCredentialRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TossPaymentsCredentialResponse"
          description: 저장한 키
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 경로의 mode가 test나 live가 아니거나, client_key나 secret_key가 비었거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있습니다.
            code=invalid_toss_payments_credential: 키가 mode에 맞는 접두사로 시작하지 않거나, 시크릿 키에 콜론, 공백, ASCII 밖 문자가 있거나, 토스페이먼츠가 시크릿 키를 거절했습니다. 어느 필드가 거절됐는지는 errors에 있습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_unavailable: 토스페이먼츠 응답으로 키가 유효한지 확인하지 못\
            했습니다. 키는 저장하지 않았습니다."
      summary: 토스페이먼츠 키 저장
      tags:
      - toss-payments-credential-controller
  /v1/toss-payments-webhooks/{organization_id}:
    post:
      description: |
        토스페이먼츠 개발자센터에 조직마다 등록하는 웹훅 URL입니다. 토스페이먼츠가 부르는 주소이고, 인증하지 않는 공개 API입니다.
        본문 값을 그대로 반영하지 않습니다. eventType이 PAYMENT_STATUS_CHANGED일 때만 data.orderId로 그 조직의 결제 시도를 찾고, 그 시도의 결제 모드에 저장한 키로 토스페이먼츠에 결제를 다시 조회해 반영합니다.
        다시 조회한 결제가 DONE이면 pending인 시도를 done으로, ABORTED나 EXPIRED면 failed로 바꿉니다. 시도에 pending인 취소가 있고 조회한 cancels에 맞는 취소가 있으면 그 취소를 done으로 바꿉니다.
        본문을 JSON으로 읽을 수 없거나, 다른 eventType이거나, 그런 시도가 없으면 바꾸지 않고 200입니다.
      operationId: receiveTossPaymentsWebhook
      parameters:
      - description: 웹훅을 등록한 조직의 ID
        in: path
        name: organization_id
        required: true
        schema:
