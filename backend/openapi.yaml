  /v1/invoice-payments:
    get:
      description: |
        청구서마다 현재 업무 환경의 결제 모드(test 또는 live)로 본 결제 상태를 한 줄씩 돌려줍니다. 다른 결제 모드의 시도는 보지 않습니다.
        상태는 그 결제 모드에서 가장 늦게 요청한 시도로 정합니다. total_amount가 0원이면 not_required, 시도가 없으면 unpaid, 시도가 pending이면 pending, failed면 failed입니다.
        시도가 done이면 그 시도에서 취소를 마친 금액의 합으로 정합니다. 0원이면 paid, 결제 금액보다 적으면 partially_canceled, 같으면 canceled입니다.
        순서와 거르는 조건은 청구서 목록 조회와 같습니다. 달 내림차순이고, 같은 달은 고객 이름 오름차순, 이름이 같으면 고객 ID 순입니다.
        next_retry_at과 completed_at은 KST(+09:00)로 나옵니다. 페이지를 나누지 않습니다.
      operationId: listInvoicePayments
      parameters:
      - description: "청구 월(yyyy-MM, KST)입니다. 생략하면 모든 달이 대상입니다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 주면 이 고객의 청구서만 돌려줍니다. 생략하면 모든 고객이 대상입니다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListInvoicePaymentsResponse"
          description: 청구서별 결제 상태입니다. 조건에 맞는 청구서가 없으면 invoice_payments가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: customer_id가 UUID가 아니거나, month가 yyyy-MM이\
            \ 아니거나 0001-01부터 9999-12까지의 범위 밖입니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 청구서별 결제 상태 목록 조회
