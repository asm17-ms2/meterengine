            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 요금제 버전 보관
      tags:
      - price-plan-controller
  /v1/price-plans/{id}/restorations:
    post:
      description: "보관 효력이 아직 시작되지 않았고 같은 고객 범위와 시작 월의 보관하지 않은 버전이 없을 때만 복원합니다. 그\
        \ 밖에는 409 archive_restoration_conflict이며, 이때는 새 버전을 등록합니다."
