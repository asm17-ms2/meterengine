openapi: 3.1.0
info:
  description: |
    사용량 기반 과금 서비스 MeterEngine의 API입니다. 사용량 이벤트를 수집하고, 고객별 월 사용량과 청구 예정액을 조회합니다.

    요청마다 Authorization 헤더에 Bearer 값으로 API 키(me_live_ 또는 me_test_로 시작)나
    로그인 세션 토큰을 싣습니다. 조직은 키나 세션이 정합니다. 헤더가 없으면 401입니다.

    X-MeterEngine-Environment: test 또는 live로 업무 환경을 지정합니다. 새 키는 발급한 업무 환경에 고정됩니다.
    기존 데이터와 키는 환경 미지정 범위로 보존하며, test나 live에 자동으로 배정하지 않습니다.
    업무 환경을 나누지 않는 기능에 테스트 환경이나 라이브 환경으로 요청하면(그 환경의 키를 쓰거나
    X-MeterEngine-Environment를 보내면) 409 environment_not_ready를 돌려줍니다.
    X-MeterEngine-Organization-Id: 요청할 조직을 확인하는 선택 헤더(UUID)입니다.
    인증된 조직과 다르면 403이며, 이 헤더로 인증이나 조직 전환을 대신할 수 없습니다.

    오류 응답은 code, message, errors로 이뤄집니다. 오류별 처리는 code로 분기합니다. message는
    code마다 하나인 한국어 문구이고, errors는 틀린 필드를 짚을 수 있는 400에만 실립니다.
  title: MeterEngine API
  version: v1
servers:
- description: 이 문서를 제공한 호스트
  url: /
security:
- bearerAuth: []
paths:
  /v1/api-keys:
    get:
      description: |
        세션 조직의 현재 업무 환경에 속한 API 키를 만든 순서로 돌려줍니다. 기본은 전체이며 사용 중, 폐기됨, 만료됨 상태를 고를 수 있습니다.
        사용 중은 지금 인증에 쓸 수 있는 키입니다. 폐기한 키는 만료 시각과 관계없이 폐기됨으로 분류합니다. 키 원문은 싣지 않습니다.
        로그인 세션만 부를 수 있고 API 키로는 부를 수 없습니다. 페이지를 나누지 않습니다.
      operationId: listApiKeys
      parameters:
      - description: 조회할 키 상태입니다. 생략하면 전체를 돌려줍니다.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - revoked
          - expired
          - all
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListApiKeysResponse"
          description: API 키 목록입니다. 하나도 없으면 api_keys가 빈 배열입니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: API 키 목록 조회
      tags:
      - api-key-controller
    post:
      description: |
        세션 조직의 현재 업무 환경에 API 키를 발급하고 원문을 돌려줍니다. 원문은 이 응답에서만 볼 수 있고 서버는 해시만 저장합니다.
        테스트 환경에서는 mode가 test, 라이브 환경에서는 live여야 합니다.
        replaced_api_key_id를 주면 그 키를 이 키로 교체합니다. 옛 키는 지금부터 24시간이 지나면 만료되고,
        그보다 이른 만료 시각이 이미 있으면 그대로 둡니다. 로그인 세션만 부를 수 있고 API 키로는 부를 수 없습니다.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiKeySecretResponse"
          description: 발급한 키와 원문
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: label이 비었거나 255자를 넘거나, scopes가 비었거나 ingest, read, admin, payments가 아닌 값을 담았거나,
            mode가 live나 test가 아니거나, rate_limit_per_minute가 양수가 아니거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_not_found: replaced_api_key_id에 해당하는 키가 세션 조직\
            의 현재 업무 환경에 없거나 이미 폐기됐습니다."
      summary: API 키 발급
      tags:
      - api-key-controller
  /v1/api-keys/{id}:
    delete:
      description: |
        API 키를 폐기합니다. 폐기한 키로 요청하면 401입니다. 키를 지우지 않고 폐기 시각을 남깁니다.
        이미 폐기한 키면 폐기 시각을 그대로 두고 204를 돌려줍니다. 로그인 세션만 부를 수 있고 API 키로는 부를 수 없습니다.
      operationId: deleteApiKey
      parameters:
      - description: 폐기할 키의 ID
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: 폐기했습니다. 본문은 없습니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 UUID 형식이 틀렸습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_not_found: 세션 조직의 현재 업무 환경에 그런 키가 없습니다."
      summary: API 키 폐기
      tags:
      - api-key-controller
  /v1/api-keys/{id}/scopes:
    put:
      description: "세션 조직의 현재 업무 환경에서 사용 중인 API 키의 권한만 바꿉니다. 키 원문, API 키 구분(테스트 키\
        , 라이브 키), 만료 시각은 그대로 두고 다음 요청부터 바뀐 권한을 적용합니다. 로그인 세션에 admin 권한이 있어야 하며 API\
        \ 키로는 부를 수 없습니다."
      operationId: updateApiKeyScopes
      parameters:
      - description: 권한을 바꿀 키의 ID
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApiKeyScopesRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
          description: 바뀐 키의 정보입니다. 원문과 해시는 싣지 않습니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: scopes가 비었거나 ingest, read, admin, payments가\
            \ 아닌 값을 담았습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: 로그인 세션에 admin 권한이 없습니다."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_not_found: 세션 조직의 현재 업무 환경에 그런 키가 없습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_unavailable: 폐기되거나 만료된 키입니다."
      summary: API 키 권한 변경
      tags:
      - api-key-controller
  /v1/audit-logs:
    get:
      description: |
        로그인 세션만 부를 수 있습니다. 구성원과 키 관리 이력, 요청 기록을 담고 있어 API 키로는 조회할 수 없습니다.
        현재 업무 환경의 기록과, 로그인, 구성원, 초대, 라이브 환경 이용 신청처럼 조직 공통인 기록을 함께 돌려줍니다.
      operationId: listOrganizationAuditLogs
      parameters:
      - description: 0부터 세는 페이지 번호
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: 한 페이지에 담을 기록 수(1 이상 100 이하)
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: "찾을 활동 코드(예: api_key_created). 같은 코드만 찾습니다."
        in: query
        name: action
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 0
          pattern: "[a-z]+(_[a-z]+)*"
      - description: "찾을 실행 주체 종류입니다. user_account(로그인 사용자), api_key(API 키), system(시\
          스템), anonymous(미인증 요청), invoice_view_link(청구서 조회 링크) 가운데 하나입니다."
        in: query
        name: actor_type
        required: false
        schema:
          type: string
          pattern: user_account|api_key|system|anonymous|invoice_view_link
      - description: "action, target_type, target_id와 detail의 request_id, route에서\
          \ 부분 일치로 찾을 문자열입니다. 대소문자를 가리지 않습니다."
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 0
      - description: "이 시각부터(포함)입니다. yyyy-MM-dd는 그날 KST 0시, 오프셋이 있는 ISO 8601 시각은 그\
          \ 순간입니다. 연도는 0001부터 9999까지입니다."
        in: query
        name: from
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      - description: "이 시각까지(미포함)입니다. yyyy-MM-dd는 그날 끝까지 담고(다음 날 KST 0시 미포함), 오프셋이\
          \ 있는 ISO 8601 시각은 그 순간을 뺍니다. 연도는 0001부터 9999까지입니다."
        in: query
        name: to
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      - description: "정렬 순서입니다. occurred_at_desc는 최근 순(기본), occurred_at_asc는 오래된 순\
          입니다."
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: occurred_at_desc
          pattern: occurred_at_asc|occurred_at_desc
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListAuditLogsResponse"
          description: 감사 기록 목록입니다. 조건에 맞는 것이 없으면 audit_logs가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: page, size, action, actor_type, sort가\
            \ 범위나 형식 밖이거나, from과 to가 날짜나 오프셋 있는 시각이 아니거나 연도가 0001부터 9999까지의 범위 밖이거\
            나, from이 to보다 늦거나 같습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 현재 조직 감사 기록 조회
      tags:
      - audit-log-controller
  /v1/billable-metric-prices:
    get:
      description: |
        지정한 달에 적용되는 구분 값별 최신 단가를 미터마다 돌려줍니다. customer_id가 없으면 공통 단가만, 있으면 그 고객의 고객 단가만 돌려줍니다.
        미터는 보관한 미터를 포함해 미터 코드 오름차순으로 모두 나오고, 페이지를 나누지 않습니다.
        달과 고객으로만 거르면 이 경로를 씁니다. 검색어, 여러 조건, 정렬, 페이지가 필요하면 GET /v1/billable-metric-prices/search를 씁니다.
      operationId: listBillableMetricPrices
      parameters:
      - description: "단가를 볼 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이 고객의 고객 단가만 돌려줍니다. 생략하면 공통 단가만 돌려줍니다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricPricesResponse"
          description: 미터별 단가 목록입니다. 미터가 없으면 billable_metric_prices가 빈 배열입니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
