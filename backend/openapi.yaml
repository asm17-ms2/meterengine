        "204":
          description: 인증했습니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: token이 비었거나 64자를 넘습니다."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=email_verification_not_found: 토큰이 없거나 만료됐거나 이미 썼습니다.\
            \ 어느 쪽인지는 알려 주지 않습니다. 인증 메일을 다시 받습니다."
