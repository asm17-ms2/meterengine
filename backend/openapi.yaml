  /v1/billable-metrics:
    get:
      description: "현재 업무 환경의 미터를 미터 코드 오름차순으로 모두 돌려줍니다. 페이지를 나누지 않습니다. 보관 상태로만 거르\
        면 이 경로를 씁니다. 검색어, 여러 조건, 정렬, 페이지가 필요하면 GET /v1/billable-metrics/search를 씁니\
        다."
      operationId: listBillableMetrics
      parameters:
      - description: "보관 상태입니다. active는 보관하지 않은 미터, archived는 보관한 미터, all은 둘 다입니다\
          . 생략하면 active입니다."
        in: query
        name: status
        required: false
        schema:
          type: string
          default: active
          enum:
          - active
          - archived
          - all
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricsResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 미터 목록 조회
      tags:
      - billable-metric-controller
    post:
      description: |
        미터를 등록합니다. type이 미터의 event_type과 같은 사용량 이벤트가 이 미터의 집계 대상입니다.
        aggregation(집계 함수)은 sum, count, count_distinct, min, max, avg, first, last, median, percentile을 받으며 대소문자를 구분하지 않습니다.
        count는 전체 이벤트 수이며 target_property를 지정하지 않습니다. count_distinct는 대상 속성의 숫자, 문자열, 불리언 고유값 수입니다.
        나머지는 숫자 속성만 집계합니다. first와 last는 occurred_at, transaction_id 순서입니다. median은 50백분위이고, percentile 집계 함수는 percentile 값(0~100)이 필수입니다.
        집계량을 unit_size(기본 1)로 나눈 뒤 rounding_mode(none, ceil, floor, round)의 끝수 처리를 rounding_precision(0~12, 기본 0) 자리에 적용합니다.
        round는 반올림(사사오입)입니다. none은 유한소수를 그대로 두고, 순환소수는 유효숫자와 소수 자릿수를 각각 최소 18자리로 둡니다.
        code(미터 코드)는 같은 업무 환경 안에서 유일해야 하고 등록 뒤 바꿀 수 없습니다. search, options, export는 조회 경로와 겹쳐 미터 코드로 쓸 수 없습니다.
        같은 이벤트와 속성에 여러 미터를 등록할 수 있습니다. 각 미터에 단가를 등록하면 각각 청구합니다.
      operationId: createBillableMetric
      parameters:
      - description: 1~255자 재시도 키입니다. 같은 조직과 업무 환경에서 같은 키와 같은 본문을 다시 보내면 최초 응답을 상태
          코드까지 그대로 돌려줍니다. 최초 응답을 기한 없이 보관하므로 그 뒤에 고치거나 보관해도 다시 보낸 요청의 응답은 바뀌지 않습니다.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillableMetricRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BillableMetricResponse"
          description: 등록된 미터
          headers:
            Idempotency-Replayed:
              description: 같은 Idempotency-Key의 최초 응답을 다시 돌려줄 때만 true로 붙습니다.
              schema:
                type: string
                enum:
                - "true"
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: code, name, event_type, aggregation 가운데 빈 필드가 있거나, 문자열 필드에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있습니다. Idempotency-Key가 비었거나 255자를 넘어도 이 코드입니다.
            code=invalid_billable_metric: 집계 함수와 대상 속성, 단위, 끝수 처리, 백분위 설정이 맞지 않거나 dimension_properties에 중복이나 빈 키가 있거나, code가 조회 경로와 겹치는 search, options, export입니다. 어느 필드가 왜 거절됐는지는 errors에 있습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
