              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이다."
      summary: 로그아웃
      tags:
      - session-controller
    get:
      description: |
        요청에 실은 세션 토큰의 사용자, 세션이 고른 도입사, 소속된 도입사 목록, 만료 시각을 돌려준다.
        도입사가 활성 상태가 아니어도 조회할 수 있다. API 키로는 부를 수 없다.
