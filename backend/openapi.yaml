    PaymentAttemptResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        completed_at:
          type: string
          format: date-time
        failure_code:
          type: string
          description: |
            failed일 때만 있다.
            토스페이먼츠가 준 값: 승인 거절 코드(예: REJECT_CARD_COMPANY), 또는 주문 조회로 확인한 결제 상태 ABORTED, EXPIRED.
            MeterEngine이 정한 값: HTTP_<상태>(토스페이먼츠 거절 응답에 코드가 없을 때 그 HTTP 상태), NOT_FOUND_PAYMENT(결제를 요청하고 payment.not-found-failure-delay(기본 10분)가 지나도 토스페이먼츠 주문 조회가 404 NOT_FOUND_PAYMENT일 때. 토스페이먼츠 조회 오류 코드와 이름이 같지만 결제 거절이 아니라 MeterEngine의 판정이다), toss_payments_credential_missing(토스페이먼츠를 부르기 전에 결제 모드의 키가 없었다), payment_method_missing(토스페이먼츠를 부르기 전에 결제 모드의 카드가 없었다).
        failure_message:
          type: string
          description: "failed일 때만 있다. 토스페이먼츠가 준 거절 문구이거나, failure_code가 MeterEngine\
            \ 코드면 그 오류 문구다"
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        mode:
          type: string
          description: 결제한 결제 모드. test 또는 live
          enum:
          - test
          - live
        payment_key:
          type: string
          description: 토스페이먼츠가 승인한 결제의 키. done일 때만 있다
        requested_at:
          type: string
          format: date-time
        status:
          type: string
          description: pending은 토스페이먼츠 결과를 아직 확인하지 못한 시도다
          enum:
          - pending
          - done
          - failed
    PaymentCancellationResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          description: 취소한 금액. 원 단위 정수
        completed_at:
          type: string
          format: date-time
        failure_code:
          type: string
          description: |
            failed일 때만 있다.
            토스페이먼츠가 준 값: 취소 거절 코드(예: NOT_CANCELABLE_AMOUNT).
            MeterEngine이 정한 값: HTTP_<상태>(토스페이먼츠 거절 응답에 코드가 없을 때 그 HTTP 상태), NOT_FOUND_CANCELLATION(취소를 요청하고 payment.not-found-failure-delay(기본 10분)가 지나도 토스페이먼츠 결제 조회에 이 취소에 맞는 취소 거래가 없을 때. 토스페이먼츠 코드가 아니다), toss_payments_credential_missing(토스페이먼츠를 부르기 전에 결제 모드의 키가 없었다).
        failure_message:
          type: string
          description: "failed일 때만 있다. 토스페이먼츠가 준 거절 문구이거나, failure_code가 MeterEngine\
            \ 코드면 그 오류 문구다"
        id:
          type: string
          format: uuid
        mode:
          type: string
          description: 취소한 결제 시도의 결제 모드. test 또는 live
          enum:
          - test
          - live
        payment_attempt_id:
          type: string
          format: uuid
        reason:
          type: string
          description: 취소 사유
        requested_at:
          type: string
          format: date-time
        status:
          type: string
          description: pending은 토스페이먼츠 결과를 아직 확인하지 못한 취소다
          enum:
          - pending
          - done
          - failed
