          pattern: owner|admin
      required:
      - organization_role
    UpdateOrganizationMemberScopesRequest:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
            pattern: ^(ingest|read|admin)$
          minItems: 1
      required:
      - scopes
    UpdateOrganizationStatusRequest:
      type: object
      properties:
        status:
          type: string
          description: 바꿀 상태
          enum:
          - pending
          - active
          - rejected
          - suspended
          minLength: 1
          pattern: pending|active|rejected|suspended
      required:
      - status
    UpdatePaymentSettingRequest:
      type: object
      properties:
        mode:
          type: string
          description: 결제에 쓸 모드. test 또는 live
          enum:
          - test
          - live
          minLength: 1
          pattern: test|live
      required:
      - mode
    UpdateSessionOrganizationRequest:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          description: 바꿀 도입사. 사용자가 소속된 도입사여야 한다
      required:
      - organization_id
    UpdateSupplierRequest:
      type: object
      properties:
        business_address:
          type: string
          maxLength: 1000
          minLength: 0
        business_registration_number:
          type: string
          minLength: 1
          pattern: "[0-9]{10}"
        representative_name:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - business_address
      - business_registration_number
      - representative_name
    UpdateTossPaymentsCredentialRequest:
      type: object
      properties:
        client_key:
          type: string
          description: "토스페이먼츠 클라이언트 키. test 모드는 test_ck_, live 모드는 live_ck_로 시작한다"
          minLength: 1
        secret_key:
          type: string
          description: "토스페이먼츠 시크릿 키. test 모드는 test_sk_, live 모드는 live_sk_로 시작한다.\
            \ 암호화해 저장하고 어떤 응답에도 원문을 싣지 않는다"
          minLength: 1
      required:
      - client_key
      - secret_key
    UpdateUserAccountRoleRequest:
      type: object
      properties:
        role:
          type: string
          description: 바꿀 역할
          enum:
          - member
          - operator
          minLength: 1
          pattern: member|operator
      required:
      - role
    UpdateWebhookEndpointRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
          minLength: 0
        enabled:
          type: boolean
        event_types:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 20
          minItems: 0
        url:
          type: string
          maxLength: 2048
          minLength: 0
      required:
      - enabled
      - event_types
      - url
    UserAccountOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          description: 도입사 상태
          enum:
          - pending
          - active
          - rejected
          - suspended
    UserAccountResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        organizations:
          type: array
          description: 사용자가 소속된 도입사. 소속된 순서
          items:
            $ref: "#/components/schemas/UserAccountOrganization"
        role:
          type: string
          description: 사용자 역할
          enum:
          - member
          - operator
    WebhookDeliveryResponse:
      type: object
      properties:
        attempt_count:
          type: integer
          format: int32
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        created_at:
          type: string
          format: date-time
        failure_reason:
          type: string
        id:
          type: string
          format: uuid
        last_attempted_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
        response_status:
          type: integer
          format: int32
        status:
          type: string
        type:
          type: string
        webhook_event_id:
          type: string
          format: uuid
    WebhookEndpointResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        description:
          type: string
        enabled:
          type: boolean
        event_types:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        secret:
          type: string
        url:
          type: string
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
