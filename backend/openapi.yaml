        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListInvoicesResponse"
          description: 청구서 목록입니다. 조건에 맞는 것이 없으면 invoices가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: customer_id가 UUID가 아니거나, month가 yyyy-MM이\
            \ 아니거나 0001-01부터 9999-12까지의 범위 밖입니다."
        "401":
          content:
