      description: "수집을 거절한 이벤트의 기록을 최신 기록부터 돌려줍니다. month는 거절을 기록한 달(KST)입니다. 기록을\
        \ 시작한 뒤(recording_started_at)에 거절한 단건 요청의 customer_not_found, customer_archived,\
