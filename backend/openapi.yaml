              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 청구서 목록 조회
      tags:
      - invoice-controller
    post:
      description: |
        그 달 청구 예정액이 0원이 아닌 고객을 한 번에 확정합니다. 세액은 공급가액의 10%입니다.
        다음 달 2일 04:00 KST가 지나면 남은 고객은 자동으로 확정됩니다. 그 전에 확정하거나 자동 확정이 보류한 고객을 확정할 때 이 경로를 씁니다.
        그 달에 발생했고 집계 마감 시각(다음 달 2일 00:00 KST) 전에 받은 이벤트로 확정하므로, 마감이 지난 달의 확정 금액과 청구 항목은 그 시점의 청구 예정액과 같습니다.
        마감 시각 전에 확정하면 확정 시각까지 받은 이벤트로 확정하고 그 시각을 청구서의 cutoff_at에 남깁니다.
        수량이 0인 청구 항목은 청구서에 싣지 않습니다. 확정한 고객은 그 달 청구 예정액에서 빠집니다.
        그 달이 이미 확정된 고객은 건너뜁니다. 그래서 같은 달로 다시 부르거나 동시에 불러도 청구서가 겹치지 않습니다.
        고객마다 따로 확정합니다. 한 고객의 확정이 실패해도 다른 고객의 확정은 남고, 실패한 고객은 failed_count에 세며 다시 부르면 다시 시도합니다.
        확정은 되돌릴 수 없고, 확정한 뒤 그 달에 들어온 그 고객의 이벤트는 청구되지 않습니다.
        finalized_count는 이번 호출로 새로 확정한 청구서 수입니다. 확정된 내용은 청구서 목록 조회로 봅니다.
      operationId: finalizeInvoices
      parameters:
      - description: "확정할 달(yyyy-MM, KST)"
        example: 2026-08
        in: query
        name: month
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalizeInvoicesResponse"
          description: "확정한 달, 새로 확정한 청구서 수, 확정하지 못한 고객 수입니다. 확정할 고객이 없으면 두 수가 모두\
            \ 0입니다."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: month가 없거나 yyyy-MM이 아니거나 0001-01부터\
            \ 9999-12까지의 범위 밖입니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 청구서 일괄 확정
      tags:
      - invoice-controller
  /v1/invoices/draft:
    get:
      description: |
        아직 확정하지 않은 고객의 청구 예정액을 미터의 구분 값별 사용량에 그 구분 값의 단가를 곱해 계산해 돌려줍니다.
        달 하나의 모든 고객을 한 번에 보려면 이 경로를 씁니다. 검색어, 여러 조건, 정렬, 페이지가 필요하면 GET /v1/invoices/draft/search를 씁니다.
        그 달이 확정된 고객은 나오지 않고 total_amount는 아직 이 달을 확정하지 않은 고객의 합입니다. 확정된 금액은 청구서 목록 조회로 봅니다.
        조회할 때마다 계산하며 저장하지 않습니다. 기간은 KST 기준의 달입니다.
        그 달 이벤트 가운데 수신 시각(received_at)이 집계 마감 시각(다음 달 2일 00:00 KST)보다 이른 것만 집계합니다. 마감 뒤에 받은 그 달 이벤트는 저장되지만 집계와 청구에 들지 않습니다.
        금액은 원 단위 정수입니다. 고객, 미터, 구분 값마다 생기는 청구 항목마다 10원 미만을 버린 뒤 더합니다. 10원이 안 되는 청구 항목은 0원입니다.
        청구 항목은 사용량이 있는 구분 값 가운데 같은 dimension_values의 단가가 있는 것만 나옵니다. 요금제가 걸린 고객은 사용량이 있으면 기본료와 최소 사용료 조정 항목도 나옵니다. 이벤트가 없는 고객은 lines가 빈 배열입니다.
        단가가 없는 구분 값은 청구 항목과 금액에서 빠지고, 수량이 0이 아니면 그 고객의 unpriced_usages에 미터 코드, target_property, 구분 값, 수량으로 나옵니다. 순서는 청구 항목과 같습니다.
        고객은 이름 오름차순, 청구 항목은 미터 코드 오름차순, 같은 미터 안에서는 dimension_values 오름차순입니다. 페이지를 나누지 않습니다.
      operationId: previewDraftInvoice
      parameters:
      - description: "집계할 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftInvoiceResponse"
          description: 고객별 청구 예정액입니다. 단가가 있는 사용량이 없고 요금제도 적용되지 않는 고객은 lines가 빈 배열입니다.
            요금제가 있는 고객은 단가 없는 사용량만 있어도 기본료와 최소 사용료 조정 항목이 나옵니다. 모든 고객이 확정됐으면 customers가
            빈 배열이고 total_amount가 0입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: month가 yyyy-MM이 아니거나 0001-01부터 9999-12까\
            지의 범위 밖입니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 청구 예정액 조회
      tags:
      - invoice-controller
  /v1/invoices/draft/export:
    get:
      description: "GET /v1/invoices/draft/search와 같은 조건에 맞는 결과를 페이지를 나누지 않고 모두 내보\
        냅니다. 최대 10,000행이며 넘으면 400입니다."
      operationId: exportDrafts
      parameters:
      - description: "검색어입니다. 고객 이름, external_id, 고객 ID에 이 글자가 들어 있는 고객을 찾고, 대소문자를\
          \ 가리지 않습니다."
        in: query
        name: q
        schema:
          type: string
          maxLength: 2000
      - description: "정렬 기준입니다. customer_name, customer_id, amount, line_count(청구\
          \ 항목 수) 가운데 하나이고 생략하면 customer_name입니다."
        in: query
        name: sort
        schema:
          type: string
          maxLength: 2000
      - description: 정렬 방향입니다. asc(오름차순)나 desc(내림차순)이고 생략하면 asc입니다.
        in: query
        name: order
        schema:
          type: string
          enum:
          - asc
          - desc
      - description: "청구 예정액을 계산할 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다."
        in: query
        name: month
        schema:
          type: string
          example: 2026-08
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      - description: 이 고객 ID(UUID)의 고객만 돌려줍니다. 현재 업무 환경에 없는 고객이면 404입니다.
        in: query
        name: customer_id
        schema:
          type: string
          format: uuid
      - description: "이 미터 코드의 청구 항목만 담고, amount는 그 청구 항목만 더한 금액입니다."
        in: query
        name: billable_metric_code
        schema:
          type: string
          maxLength: 2000
      - description: "고객별 청구 예정액(amount, 원)이 이 값 이상인 고객만 돌려줍니다."
        in: query
        name: min_amount
        schema:
          type: integer
          format: int64
          minimum: 0
      - description: "고객별 청구 예정액(amount, 원)이 이 값 이하인 고객만 돌려줍니다."
        in: query
        name: max_amount
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
          description: "같은 검색 조건 전체의 CSV입니다. UTF-8 BOM과 CRLF를 쓰고, 수식으로 읽힐 문자열은 앞에\
            \ 작은따옴표를 붙입니다."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 받지 않는 쿼리 파라미터가 있거나 값의 형식이나 범위가 틀렸습니\
            다. 어느 값인지는 errors에 있습니다. 조건 전체가 10,000행을 넘어도 이 코드이며 errors의 field는 export입\
            니다. 범위를 좁혀 다시 보냅니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id의 고객이 현재 조직과 업무 환경에 없습\
            니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 청구 예정액 내보내기
      tags:
      - workspace-query-controller
