  /v1/signups:
    post:
      description: |
        도입사와 그 도입사에 소속된 member 사용자를 만들고 필수 동의를 기록한다.
        도입사는 pending으로 만들어지고 운영자가 승인해 active가 될 때까지 로그인하면 403(organization_not_active)이다.
        이메일은 소문자로 바꿔 저장한다.
      operationId: createSignup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSignupRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SignupResponse"
          description: 만든 도입사와 사용자
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: organization_name이나 name이 비었거나 255자를 넘거나, email이 이메일 형식이 아니거나 254자를 넘거나,
            password가 8자보다 짧거나 72자나 UTF-8 72바이트를 넘거나, consents에 terms_of_service와 privacy_policy가 한 번씩 있지 않거나,
            document_version이 비었거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=invalid_credentials: Authorization 헤더를 실었는데 그 값이 올바르지\
            \ 않다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=email_already_exists: 대소문자를 가리지 않고 같은 이메일로 가입한 사용자가 있\
            다"
