  /v1/customers:
    get:
      description: |
        등록한 고객을 이름 오름차순으로 전부 돌려줍니다. 이름이 같으면 id 순입니다.
        사용량 조회, 청구 예정액 조회의 고객 순서와 같습니다.
        페이지를 나누지 않고 external_id와 status로만 거릅니다. 검색어, 여러 조건, 정렬, 페이지가 필요하면 GET /v1/customers/search를 씁니다.
      operationId: listCustomers
      parameters:
      - description: external_id가 이 값과 같은 고객만 돌려줍니다. 1~255자입니다.
        in: query
        name: external_id
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 1
      - description: 보관 상태입니다. 생략하면 active입니다.
        in: query
        name: status
        required: false
        schema:
          type: string
          default: active
          enum:
          - active
          - archived
          - all
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListCustomersResponse"
          description: 고객 목록입니다. 한 명도 없으면 customers가 빈 배열입니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 고객 목록 조회
      tags:
      - customer-controller
    post:
      description: |
        고객을 등록하고 서버가 발급한 id와 함께 돌려줍니다. 사용량 이벤트를 보낼 때 이 id를 customer_id에 싣습니다.
        external_id는 같은 업무 환경 안에서 고유합니다. 같은 external_id를 다시 보내면 기존 고객을 200으로 돌려주고 이름과 이메일은 바꾸지 않습니다. external_id를 생략하면 매번 새 고객을 만듭니다. Idempotency-Key를 쓰면 같은 키와 같은 본문으로 다시 보내도 최초 응답을 돌려줍니다. 같은 키와 다른 본문은 409입니다.
        billing_email은 선택 입력인 청구 담당 이메일입니다. 저장만 하며 MeterEngine은 이 주소로 메일을 보내지 않습니다. 없으면 빼거나 null로 보냅니다.
      operationId: createCustomer
      parameters:
      - description: 1~255자 재시도 키입니다. 같은 조직과 업무 환경에서 같은 키와 같은 본문을 다시 보내면 최초 응답을 상태
          코드까지 그대로 돌려줍니다. 이름과 billing_email을 담은 최초 응답을 기한 없이 보관하므로 그 뒤에 고치거나 보관해도
          다시 보낸 요청의 응답은 바뀌지 않습니다.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: "같은 external_id로 이미 등록한 고객입니다. read(조회) 권한이 없으면 id, external_id,\
            \ version만 채우고 name, billing_email, created_at, archived_at은 null입니다."
          headers:
            Idempotency-Replayed:
              description: 같은 Idempotency-Key의 최초 응답을 다시 돌려줄 때만 true로 붙습니다.
              schema:
                type: string
                enum:
                - "true"
              style: simple
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 등록된 고객
          headers:
            Idempotency-Replayed:
              description: 같은 Idempotency-Key의 최초 응답을 다시 돌려줄 때만 true로 붙습니다.
              schema:
                type: string
                enum:
                - "true"
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: name이 비었거나 255자를 넘거나 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았거나, billing_email이 이메일 형식이 아니거나(@ 뒤 도메인에 점이 있어야 합니다) 254자를 넘거나, Idempotency-Key가 비었거나 255자를 넘습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=customer_archived: 같은 external_id의 고객을 보관했습니다. POST /v1/customers/{id}/restorations로 복원한 뒤 다시 보냅니다.
            code=idempotency_conflict: 같은 Idempotency-Key를 다른 요청 본문에 썼습니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 고객 등록
      tags:
      - customer-controller
  /v1/customers/export:
