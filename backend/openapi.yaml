openapi: 3.1.0
info:
  description: |
    사용량 기반 과금 플랫폼의 API. 사용량 이벤트를 수집하고, 고객별 월 사용량과 청구 예정액을 조회한다.

    모든 요청에 X-Organization-Id 헤더로 도입사 ID를 보낸다. 인증이 붙기 전까지 쓰는 임시 헤더다.

    오류 응답은 code, message, errors로 이뤄진다. 오류별 처리는 code로 분기한다. message는
    code마다 하나인 한국어 문구이고, errors는 틀린 필드를 짚을 수 있는 400에만 실린다.
  title: MeterEngine API
  version: v1
servers:
- description: 이 문서를 제공한 호스트
  url: /
paths:
  /v1/billable-metric-prices:
    get:
      description: |
        등록한 미터를 code 오름차순으로 전부 돌려주고, 미터마다 dimension_properties와 조합별 단가를 붙인다.
        dimension_properties가 빈 배열이면 이벤트 속성에 따라 단가가 갈리지 않는다는 뜻이다.
        price_rates는 그 미터의 단가 전부를 dimension_values 오름차순으로 실은 배열이고, 단가가 없으면 빈 배열이다.
        dimension_values가 빈 객체인 요소가 속성 조건 없이 적용되는 기본 단가다.
        페이지를 나누지 않는다.
      operationId: listBillableMetricPrices
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricPricesResponse"
          description: 미터별 가격 목록. 미터가 없으면 billable_metric_prices가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 미터별 가격 목록 조회
      tags:
      - billable-metric-price-controller
  /v1/billable-metrics:
    get:
      description: |
        등록한 미터를 code 오름차순으로 전부 돌려준다.
        X-Organization-Id가 등록되지 않은 도입사여도 오류가 아니라 빈 배열이다.
        페이지를 나누지 않는다.
      operationId: listBillableMetrics
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricsResponse"
          description: 미터 목록. 미터가 없으면 billable_metrics가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 미터 목록 조회
      tags:
      - billable-metric-controller
    post:
      description: |
        미터를 등록한다. type이 미터의 event_type과 같은 사용량 이벤트가 이 미터의 집계 대상이다.
        aggregation은 sum만 받는다. sum은 이벤트 properties에서 target_property 키의 값을 합산하므로
        target_property가 필수다.
        code는 도입사 안에서 유일해야 하고 등록 뒤 바꿀 수 없다.
        event_type과 target_property의 조합도 도입사 안에서 유일해야 한다.
      operationId: createBillableMetric
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillableMetricRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BillableMetricResponse"
          description: 등록된 미터
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: code, name, event_type, aggregation 중 빈 필드가 있거나, 문자열 필드에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=invalid_billable_metric: aggregation이 sum이 아니거나, sum인데 target_property가 없거나, dimension_properties에 같은 키가 두 번 있거나 빈 키가 있다. 어느 필드가 왜 거절됐는지는 errors에 있다.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=billable_metric_already_exists: 같은 code의 미터가 이미 있다.
            code=billable_metric_event_type_target_property_already_exists: event_type과 target_property가 같은 미터가 이미 있다.
      summary: 집계 미터 등록
      tags:
      - billable-metric-controller
  /v1/billable-metrics/{code}:
    delete:
      description: |
        미터를 지운다. 지운 미터는 되돌릴 수 없다.
        집계된 이벤트가 한 건이라도 있거나 단가가 붙은 미터는 지울 수 없고 409다.
        이미 지운 미터를 다시 지우면 404다.
      operationId: deleteBillableMetric
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 지울 미터의 code.
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: 지웠다. 본문 없음
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 code에 NUL 문자나 짝이 없는 UTF-16 서로게이\
            트가 있거나, X-Organization-Id가 없거나 UUID가 아니다."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=billable_metric_not_found: 그런 code의 미터가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=billable_metric_has_events: 집계된 이벤트가 있어 지울 수 없다.
            code=billable_metric_has_price_rate: 단가가 붙어 있어 지울 수 없다.
      summary: 집계 미터 삭제
      tags:
      - billable-metric-controller
    put:
      description: |
        미터를 요청 값으로 덮어쓰고 바뀐 미터를 돌려준다. code는 바꿀 수 없다.
        event_type이나 target_property를 바꾸면 사용량은 새 기준으로 다시 집계된다.
        옛 기준으로 집계된 이벤트가 한 건이라도 있으면 event_type과 target_property는 바꿀 수 없고 409다.
      operationId: updateBillableMetric
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 고칠 미터의 code.
        in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillableMetricRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BillableMetricResponse"
          description: 바뀐 미터
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: name, event_type, aggregation 중 빈 필드가 있거나, 문자열 필드나 경로의 code에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=invalid_billable_metric: aggregation이 sum이 아니거나, sum인데 target_property가 없거나, dimension_properties에 같은 키가 두 번 있거나 빈 키가 있다. 어느 필드가 왜 거절됐는지는 errors에 있다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=billable_metric_not_found: 그런 code의 미터가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=billable_metric_has_events: 집계된 이벤트가 있어 event_type과 target_property를 바꿀 수 없다.
            code=billable_metric_event_type_target_property_already_exists: 바꾸려는 event_type과 target_property의 미터가 이미 있다.
      summary: 집계 미터 수정
      tags:
      - billable-metric-controller
  /v1/billable-metrics/{code}/price-rates:
    delete:
      description: |
        미터에서 속성 값 조합 하나의 단가를 지운다. dimension_values는 JSON 객체 문자열이고,
        빈 객체 {}는 기본 단가다. 같은 조합인지는 키 순서와 상관없이 본다.
      operationId: deletePriceRate
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 단가를 지울 미터의 code.
        in: path
        name: code
        required: true
        schema:
          type: string
      - description: 지울 조합. JSON 객체 문자열이다.
        in: query
        name: dimension_values
        required: true
        schema:
          type: string
      responses:
        "204":
          description: 지웠다. 본문 없음
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: dimension_values가 없거나 JSON 객체가 아니거나\
            , 경로의 code에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, X-Organization-Id가 없거나 UUID가\
            \ 아니다."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=price_rate_not_found: 그 미터에 그 조합의 단가가 없다"
      summary: 단가 삭제
      tags:
      - price-rate-controller
    post:
      description: |
        미터에 속성 값 조합별 단가를 넣는다. dimension_values의 키 집합은 미터의 dimension_properties와 같아야 하고,
        키가 없는 미터는 빈 객체 하나만 받는다. 청구는 조합이 정확히 같은 단가만 쓰고 폴백은 없다.
        같은 조합의 단가가 이미 있으면 unit_price를 덮어쓴다. 수정 엔드포인트는 따로 없다.
      operationId: createPriceRate
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 단가를 넣을 미터의 code.
        in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriceRateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PriceRateResponse"
          description: 저장된 단가. 덮어쓴 경우에도 201이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: dimension_values나 unit_price가 없거나, unit_price가 음수거나, 경로의 code에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=invalid_price_rate: dimension_values의 키 집합이 미터의 dimension_properties와 다르거나, 값이 문자열, 숫자, 불리언이 아니다. 어느 필드가 왜 거절됐는지는 errors에 있다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=billable_metric_not_found: 그런 code의 미터가 없다"
      summary: 단가 등록
      tags:
      - price-rate-controller
  /v1/customers:
    get:
      description: |
        등록한 고객을 이름 오름차순으로 전부 돌려준다. 이름이 같으면 id 순이다.
        사용량 조회, 청구 예정액 조회의 고객 순서와 같다.
        X-Organization-Id가 등록되지 않은 도입사여도 오류가 아니라 빈 배열이다.
        페이지를 나누지 않는다.
      operationId: listCustomers
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListCustomersResponse"
          description: 고객 목록. 한 명도 없으면 customers가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 고객 목록 조회
      tags:
      - customer-controller
    post:
      description: |
        고객을 등록하고 서버가 발급한 id와 함께 돌려준다. 사용량 이벤트를 보낼 때 이 id를 customer_id에 싣는다.
        이름이 같은 고객을 여럿 등록할 수 있다. 구별은 id로 한다.
      operationId: createCustomer
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 등록된 고객
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: name이 비었거나 255자를 넘거나 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았거나, X-Organization-Id가 없거나 UUID가 아니다.
      summary: 고객 등록
      tags:
      - customer-controller
  /v1/customers/{id}:
    delete:
      description: |
        고객을 지운다. 지운 고객은 목록과 사용량, 청구 예정액에서 빠지고
        그 id로 보낸 이벤트는 404(customer_not_found)로 거절된다. 지운 고객은 되돌릴 수 없다.
        사용량 이벤트가 한 건이라도 있는 고객은 지울 수 없고 409다.
        이미 지운 고객을 다시 지우면 404다.
      operationId: deleteCustomer
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 지울 고객의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: 지웠다. 본문 없음
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 헤더나 경로의 UUID 형식이 틀렸다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: 그런 고객이 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=customer_has_events: 사용량 이벤트가 있는 고객이라 지울 수 없다.
            code=customer_has_payment_attempts: 결제 기록이 있는 고객이라 지울 수 없다.
      summary: 고객 삭제
      tags:
      - customer-controller
    put:
      description: |
        고객 이름을 바꾸고 바뀐 고객을 돌려준다.
      operationId: updateCustomer
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 고칠 고객의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 바뀐 고객
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: name이 비었거나 255자를 넘거나 NUL 문자나 짝이 없는\
            \ UTF-16 서로게이트를 담았거나, 헤더나 경로의 UUID 형식이 틀렸다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: 그런 고객이 없다"
      summary: 고객 수정
      tags:
      - customer-controller
  /v1/events:
    get:
      description: |
        지정한 달의 이벤트를 occurred_at 최신순으로 한 페이지씩 돌려준다.
        occurred_at이 같으면 transaction_id 내림차순이다.
        기간은 KST 기준의 달이다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 든다. 사용량 조회와 기준이 같다.
        customer_id, month, type을 함께 주면 모두 만족하는 이벤트만 나오고, total은 조건을 적용한 뒤의 건수다.
        properties는 저장된 값 그대로다. 키 순서와 공백은 보낸 것과 다를 수 있고, 숫자 자릿수는 그대로다.
      operationId: listEvents
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 0부터 세는 페이지 번호.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: 한 페이지에 담을 개수.
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: 고객을 좁힌다. 생략하면 모든 고객이 대상이다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "조회할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이벤트 type을 좁힌다. 어느 미터의 event_type도 아닌 값이어도 저장된 이벤트는 조회된다.
        in: query
        name: type
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListEventsResponse"
          description: 한 페이지 분량의 이벤트. 조건에 맞는 것이 없으면 events가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: page가 음수거나 size가 1~100 밖이거나, customer_id가 UUID가
            아니거나 month가 yyyy-MM이 아니거나 0001-01부터 9999-12까지의 범위 밖이거나, type에 NUL 문자나 짝이 없는 UTF-16 서로게이트가
            있거나, X-Organization-Id가 없거나 UUID가 아니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없다"
      summary: 사용량 이벤트 조회
      tags:
      - event-controller
    post:
      description: |
        사용량 이벤트 한 건을 저장한다.
        transaction_id가 같은 이벤트를 다시 보내면 저장하지 않고 처음 저장한 이벤트를 유지한다.
        이때도 응답은 200이고 duplicate가 true다. 응답을 받지 못했으면 같은 transaction_id로 다시 보내면 된다.
        properties는 키나 문자열 값에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나 숫자가 소수점 앞 131072자리나 소수점 뒤 16383자리를 넘으면 거절하고, 그 밖의 내용은 검증하지 않는다.
        키 순서와 공백은 보존되지 않고, 숫자는 정수와 소수 모두 자릿수가 잘리지 않는다.
        timestamp는 이벤트가 발생한 시각이고 조회 응답에서는 occurred_at으로 나온다.
        received_at은 서버가 받은 시각이며 요청에 실어도 무시된다.
        timestamp가 서버의 수집 판정 시각보다 35일 넘게 과거이면 받지 않는다. 1일은 24시간이며, 정확히 35일 전인 이벤트는 받는다.
        이미 저장된 transaction_id면 timestamp가 받는 기간 밖이어도 거절하지 않고 duplicate=true로 답한다.
      operationId: ingestEvent
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
          description: 저장했다(duplicate=false). 이미 저장된 transaction_id면 duplicate=true다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 필수 필드가 없거나 형식이 틀렸거나, 문자열(properties 안쪽 포함)에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, properties의 숫자가 소수점 앞 131072자리나 소수점 뒤 16383자리를 넘거나, timestamp가 기원전 4713-01-01T00:00:00Z부터 294276-12-31T23:59:59.999999Z까지의 범위 밖이다. 어느 필드가 왜 거절됐는지는 errors에 있다.
            code=event_too_old: timestamp가 수집 판정 시각보다 35일 넘게 과거이다. 같은 이벤트를 다시 보내도 받지 않는다. errors[0].field는 timestamp다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없다"
      summary: 사용량 이벤트 수집
      tags:
      - event-controller
  /v1/invoices:
    get:
      description: |
        확정된 인보이스를 (고객, 달)마다 한 줄씩 돌려준다. 확정 전의 금액은 청구 예정액 조회로 본다.
        customer_id와 month를 함께 주면 둘 다 만족하는 인보이스만 나온다. month를 생략하면 모든 달이다.
        달 내림차순이고, 같은 달은 고객 이름 오름차순, 이름이 같으면 고객 id 순이다.
        supply_amount, tax_amount, total_amount는 확정할 때 저장한 공급가액, 세액, 합계(공급가액 + 세액)이고 원 단위 정수다.
        lines는 확정할 때 저장한 조합별 수량, 단가, 금액이고 미터 code 오름차순, 같은 미터 안에서는 dimension_values 오름차순이다. 조회할 때 다시 계산하지 않아 뒤에 단가를 고쳐도 바뀌지 않는다. 라인 금액의 합이 supply_amount다.
        finalized_at은 KST(+09:00)로 나온다. customer_name은 확정할 때 저장한 고객 이름이라 뒤에 이름을 고쳐도 바뀌지 않는다. 페이지를 나누지 않는다.
      operationId: listInvoices
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 고객을 좁힌다. 생략하면 모든 고객이 대상이다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "인보이스의 달(yyyy-MM, KST). 생략하면 모든 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListInvoicesResponse"
          description: 인보이스 목록. 조건에 맞는 것이 없으면 invoices가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니거나,\
            \ customer_id가 UUID가 아니거나, month가 yyyy-MM이 아니거나 0001-01부터 9999-12까지의 범\
            위 밖이다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없다"
      summary: 인보이스 목록 조회
      tags:
      - invoice-controller
    post:
      description: |
        그 달 청구 예정액이 0원이 아닌 고객을 한 번에 확정한다. 확정 금액과 라인은 그 시점의 청구 예정액과 같고, 세액은 공급가액의 10%다.
        수량이 0인 라인은 인보이스에 싣지 않는다. 확정한 고객은 그 달 청구 예정액에서 빠진다.
        그 달이 이미 확정된 고객은 건너뛴다. 그래서 같은 달로 다시 불러도 인보이스가 겹치지 않는다.
        확정은 되돌릴 수 없고, 확정한 뒤 그 달에 들어온 그 고객의 이벤트는 청구되지 않는다.
        finalized_count는 이번 호출로 새로 확정한 인보이스 수다. 확정된 내용은 인보이스 목록 조회로 본다.
      operationId: finalizeInvoices
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: "확정할 달(yyyy-MM, KST)."
        example: 2026-08
        in: query
        name: month
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FinalizeInvoicesResponse"
          description: 확정한 달과 새로 확정한 인보이스 수. 확정할 고객이 없으면 0이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니거나,\
            \ month가 없거나 yyyy-MM이 아니거나 0001-01부터 9999-12까지의 범위 밖이다"
      summary: 인보이스 일괄 확정
      tags:
      - invoice-controller
  /v1/invoices/draft:
    get:
      description: |
        아직 확정하지 않은 고객의 청구 예정액을 미터의 속성 값 조합별 사용량 x 그 조합의 단가로 계산해 돌려준다.
        그 달이 확정된 고객은 나오지 않고 total_amount는 남은 고객의 합이다. 확정된 금액은 인보이스 목록 조회로 본다.
        조회할 때마다 계산하며 저장하지 않는다. 기간은 KST 기준의 달이다.
        금액은 원 단위 정수다. 라인(고객 x 미터 x 조합)마다 10원 미만을 버린 뒤 합산한다. 10원이 안 되는 라인은 0원이다.
        라인은 사용량이 있는 조합 가운데 같은 dimension_values의 단가가 있는 것만 나온다. 이벤트가 없는 고객은 lines가 빈 배열이다.
        단가가 없는 조합은 라인과 금액에서 빠지고, 수량이 0이 아니면 그 고객의 unpriced_usages에 미터 code, target_property, 조합, 수량으로 나온다. 순서는 라인과 같다.
        고객은 이름 오름차순, 라인은 미터 code 오름차순, 같은 미터 안에서는 dimension_values 오름차순이다.
      operationId: previewDraftInvoice
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: "집계할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftInvoiceResponse"
          description: 고객별 청구 예정액. 단가가 있는 조합의 사용량이 없는 고객은 lines가 빈 배열이다. 모든 고객이 확정됐으면
            customers가 빈 배열이고 total_amount가 0이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니거나,\
            \ month가 yyyy-MM이 아니거나 0001-01부터 9999-12까지의 범위 밖이다"
      summary: 청구 예정액 조회
      tags:
      - draft-invoice-controller
  /v1/invoices/{id}/payment-attempts:
    post:
      description: |
        인보이스의 total_amount를 그 인보이스의 고객에게 청구한다. 본문은 받지 않는다.
        지금은 Mock PG라 항상 승인되고, status=done인 결제 시도가 남는다. payment_key는 PG가 준 승인 키다.
        인보이스 하나에 결제 중이거나 결제된 시도는 하나뿐이다. 이미 있으면 409다.
        requested_at과 completed_at은 KST(+09:00)로 나온다.
      operationId: createPaymentAttempt
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 결제할 인보이스의 id.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentAttemptResponse"
          description: 승인된 결제 시도
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니거나,\
            \ 경로의 id가 UUID가 아니다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=invoice_not_found: 그런 인보이스가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=invoice_already_paid: 이 인보이스에 결제 중이거나 결제된 시도가 이미 있다.
            code=invoice_amount_zero: 인보이스의 total_amount가 0원이다.
      summary: 인보이스 결제 요청
      tags:
      - payment-attempt-controller
  /v1/usage:
    get:
      description: |
        미터마다 type이 그 미터의 event_type과 같은 이벤트를 고객별로 합산해 돌려준다.
        기간은 KST 기준의 달이다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 든다.
        모든 고객이 응답에 나오며, 이벤트가 없는 고객은 quantity가 0이고 dimension_usages가 빈 배열이다.
        dimension_usages는 미터의 dimension_properties마다 이벤트 properties에서 뽑은 값의 조합별로 수량을 나눈 것이고,
        고객의 quantity는 그 합이다. 미터에 dimension_properties가 없으면 dimension_values가 빈 객체인 요소 하나다.
        properties의 target_property 값이 숫자가 아닌 이벤트는 합계에서 빠진다.
        금액은 싣지 않는다. 금액은 청구 예정액 조회(GET /v1/invoices/draft)가 준다.
      operationId: aggregateBillableMetricUsages
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: "집계할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricUsagesResponse"
          description: "미터별, 고객별 사용량. 등록한 미터가 없으면 billable_metric_usages가 빈 배열이다"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니거나,\
            \ month가 yyyy-MM이 아니거나 0001-01부터 9999-12까지의 범위 밖이다"
      summary: 고객별 월 사용량 조회
      tags:
      - billable-metric-usage-controller
components:
  schemas:
    BillableMetricPricePriceRate:
      type: object
      properties:
        dimension_values:
          type: object
          additionalProperties: {}
          description: 단가가 적용되는 속성 값 조합. 빈 객체는 속성 조건 없이 적용되는 기본 단가다
        unit_price:
          type: number
          description: 그 조합의 단가. 0은 무료라는 뜻이다
    BillableMetricPriceResponse:
      type: object
      properties:
        billable_metric_code:
          type: string
        dimension_properties:
          type: array
          description: 단가를 가르는 이벤트 속성 키. 속성에 따라 단가가 갈리지 않는 미터는 빈 배열이다
          items:
            type: string
        price_rates:
          type: array
          description: "속성 값 조합별 단가. dimension_values 오름차순이고, 단가가 하나도 없으면 빈 배열이라 그\
            \ 미터는 청구 예정액에 라인이 나오지 않는다"
          items:
            $ref: "#/components/schemas/BillableMetricPricePriceRate"
    BillableMetricResponse:
      type: object
      properties:
        aggregation:
          type: string
        code:
          type: string
        dimension_properties:
          type: array
          description: 단가를 가르는 이벤트 속성 키. 속성에 따라 단가가 갈리지 않으면 빈 배열
          items:
            type: string
        event_type:
          type: string
        name:
          type: string
        target_property:
          type: string
    BillableMetricUsageCustomer:
      type: object
      properties:
