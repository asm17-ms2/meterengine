          description: 세션이 끝나는 시각(ISO 8601)입니다. 이 시각이 지나면 다시 로그인합니다.
        organization:
          $ref: "#/components/schemas/SessionOrganization"
          description: "세션이 고른 조직입니다. 고른 조직이 없는 세션(소속 조직이 없는 MeterEngine 운영자 계정, 초\
            대를 수락하기 전인 계정)이면 null입니다."
        organization_role:
          type: string
          description: "세션이 고른 조직에서의 역할입니다. owner는 대표관리자, admin은 관리자, member는 일반 사\
            용자입니다. 고른 조직이 없거나 소속이 보관됐으면 null입니다."
        organizations:
          type: array
          description: 사용자가 소속된 조직입니다. 소속된 순서로 담습니다.
          items:
            $ref: "#/components/schemas/SessionOrganization"
        scopes:
          type: array
          description: 세션이 고른 조직에서 이 사용자가 가진 업무 권한입니다. 고른 조직이 없거나 소속이 보관됐으면 빈 배열입니다.
          items:
            type: string
        user_account:
          $ref: "#/components/schemas/SessionUserAccount"
          description: 로그인한 계정
    SessionTokenResponse:
      type: object
      properties:
        consent_required:
          type: boolean
          description: 이용약관 동의와 개인정보 처리방침 확인이 남았는지 나타냅니다. true면 POST /v1/sessions/current/consents로
            동의하기 전까지 업무 요청이 403(consent_required)입니다.
        expires_at:
          type: string
          format: date-time
          description: 세션이 끝나는 시각(ISO 8601)입니다. 이 시각이 지나면 다시 로그인합니다.
        organization:
          $ref: "#/components/schemas/SessionOrganization"
          description: "세션이 고른 조직입니다. 활성 소속이 없는 MeterEngine 운영자 계정(operator)이나, 활성\
            \ 소속 없이 수락할 수 있는 초대가 있는 계정이면 null입니다."
        organization_role:
          type: string
          description: "세션이 고른 조직에서의 역할입니다. owner는 대표관리자, admin은 관리자, member는 일반 사\
            용자입니다. 고른 조직이 없으면 null입니다."
        scopes:
          type: array
          description: 세션이 고른 조직에서 이 사용자가 가진 업무 권한입니다. 고른 조직이 없으면 빈 배열입니다.
          items:
            type: string
        token:
          type: string
          description: 세션 토큰 원문입니다. 이 응답에서만 볼 수 있습니다. Authorization 헤더에 Bearer 값으로
            싣습니다.
        user_account:
          $ref: "#/components/schemas/SessionUserAccount"
          description: 로그인한 계정
    SessionUserAccount:
      type: object
      properties:
        email:
          type: string
          description: 로그인에 쓰는 이메일
        id:
          type: string
          format: uuid
          description: 계정 ID(UUID)
        name:
          type: string
          description: 사용자 이름
        role:
          type: string
          description: "계정의 역할입니다. operator는 MeterEngine 운영자 계정이고, 그 밖의 계정은 member입\
            니다. 조직 안의 역할은 organization_role에 있습니다."
          enum:
          - member
          - operator
    SignupOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 조직 ID(UUID)
        name:
          type: string
          description: 조직 이름
        status:
          type: string
          description: 조직 상태입니다. 가입 응답에서는 늘 active입니다.
          enum:
          - pending
          - active
          - rejected
          - suspended
    SignupResponse:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/SignupOrganization"
          description: 만든 조직입니다. status는 active입니다.
        user_account:
          $ref: "#/components/schemas/SignupUserAccount"
          description: 만든 계정입니다. 이 조직의 대표관리자이며 role은 member입니다.
    SignupUserAccount:
      type: object
      properties:
        email:
          type: string
          description: 로그인에 쓰는 이메일(소문자로 바꿔 저장한 값)
        email_verified:
          type: boolean
          description: 이메일 인증을 마쳤는지 나타냅니다. false면 받은 메일의 링크로 인증해야 로그인할 수 있습니다.
        id:
          type: string
          format: uuid
          description: 계정 ID(UUID)
        name:
          type: string
          description: 가입한 사람 이름
        role:
          type: string
          description: "계정의 역할입니다. operator는 MeterEngine 운영자 계정이고, 그 밖의 계정은 member입\
            니다. 가입으로 만든 계정은 member입니다."
          enum:
          - member
          - operator
    Summary:
      type: object
      properties:
        invalid_target_property:
          type: integer
          format: int64
          description: invalid_target_property(수량을 읽을 수 없음) 행 수
        unknown_event_type:
          type: integer
          format: int64
          description: unknown_event_type(연결할 미터 없음) 행 수
        unpriced_usage:
          type: integer
          format: int64
          description: unpriced_usage(적용 단가 없음) 행 수
    SupplierResponse:
      type: object
      properties:
        business_address:
          type: string
          description: 사업장 주소입니다. 저장하지 않았으면 null입니다.
        business_registration_number:
          type: string
          description: 사업자등록번호(숫자 10자리)입니다. 저장하지 않았으면 null입니다.
        representative_name:
          type: string
          description: 대표자명입니다. 저장하지 않았으면 null입니다.
    TossPaymentsCredentialResponse:
      type: object
      properties:
        archived_at:
          type: string
          format: date-time
          description: 보관되거나 새 키로 바뀐 시각(ISO 8601)입니다. 지금 쓰는 키면 null입니다.
        client_key:
          type: string
          description: 토스페이먼츠 클라이언트 키 원문
        mode:
          type: string
          description: 키를 쓰는 결제 모드(test 또는 live)
          enum:
          - test
          - live
        secret_key_last_four:
          type: string
          description: 시크릿 키의 마지막 네 자입니다. 원문은 돌려주지 않습니다.
        updated_at:
          type: string
          format: date-time
          description: "키 값이 마지막으로 바뀐 시각(KST, +09:00)입니다. 같은 키를 다시 저장하면 바뀌지 않습니다."
        verified_at:
          type: string
          format: date-time
          description: "토스페이먼츠에 키가 유효한지 확인한 시각(KST, +09:00)"
    TypeCount:
      type: object
      properties:
        event_count:
          type: integer
          format: int64
          description: 이 유형의 이벤트 수
        type:
          type: string
          description: 이벤트 유형
    UnbilledEventsResponse:
      type: object
      properties:
        cutoff_at:
          type: string
          format: date-time
          description: "집계에 넣는 occurred_at의 상한(미포함, ISO 8601)입니다. 지금 시각과 그 달의 끝 가운\
            데 이른 쪽입니다."
        future_timestamp:
          $ref: "#/components/schemas/FutureTimestamp"
          description: 발생 시각이 미래인 이벤트 항목입니다. 그 달에 발생했고 occurred_at이 cutoff_at 이후인
            이벤트를 셉니다.
        month:
          type: string
          description: "조회한 달(yyyy-MM, KST)"
        negative_quantity:
          $ref: "#/components/schemas/MetricCounts"
          description: 수량이 음수인 이벤트 항목입니다. 숫자 집계 미터에서 수량 값이 음수인 이벤트를 미터별로 셉니다.
        non_numeric_value:
          $ref: "#/components/schemas/MetricCounts"
          description: 수량을 읽을 수 없음 항목입니다. 미터가 세는 속성이 없거나 형식이 맞지 않는 이벤트를 미터별로 셉니다.
        unmatched_type:
          $ref: "#/components/schemas/UnmatchedType"
          description: 연결할 미터 없음 항목입니다. type을 세는 미터가 없는 이벤트를 셉니다.
    UnmatchedType:
      type: object
      properties:
        event_count:
          type: integer
          format: int64
          description: 이 항목에 든 이벤트 수
        types:
          type: array
          description: 유형별 이벤트 수입니다. 건수가 많은 순입니다.
          items:
            $ref: "#/components/schemas/TypeCount"
    UpdateApiKeyScopesRequest:
      type: object
      properties:
        scopes:
          type: array
          description: 새 권한입니다. 지금 권한을 이 값으로 바꿉니다. 하나 이상 고릅니다. admin은 ingest와 read를
            포함하고 payments는 포함하지 않습니다.
          items:
            type: string
            enum:
            - ingest
            - read
            - admin
            - payments
            pattern: ^(ingest|read|admin|payments)$
          minItems: 1
      required:
      - scopes
    UpdateBillableMetricRequest:
      type: object
      properties:
        aggregation:
          type: string
          description: "집계 함수입니다. sum, count, count_distinct, min, max, avg, first,\
            \ last, median, percentile 가운데 하나이며 대소문자를 구분하지 않습니다."
          minLength: 1
        dimension_properties:
          type: array
          description: "단가를 가르는 이벤트 속성 키(구분 키)입니다. 생략하면 빈 배열이고, 같은 키를 두 번 넣거나 빈 키를\
            \ 넣을 수 없습니다."
          items:
            type: string
        event_type:
          type: string
          description: 집계할 이벤트의 type 값입니다. 대소문자까지 같아야 집계합니다.
          minLength: 1
        name:
          type: string
          description: 콘솔과 청구서에 보이는 미터 이름
          minLength: 1
        percentile:
          type: number
          description: percentile 집계에서만 넣는 백분위(0~100)
        rounding_mode:
          type: string
          description: "단위 변환 뒤 끝수 처리 방식입니다. none, ceil(올림), floor(내림), round(반올림\
            , 사사오입) 가운데 하나이고 기본값은 none입니다."
        rounding_precision:
          type: integer
          format: int32
          description: "끝수 처리할 소수 자릿수(0~12)입니다. 기본값은 0이고, rounding_mode가 none이면 0으\
            로 저장합니다."
          maximum: 12
          minimum: 0
        target_property:
          type: string
          description: "이벤트 properties에서 집계할 키입니다. count에는 넣지 않고, 다른 집계 함수에는 꼭 넣습니\
            다."
        unit_size:
          type: number
          description: 집계량을 나눌 양수 단위입니다. 기본값은 1입니다.
      required:
      - aggregation
      - event_type
      - name
    UpdateCustomerRequest:
      type: object
      properties:
        billing_email:
          type: string
          format: email
          description: 청구 담당 이메일입니다. 저장만 하며 MeterEngine은 이 주소로 메일을 보내지 않습니다. 빼거나 null로
            보내면 저장된 값을 지웁니다.
          maxLength: 254
          minLength: 0
          pattern: .+@.+\..+
        name:
          type: string
          description: 고객 이름입니다. 비울 수 없고 255자까지입니다.
          maxLength: 255
          minLength: 0
      required:
      - name
    UpdateLiveEnvironmentApplicationStatusRequest:
      type: object
      properties:
        rejection_reason:
          type:
          - string
          - "null"
          description: 거절 사유입니다. rejected일 때만 보내고 신청한 조직이 그대로 읽습니다. 500자까지입니다.
          maxLength: 500
          minLength: 0
        status:
          type: string
          description: "검토 결과입니다. approved는 승인, rejected는 거절입니다."
          enum:
          - approved
          - rejected
          minLength: 1
          pattern: approved|rejected
      required:
      - status
    UpdateOrganizationMemberRoleRequest:
      type: object
      properties:
        organization_role:
          type: string
          description: "바꿀 역할입니다. owner(대표관리자)나 admin(관리자)이고, 바꾸면 권한이 admin과 payments가\
            \ 됩니다."
          minLength: 1
          pattern: owner|admin
      required:
      - organization_role
    UpdateOrganizationMemberScopesRequest:
      type: object
      properties:
        scopes:
          type: array
          description: "바꿀 권한입니다. ingest, read, admin, payments 가운데 하나 이상을 담습니다. admin을\
            \ 담으면 역할이 관리자, 빼면 일반 사용자가 됩니다. 대표관리자는 역할이 그대로이고 admin을 빼면 409 owner_scopes_required입\
            니다."
          items:
            type: string
            pattern: ^(ingest|read|admin|payments)$
          minItems: 1
      required:
      - scopes
    UpdateOrganizationStatusRequest:
      type: object
      properties:
        status:
          type: string
          description: 바꿀 조직 상태입니다. active가 아니면 그 조직의 업무 요청이 403 organization_not_active입니다.
          enum:
          - pending
          - active
          - rejected
          - suspended
          minLength: 1
          pattern: pending|active|rejected|suspended
      required:
      - status
    UpdatePaymentSettingRequest:
      type: object
      properties:
        mode:
          type: string
          description: 결제에 쓸 결제 모드(test 또는 live)
          enum:
          - test
          - live
          minLength: 1
          pattern: test|live
      required:
      - mode
    UpdateSessionOrganizationRequest:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
          description: "바꿀 조직 ID(UUID)입니다. 사용자가 소속된 조직이어야 하며, 소속이 보관된 조직으로는 바꿀 수 없\
            습니다."
      required:
      - organization_id
    UpdateSupplierRequest:
      type: object
      properties:
        business_address:
          type: string
          description: 사업장 주소입니다. 1000자까지입니다.
          maxLength: 1000
          minLength: 0
        business_registration_number:
          type: string
          description: 사업자등록번호입니다. 하이픈 없이 숫자 10자리로 보냅니다.
          minLength: 1
          pattern: "[0-9]{10}"
        representative_name:
          type: string
          description: 대표자명입니다. 255자까지입니다.
          maxLength: 255
          minLength: 0
      required:
      - business_address
      - business_registration_number
      - representative_name
    UpdateTossPaymentsCredentialRequest:
      type: object
      properties:
        client_key:
          type: string
          description: "토스페이먼츠 클라이언트 키입니다. 경로의 mode가 test면 test_ck_, live면 live_ck_로\
            \ 시작합니다."
          minLength: 1
        secret_key:
          type: string
          description: "토스페이먼츠 시크릿 키입니다. 경로의 mode가 test면 test_sk_, live면 live_sk_로\
            \ 시작합니다. 암호화해 저장하고 어떤 응답에도 원문을 싣지 않습니다."
          minLength: 1
      required:
      - client_key
      - secret_key
    UpdateUserAccountRoleRequest:
      type: object
      properties:
        role:
          type: string
          description: "바꿀 역할입니다. operator는 MeterEngine 운영자 계정, member는 그 밖의 계정입니다\
            ."
          enum:
          - member
          - operator
          minLength: 1
          pattern: member|operator
      required:
      - role
    UpdateWebhookEndpointRequest:
      type: object
      properties:
        description:
          type: string
          description: "웹훅 URL을 알아보려고 붙이는 메모입니다. 1000자까지 받고, 없으면 빼거나 null로 보냅니다."
          maxLength: 1000
          minLength: 0
        enabled:
          type: boolean
          description: "false면 이 웹훅 URL로 웹훅을 보내지 않습니다. 멈춘 동안 생긴 웹훅은 쌓이지 않아 true로 되\
            돌려도 보내지 않고, 이미 대기 중이던 전송은 endpoint_disabled로 실패합니다. true면 그 뒤에 생긴 웹훅부터\
            \ 보냅니다."
        event_types:
          type: array
          description: "받을 웹훅 종류입니다. 하나 이상 고르며 중복은 없애고 저장합니다. webhook_test(테스트 웹훅\
            ), unbilled_usage_detected(과금 제외 사용량), payment_succeeded(결제 성공), payment_failed(결\
            제 실패), payment_canceled(결제 취소) 가운데 고릅니다."
          items:
            type: string
            enum:
            - webhook_test
            - unbilled_usage_detected
            - payment_succeeded
            - payment_failed
            - payment_canceled
            minLength: 1
          maxItems: 20
          minItems: 1
        url:
          type: string
          description: 웹훅을 받을 자사 서버 주소입니다. HTTPS이고 공개된 주소여야 하며 2048자까지 받습니다.
          maxLength: 2048
          minLength: 0
      required:
      - enabled
      - event_types
      - url
    UsageCustomerResponse:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
          description: 고객 ID(UUID)
        customer_name:
          type: string
          description: 고객 이름
        metrics:
          type: array
          description: "이 고객의 미터별 사용량입니다. 항목은 GET /v1/usage의 billable_metric_usages\
            \ 항목과 같고, customers에는 이 고객 하나만 담습니다."
          items:
            $ref: "#/components/schemas/BillableMetricUsageResponse"
    UserAccountOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 조직 ID(UUID)
        name:
          type: string
          description: 조직 이름
        status:
          type: string
          description: 조직 상태입니다. active가 아니면 업무 요청이 403 organization_not_active입니다.
          enum:
          - pending
          - active
          - rejected
          - suspended
    UserAccountResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: 계정을 만든 시각(ISO 8601)
        email:
          type: string
          description: 로그인에 쓰는 이메일
        id:
          type: string
          format: uuid
          description: 계정 ID(UUID)
        name:
          type: string
          description: 사용자 이름
        organizations:
          type: array
          description: 사용자가 소속된 조직입니다. 소속된 순서로 담습니다.
          items:
            $ref: "#/components/schemas/UserAccountOrganization"
        role:
          type: string
          description: "계정의 역할입니다. operator는 MeterEngine 운영자 계정이고, 그 밖의 계정은 member입\
            니다."
          enum:
          - member
          - operator
    Warnings:
      type: object
      properties:
        future_event_count:
          type: integer
          format: int64
          description: 그 달에 발생했지만 occurred_at이 cutoff_at 이후라 아직 집계되지 않은 이벤트 수
        negative_event_metric_count:
          type: integer
          format: int64
          description: 수량이 음수인 이벤트를 미터별로 센 합입니다. 한 이벤트가 여러 미터에 걸리면 여러 번 셉니다.
        scope:
          type: string
          description: 경고를 센 범위입니다. 값은 organization_month(그 달 전체)입니다.
    WebhookDeliveryResponse:
      type: object
      properties:
        attempt_count:
          type: integer
          format: int32
          description: 보낸 시도 수입니다. 재시도를 요청하면 처음부터 다시 셉니다.
        attempts:
          type: array
          description: 시도 기록입니다. 오래된 시도부터 싣습니다.
          items:
            $ref: "#/components/schemas/Attempt"
        created_at:
          type: string
          format: date-time
          description: 전송을 만든 시각(ISO 8601)
        failure_reason:
          type: string
          description: "마지막 시도의 실패 사유입니다. timeout, connection_error, unexpected_status,\
            \ blocked_address, endpoint_disabled, secret_unavailable, lease_expired\
            \ 가운데 하나이며 성공했으면 null입니다."
        id:
          type: string
          format: uuid
          description: 전송 ID(UUID)
        last_attempted_at:
          type: string
          format: date-time
          description: 마지막으로 보낸 시각(ISO 8601)입니다. 아직 보내지 않았으면 null입니다.
        next_attempt_at:
          type: string
          format: date-time
          description: 다음 시도 예정 시각(ISO 8601)입니다. done이나 failed면 null입니다.
        response_status:
          type: integer
          format: int32
          description: 마지막 시도에서 받은 HTTP 상태 코드입니다. 응답을 받지 못했으면 null입니다.
        status:
          type: string
          description: "전송 상태입니다. pending(발송 대기 또는 재시도 대기), done(발송 완료), failed(발송\
            \ 실패) 가운데 하나입니다."
        type:
          type: string
          description: "웹훅 종류(webhook_test(테스트 웹훅), unbilled_usage_detected(과금 제외\
            \ 사용량), payment_succeeded(결제 성공), payment_failed(결제 실패), payment_canceled(결\
            제 취소))"
        webhook_event_id:
          type: string
          format: uuid
          description: 보낸 웹훅의 ID(UUID)입니다. 웹훅 요청 헤더 webhook-id 값과 같습니다.
    WebhookEndpointResponse:
      type: object
      properties:
        archived_at:
          type: string
          format: date-time
          description: 보관한 시각(ISO 8601)입니다. 보관하지 않았으면 null입니다.
        created_at:
          type: string
          format: date-time
          description: 등록한 시각(ISO 8601)
        description:
          type: string
          description: 웹훅 URL 메모입니다. 없으면 null입니다.
        enabled:
          type: boolean
          description: 웹훅을 보내는 중이면 true입니다. 발송을 멈췄거나 보관했으면 false입니다.
        event_types:
          type: array
          description: 받을 웹훅 종류입니다. 등록하거나 수정할 때 고른 값입니다.
          items:
            type: string
        id:
          type: string
          format: uuid
          description: 웹훅 URL ID(UUID)
        latest_attempt_failed:
          type: boolean
          description: 가장 최근 발송 시도가 실패했으면 true입니다. 시도 기록이 없으면 false입니다.
        secret:
          type: string
          description: 웹훅 시크릿(whsec_로 시작)입니다. 등록 응답에만 실리고 다른 응답에는 없습니다.
        url:
          type: string
          description: 웹훅을 받을 주소
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
