components:
  schemas:
    AcceptOrganizationInvitationRequest:
      type: object
      properties:
        consents:
          type: array
          items:
            $ref: "#/components/schemas/InvitationConsentRequest"
        name:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
    AcceptSessionConsentsRequest:
      type: object
      properties:
        consents:
          type: array
          items:
            $ref: "#/components/schemas/CreateSignupConsentRequest"
          minItems: 1
      required:
      - consents
    AcceptedInvitation:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
        user_account_id:
          type: string
          format: uuid
    ApiKeyResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: "키가 끝나는 시각. 교체된 키면 유예가 끝나는 시각이고, 정하지 않았으면 null"
        id:
          type: string
          format: uuid
        label:
          type: string
          description: 키를 알아보려고 붙인 이름
        last_four:
          type: string
          description: 원문의 끝 네 글자. 키를 알아보는 데 쓴다
        mode:
          type: string
          description: 키 모드. 원문 접두사가 me_live_나 me_test_다
          enum:
          - live
          - test
        rate_limit_per_minute:
          type: integer
          format: int32
          description: 인스턴스별 분당 요청 한도. null이면 무제한이다
        revoked_at:
          type: string
          format: date-time
          description: 키를 폐기한 시각. 폐기하지 않았으면 null
        scopes:
          type: array
          description: 키의 스코프. admin은 ingest와 read를 포함한다
          items:
            type: string
            enum:
            - ingest
            - read
            - admin
        status:
          type: string
          description: 서버 조회 시점의 키 상태. 폐기된 키는 만료 시각과 관계없이 revoked다
          enum:
          - active
          - revoked
          - expired
    ApiKeySecretResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 키가 끝나는 시각. 새로 발급한 키는 null
        id:
          type: string
          format: uuid
        label:
          type: string
          description: 키를 알아보려고 붙인 이름
        last_four:
          type: string
          description: 원문의 끝 네 글자. 키를 알아보는 데 쓴다
        mode:
          type: string
          description: 키 모드. 원문 접두사가 me_live_나 me_test_다
          enum:
          - live
          - test
        rate_limit_per_minute:
          type: integer
          format: int32
          description: 인스턴스별 분당 요청 한도. null이면 무제한이다
        revoked_at:
          type: string
          format: date-time
          description: 키를 폐기한 시각. 새로 발급한 키는 null
        scopes:
          type: array
          description: 키의 스코프. 중복을 없앤 값이다. admin은 ingest와 read를 포함한다
          items:
            type: string
            enum:
            - ingest
            - read
            - admin
        secret:
          type: string
          description: "키 원문. 이 응답에서만 볼 수 있다. Authorization: Bearer 값으로 싣는다"
    Attempt:
      type: object
      properties:
        attempted_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
        failure_reason:
          type: string
        response_status:
          type: integer
          format: int32
    BillableMetricPricePriceRate:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        dimension_values:
          type: object
          additionalProperties: {}
        effective_from:
          type: string
        effective_until:
          type: string
        id:
          type: string
          format: uuid
        model:
          type: string
        tiers:
          $ref: "#/components/schemas/PriceRateTier"
        unit_price:
          type: number
    BillableMetricPriceResponse:
      type: object
      properties:
        billable_metric_code:
          type: string
        dimension_properties:
          type: array
          description: 단가를 가르는 이벤트 속성 키. 속성에 따라 단가가 갈리지 않는 미터는 빈 배열이다
          items:
            type: string
        price_rates:
          type: array
          description: "속성 값 조합별 단가. dimension_values 오름차순이고, 단가가 하나도 없으면 빈 배열이라 그\
            \ 미터는 청구 예정액에 라인이 나오지 않는다"
          items:
            $ref: "#/components/schemas/BillableMetricPricePriceRate"
    BillableMetricResponse:
      type: object
      properties:
        aggregation:
          type: string
        code:
          type: string
        dimension_properties:
          type: array
          description: 단가를 가르는 이벤트 속성 키. 속성에 따라 단가가 갈리지 않으면 빈 배열
          items:
            type: string
        event_type:
          type: string
        name:
          type: string
        percentile:
          type: number
        rounding_mode:
          type: string
        rounding_precision:
          type: integer
          format: int32
        target_property:
          type: string
        unit_size:
          type: number
    BillableMetricUsageCustomer:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
          description: 집계 시점의 고객 이름
        dimension_usages:
          type: array
          description: "속성 값 조합별 수량. dimension_values 오름차순이고, 이벤트가 없는 고객은 빈 배열이다.\
            \ 미터에 dimension_properties가 없으면 dimension_values가 빈 객체인 요소 하나다"
          items:
            $ref: "#/components/schemas/BillableMetricUsageDimensionUsage"
        quantity:
          type: number
          description: 고객 전체 이벤트를 집계하고 단위와 반올림을 적용한 수량. 조합별 수량의 합과 다를 수 있다
        raw_quantity:
          type: number
          description: 고객 전체 이벤트의 변환 전 집계량
        raw_quantity_denominator:
          type: number
          description: 변환 전 정확 집계량의 양수 분모
        raw_quantity_numerator:
          type: number
          description: 변환 전 정확 집계량의 분자
    BillableMetricUsageDimensionUsage:
      type: object
      properties:
        dimension_values:
          type: object
          additionalProperties: {}
          description: 미터의 dimension_properties마다 이벤트 properties에서 뽑은 값. 이벤트에 그 키가
            없으면 값이 null이다
        quantity:
          type: number
          description: 그 조합의 수량 표시값. 순환소수는 근사치이며 청구는 정확한 분자와 분모를 사용한다
        raw_quantity:
          type: number
          description: 그 조합의 변환 전 집계량
        raw_quantity_denominator:
          type: number
          description: 변환 전 정확 집계량의 양수 분모
        raw_quantity_numerator:
          type: number
          description: 변환 전 정확 집계량의 분자
    BillableMetricUsageResponse:
      type: object
      properties:
        aggregation:
          type: string
        code:
          type: string
        customers:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricUsageCustomer"
        event_type:
          type: string
        name:
          type: string
        percentile:
          type: number
        rounding_mode:
          type: string
        rounding_precision:
          type: integer
          format: int32
        target_property:
          type: string
        unit_size:
          type: number
    CreateApiKeyRequest:
      type: object
      properties:
        label:
          type: string
          description: 키를 알아보려고 붙이는 이름
          maxLength: 255
          minLength: 0
        mode:
          type: string
          description: 키 모드. test도 실제 데이터를 다루므로 샌드박스가 아니다. 결제 요청은 도입사의 현재 PG 모드와 같아야
            한다
          enum:
          - live
          - test
          minLength: 1
          pattern: ^(live|test)$
        rate_limit_per_minute:
          type: integer
          format: int32
          description: 이 키의 인스턴스별 분당 요청 한도. 양수이며 생략하거나 null이면 무제한이다
        replaced_api_key_id:
          type: string
