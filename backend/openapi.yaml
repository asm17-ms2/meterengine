        effective_from:
          type: string
          description: "적용 시작 월(yyyy-MM, KST)입니다. 생략하면 이번 달이고, 이번 달보다 앞이면 거절합니다."
        effective_until:
          type: string
          description: "적용 종료 월(yyyy-MM, KST)입니다. 이 달은 포함하지 않습니다. 시작 월보다 뒤여야 하고, 생\
            략하면 계속 적용합니다."
        minimum_amount:
          type: integer
          format: int64
          description: "월 최소 사용료(원, 0 이상의 정수)입니다. 필요 없으면 0을 넣습니다. 기본료를 뺀 사용료 합이 이보\
            다 적으면 차액을 조정 항목으로 더합니다. 청구할 때 10원 미만을 버린 값을 쓰고, 그 달 사용량이 있는 고객에게만 붙습니다\
            ."
          minimum: 0
      required:
      - base_fee
      - minimum_amount
    CreatePriceRateRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
          description: "선택 입력입니다. 넣으면 그 고객에게만 쓰는 고객 단가이고, 생략하면 공통 단가입니다."
        dimension_values:
          type: object
          additionalProperties: {}
          description: "구분 값입니다. 키 집합이 미터의 dimension_properties와 같아야 하고, 구분 키가 없는\
            \ 미터는 빈 객체입니다. 값은 문자열, 숫자, 불리언만 됩니다."
        effective_from:
          type: string
          description: "적용 시작 월(yyyy-MM, KST)입니다. 생략하면 이번 달이고, 이번 달보다 앞이면 거절합니다."
        effective_until:
          type: string
          description: "적용 종료 월(yyyy-MM, KST)입니다. 이 달은 포함하지 않습니다. 시작 월보다 뒤여야 하고, 생\
            략하면 계속 적용합니다."
        model:
          type: string
          description: "단가 모델입니다. per_unit(단일 단가), graduated(누진 구간), volume(총량 구간\
            ) 가운데 하나이고 생략하면 per_unit입니다."
          enum:
          - per_unit
          - graduated
          - volume
          pattern: per_unit|graduated|volume
        tiers:
          type: array
          description: "graduated, volume 모델의 구간(1~100개)입니다. up_to가 커지는 순서로 쓰고 마지막\
            \ 구간의 up_to는 null로 둡니다. per_unit에는 넣지 않습니다."
          items:
            $ref: "#/components/schemas/PriceRateTier"
          maxItems: 100
          minItems: 1
        unit_price:
          type: number
          description: 과금 수량 1당 단가(원)입니다. per_unit에만 넣으며 0 이상이고 소수도 됩니다.
          minimum: 0
      required:
      - dimension_values
    CreateSessionRequest:
      type: object
      properties:
        email:
          type: string
          description: 가입한 이메일입니다. 대소문자를 가리지 않습니다.
          minLength: 1
        password:
          type: string
          format: password
          description: 계정의 비밀번호입니다.
          minLength: 1
      required:
      - email
      - password
    CreateSignupConsentRequest:
      type: object
      properties:
        document:
          type: string
          description: 동의한 문서입니다. terms_of_service(이용약관)나 privacy_policy(개인정보 처리방침)입니다.
          enum:
          - terms_of_service
          - privacy_policy
          minLength: 1
          pattern: terms_of_service|privacy_policy
        document_version:
          type: string
          description: 동의한 문서 버전입니다. 화면이 보여 준 버전을 그대로 싣습니다.
          example: 2026-10-01
          maxLength: 255
          minLength: 0
      required:
      - document
      - document_version
    CreateSignupRequest:
      type: object
      properties:
        consents:
          type: array
          description: 이용약관 동의와 개인정보 처리방침 확인입니다. terms_of_service와 privacy_policy를
            한 번씩 담습니다.
          items:
            $ref: "#/components/schemas/CreateSignupConsentRequest"
          minItems: 1
        email:
          type: string
          format: email
          description: "로그인에 쓸 이메일입니다. 소문자로 바꿔 저장하고, 대소문자를 가리지 않고 중복을 막습니다."
          maxLength: 254
          minLength: 0
          pattern: .+@.+\..+
        name:
          type: string
          description: 가입하는 사람 이름
          maxLength: 255
          minLength: 0
        organization_name:
          type: string
          description: 가입하는 조직 이름
          maxLength: 255
          minLength: 0
        password:
          type: string
          format: password
          description: 비밀번호입니다. 8자 이상 72자 이하이고 UTF-8로 72바이트 이하여야 합니다.
          maxLength: 72
          minLength: 8
        turnstile_token:
          type: string
          description: Cloudflare Turnstile 위젯이 준 토큰입니다. 없거나 확인을 통과하지 못하면 400 captcha_failed입니다.
          maxLength: 2048
          minLength: 0
      required:
      - consents
      - email
      - name
      - organization_name
      - password
    CreateUserAccountRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "새 MeterEngine 운영자 계정(operator)의 이메일입니다. 소문자로 저장하며, 이미 가입한\
            \ 이메일이면 기존 계정을 바꾸지 않습니다."
          maxLength: 254
          minLength: 0
          pattern: .+@.+\..+
        name:
          type: string
          description: 새 MeterEngine 운영자의 이름
          maxLength: 255
          minLength: 0
        password:
          type: string
          format: password
          description: 초기 비밀번호입니다. 8자 이상 72자 이하이고 UTF-8로 72바이트 이하여야 합니다.
          maxLength: 72
          minLength: 8
      required:
      - email
      - name
      - password
    CreateWebhookEndpointRequest:
      type: object
      properties:
        description:
          type: string
          description: "웹훅 URL을 알아보려고 붙이는 메모입니다. 1000자까지 받고, 없으면 빼거나 null로 보냅니다."
          maxLength: 1000
          minLength: 0
        event_types:
          type: array
          description: "받을 웹훅 종류입니다. 하나 이상 고르며 중복은 없애고 저장합니다. webhook_test(테스트 웹훅\
            ), unbilled_usage_detected(과금 제외 사용량), payment_succeeded(결제 성공), payment_failed(결\
            제 실패), payment_canceled(결제 취소) 가운데 고릅니다."
          items:
            type: string
            enum:
            - webhook_test
            - unbilled_usage_detected
            - payment_succeeded
            - payment_failed
            - payment_canceled
            minLength: 1
          maxItems: 20
          minItems: 1
        url:
          type: string
          description: 웹훅을 받을 자사 서버 주소입니다. HTTPS이고 공개된 주소여야 하며 2048자까지 받습니다.
          maxLength: 2048
          minLength: 0
      required:
      - event_types
      - url
    CustomerResponse:
      type: object
