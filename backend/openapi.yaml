          - base_fee
          - minimum_adjustment
        quantity:
          type: number
          description: 표시용 수량입니다. 금액 계산에는 quantity_numerator와 quantity_denominator를
            씁니다.
        quantity_denominator:
          type: number
          description: 과금 수량을 분수로 나타낸 분모(양수)입니다. 분자를 분모로 나눈 값에 단가를 곱하고 청구 항목마다 10원
            미만을 버립니다.
        quantity_numerator:
          type: number
          description: 금액과 구간 판정에 쓴 과금 수량을 분수로 나타낸 분자
        target_property:
          type: string
          description: "미터가 집계하는 이벤트 속성 키입니다. count 미터와 기본료, 최소 사용료 조정 항목은 null입니다\
            ."
        tier_index:
          type: integer
          format: int32
          description: graduated_tier 항목의 구간 순서(0부터)입니다. 다른 종류는 0입니다.
        unit_price:
          type: number
          description: "과금 수량 1당 단가(원)입니다. 구간 모델은 그 구간의 단가이고, 기본료와 최소 사용료 조정 항목은 금\
            액과 같습니다."
    InvoicePaymentResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          description: 청구서의 부가세 포함 금액(원)
        attempt_count:
          type: integer
          format: int64
          description: 지금 결제 모드로 이 청구서에 한 결제 시도 수
        canceled_amount:
          type: integer
          format: int64
          description: 취소를 마친 금액의 합(원)입니다. 결제된 청구서가 아니면 0입니다.
        completed_at:
          type: string
          format: date-time
          description: "가장 늦게 요청한 시도의 completed_at(KST, +09:00)입니다. 시도가 없거나 pending이\
            면 null입니다."
        invoice_id:
          type: string
          format: uuid
          description: 청구서 ID(UUID)
        last_failure_code:
          type: string
          description: 가장 늦게 요청한 시도의 failure_code입니다. 그 시도가 failed일 때만 있습니다.
        mode:
          type: string
          description: status를 계산한 결제 모드입니다. 조회한 때 업무 환경의 결제 모드입니다.
          enum:
          - test
          - live
        next_retry_at:
          type: string
          format: date-time
          description: "다음 자동 재시도 시각(KST, +09:00)입니다. 그 시도의 completed_at에 재시도 간격을\
            \ 더한 시각입니다. 가장 늦게 요청한 시도가 failed이고, 실패 코드가 다시 시도할 대상이며, 시도 수가 상한보다 적을\
            \ 때만 있습니다. 카드 오류처럼 다시 시도하지 않는 코드여도 그 시도가 끝난 뒤 고객이 카드를 다시 등록했으면 다시 시도할\
            \ 대상이고, ALREADY_REMOVED_BILLING_KEY는 지금 등록 카드가 있으면 대상입니다. NOT_FOUND_PAYMENT는\
            \ 그 시도가 끝난 지 7일 안일 때만 대상입니다."
        status:
          type: string
          description: "지금 결제 모드에서 가장 늦게 요청한 시도로 정한 결제 상태입니다. total_amount가 0원이면 not_required,\
            \ 시도가 없으면 unpaid, 시도가 pending이면 pending, failed면 failed, done이면 취소한 합에\
            \ 따라 paid, partially_canceled, canceled입니다."
          enum:
