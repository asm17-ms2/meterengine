              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=invoice_not_found: 그런 인보이스가 없다"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
