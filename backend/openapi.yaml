          format: date-time
          description: "결과가 done이나 failed로 정해진 시각(KST, +09:00)입니다. pending이면 null입\
            니다."
        failure_code:
          type: string
          description: |
            failed일 때만 있습니다.
            토스페이먼츠가 준 값: 취소 거절 코드(예: NOT_CANCELABLE_AMOUNT).
            MeterEngine이 정한 값: HTTP_<상태>(토스페이먼츠 거절 응답에 코드가 없을 때 그 HTTP 상태), NOT_FOUND_CANCELLATION(취소를 요청하고 10분이 지나도 토스페이먼츠 결제 조회에 이 취소에 맞는 취소 거래가 없을 때. 토스페이먼츠 코드가 아닙니다), toss_payments_credential_missing(토스페이먼츠를 부르기 전에 그 결제 모드의 토스페이먼츠 키가 없었습니다).
        failure_message:
          type: string
          description: "failed일 때만 있습니다. 토스페이먼츠가 준 거절 문구이거나, failure_code가 MeterEngine\
            \ 코드면 그 오류 문구입니다."
        id:
          type: string
          format: uuid
          description: 결제 취소 ID(UUID)
        mode:
