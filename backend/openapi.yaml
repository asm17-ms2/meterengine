      - live-environment-application-controller
  /v1/operations:
    get:
      description: "MeterEngine 운영자 로그인 세션으로 전체 조직의 현황, 라이브 결제와 웹훅 실패, 예약 작업의 마지막\
        \ 성공 시각을 확인합니다. 결제 실패는 최근 24시간 동안 요청한 라이브 결제 시도이고, 웹훅 실패는 지금 failed 상태인 전송\
        \ 가운데 보관하지 않은 웹훅 URL의 것입니다. 꺼 둔 웹훅 URL의 실패는 세고, 테스트 환경의 웹훅 실패는 세지 않습니다."
      operationId: getOperations
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OperationsResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청입니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 운영자 현황 조회
      tags:
      - operations-controller
  /v1/operations/audit-logs:
    get:
      description: |
        MeterEngine 운영자 로그인 세션만 부를 수 있습니다. 모든 조직의 기록과 조직 없는 기록을 돌려줍니다.
        q는 action, target_type, target_id, detail의 request_id와 route에 더해 organization_id도 부분 일치로 찾습니다.
        조직 ID를 q로 보내면 그 조직의 기록과 함께, 그 ID를 대상(target_id)으로 남긴 운영자 요청 같은 조직 없는 기록도 나옵니다.
      operationId: listOperationsAuditLogs
      parameters:
      - description: 0부터 세는 페이지 번호
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: 한 페이지에 담을 기록 수(1 이상 100 이하)
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: "찾을 활동 코드(예: api_key_created). 같은 코드만 찾습니다."
        in: query
        name: action
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 0
          pattern: "[a-z]+(_[a-z]+)*"
      - description: "찾을 실행 주체 종류입니다. user_account(로그인 사용자), api_key(API 키), system(시\
          스템), anonymous(미인증 요청), invoice_view_link(청구서 조회 링크) 가운데 하나입니다."
        in: query
        name: actor_type
        required: false
        schema:
          type: string
          pattern: user_account|api_key|system|anonymous|invoice_view_link
      - description: "action, target_type, target_id, organization_id와 detail의 request_id,\
          \ route에서 부분 일치로 찾을 문자열입니다. 대소문자를 가리지 않습니다."
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 0
      - description: "이 시각부터(포함)입니다. yyyy-MM-dd는 그날 KST 0시, 오프셋이 있는 ISO 8601 시각은 그\
          \ 순간입니다. 연도는 0001부터 9999까지입니다."
        in: query
        name: from
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      - description: "이 시각까지(미포함)입니다. yyyy-MM-dd는 그날 끝까지 담고(다음 날 KST 0시 미포함), 오프셋이\
          \ 있는 ISO 8601 시각은 그 순간을 뺍니다. 연도는 0001부터 9999까지입니다."
        in: query
        name: to
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      - description: "정렬 순서입니다. occurred_at_desc는 최근 순(기본), occurred_at_asc는 오래된 순\
          입니다."
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: occurred_at_desc
          pattern: occurred_at_asc|occurred_at_desc
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListAuditLogsResponse"
          description: 감사 기록 목록입니다. 조건에 맞는 것이 없으면 audit_logs가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: page, size, action, actor_type, sort가\
            \ 범위나 형식 밖이거나, from과 to가 날짜나 오프셋 있는 시각이 아니거나 연도가 0001부터 9999까지의 범위 밖이거\
            나, from이 to보다 늦거나 같습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청입니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 전체 감사 기록 조회
      tags:
      - audit-log-controller
