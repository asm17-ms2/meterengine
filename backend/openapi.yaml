            \ 키에는 테스트 환경 한도가 걸립니다. 값을 주면 테스트 키는 이 값과 테스트 환경 한도 가운데 작은 쪽이 적용됩니다. 1분\
            \ 단위로 끊어 세지 않습니다. 처음에는 한도만큼 연달아 보낼 수 있고, 그 뒤에는 분당 한도의 속도로 다시 채워집니다."
