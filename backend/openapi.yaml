  /v1/invoices/{id}/payment-attempts:
    get:
      description: |
        청구서의 결제 시도를 모든 결제 모드에 걸쳐 요청 시각이 늦은 것부터 돌려줍니다.
        requested_at과 completed_at은 KST(+09:00)로 나옵니다.
      operationId: listPaymentAttempts
      parameters:
      - description: 결제 시도를 볼 청구서의 ID
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPaymentAttemptsResponse"
          description: 결제 시도 목록
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 id가 UUID가 아닙니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=invoice_not_found: 그런 청구서가 없습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 청구서 결제 시도 목록 조회
      tags:
      - payment-attempt-controller
    post:
      description: |
        청구서의 total_amount만큼 고객의 등록 카드로 토스페이먼츠 자동결제 승인을 요청합니다. 본문은 받지 않습니다.
        현재 업무 환경의 결제 모드(test 또는 live)에 저장한 토스페이먼츠 키와 그 결제 모드로 등록한 카드를 씁니다.
        승인되면 status=done과 payment_key, 거절되면 status=failed와 failure_code, failure_message가 남고 둘 다 201입니다.
        토스페이먼츠 응답으로 결과를 확인하지 못하면 status=pending인 시도를 201로 돌려줍니다.
        결제 모드마다 청구서 하나에 결제 중이거나 결제된 시도는 하나뿐입니다. 이미 있으면 409입니다.
        requested_at과 completed_at은 KST(+09:00)로 나옵니다.
        payments 권한이 필요합니다. admin 권한만으로는 부를 수 없습니다.
      operationId: createPaymentAttempt
      parameters:
      - description: 결제할 청구서의 ID
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: 결제 모드가 test일 때만 받습니다. 값을 그대로 토스페이먼츠에 넘겨 실패 응답을 재현합니다. 빈 값은 보내지
          않은 것으로 봅니다.
        in: header
        name: TossPayments-Test-Code
        required: false
        schema:
          type: string
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentAttemptResponse"
          description: "결제 시도입니다. status는 done, failed, pending 중 하나입니다."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 경로의 id가 UUID가 아니거나, TossPayments-Test-Code에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있습니다.
            code=toss_payments_test_code_in_live_mode: 결제 모드가 live인데 TossPayments-Test-Code를 보냈습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=invoice_not_found: 그런 청구서가 없습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=invoice_already_paid: 이 결제 모드로 결제 중이거나 결제된 시도가 이미 있습니다.
            code=payment_result_unconfirmed: 결과를 모르는 이전 결제 시도가 있습니다. 토스페이먼츠에서 결과를 확인한 뒤 다시 요청합니다.
            code=invoice_amount_zero: 청구서의 total_amount가 0원입니다.
            code=toss_payments_credential_missing: 이 결제 모드의 토스페이먼츠 키가 없습니다.
            code=payment_method_missing: 청구서의 고객이 이 결제 모드로 등록한 카드가 없습니다.
            code=payment_mode_mismatch: 테스트 키인지 라이브 키인지가 업무 환경의 결제 모드와 다릅니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 청구서 결제 요청
      tags:
      - payment-attempt-controller
