                $ref: "#/components/schemas/ErrorResponse"
          description: "code=archive_restoration_conflict: 같은 고객 범위와 시작 월의 보관하지 않은\
            \ 버전이 있거나, 보관 효력이 이번 달이나 그 전에 시작됐습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
