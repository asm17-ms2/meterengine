  /v1/organization/live-environment-applications:
    get:
      description: |
        조직이 낸 신청을 최근 것부터 돌려줍니다. 거절된 신청의 사유는 rejection_reason에 있습니다.
        로그인 세션만 부를 수 있습니다. 페이지를 나누지 않습니다.
      operationId: listOrganizationLiveEnvironmentApplications
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListLiveEnvironmentApplicationsResponse"
          description: 신청 목록입니다. 없으면 live_environment_applications가 빈 배열입니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 조직의 라이브 환경 이용 신청 목록 조회
      tags:
      - live-environment-application-controller
    post:
      description: |
        조직의 라이브 환경을 열어 달라고 신청합니다. MeterEngine이 승인하면 라이브 환경이 열립니다.
        라이브 환경이 잠긴 조직이 부르므로 X-MeterEngine-Environment를 test로 보냅니다. 로그인 세션만 부를 수 있습니다.
        신청할 때 바로 확인하는 것은 사업자등록번호의 검증 숫자, 국세청 사업자 상태, 토스페이먼츠 라이브 키입니다.
        등록되지 않은 번호와 폐업 사업자는 거절합니다. 휴업 사업자는 받고 business_status를 suspended로 남깁니다.
        국세청 조회 결과를 받지 못하면 신청은 받고 business_status를 unchecked로 남깁니다.
        토스페이먼츠 키는 확인만 하고 신청에 보관하며, 승인되면 라이브 환경의 토스페이먼츠 키로 저장합니다. 승인 전에는 쓰이지 않습니다.
        created_at은 KST(+09:00)로 나옵니다.
      operationId: createLiveEnvironmentApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveEnvironmentApplicationRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LiveEnvironmentApplicationResponse"
          description: 받은 신청입니다. status는 pending입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 필수 값이 비었거나, 길이를 넘었거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있습니다.
            code=invalid_business_registration_number: 사업자등록번호가 열 자리 숫자가 아니거나 검증 숫자가 틀렸거나, 국세청에 등록되지 않았거나, 폐업한 사업자입니다. 이유는 errors의 business_registration_number에 있습니다.
            code=invalid_toss_payments_credential: 키가 live_ck_, live_sk_로 시작하지 않거나 토스페이먼츠가 시크릿 키를 거절했습니다. 어느 필드인지는 errors의 toss_payments_client_key, toss_payments_secret_key에 있습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=live_environment_locked: X-MeterEngine-Environment를 test로\
            \ 보내지 않았습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=live_environment_already_open: 이미 라이브 환경이 열린 조직입니다.
            code=live_environment_application_in_progress: 검토 중인 신청이 있습니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=rate_limit_exceeded: 조직의 신청 시도가 30분에 10번을 넘었습니다. 국세청과 토스페이먼츠 확인에서 거절된 시도도 셉니다.
            Retry-After 헤더의 초만큼 기다린 뒤 다시 보냅니다.
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
              style: simple
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_unavailable: 토스페이먼츠 응답으로 키가 유효한지 확인하지 못\
            했습니다. 신청은 받지 않았습니다."
      summary: 라이브 환경 이용 신청
      tags:
      - live-environment-application-controller
