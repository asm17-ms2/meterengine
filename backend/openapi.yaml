  /v1/sessions:
    post:
      description: |
        이메일과 비밀번호로 로그인하고 세션 토큰을 돌려준다. 토큰 원문은 이 응답에서만 볼 수 있다.
        이후 요청의 Authorization 헤더에 Bearer 값으로 싣는다. 세션은 expires_at에 끝난다.
        세션의 도입사는 소속된 활성 도입사 가운데 가장 먼저 소속된 곳이다.
        활성 소속이 없는 operator는 도입사 없이 로그인하고 organization이 null이다.
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionTokenResponse"
          description: 만든 세션과 토큰
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: email이나 password가 비었거나 NUL 문자나 짝이 없\
            는 UTF-16 서로게이트를 담았다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=invalid_credentials: 이메일이나 비밀번호가 틀렸다. 어느 쪽이 틀렸는지는 알려 주지 않는다.
            Authorization 헤더를 실었는데 그 값이 올바르지 않을 때도 같다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=organization_not_active: member인데 소속된 도입사 가운데 활성 상태인\
            \ 곳이 없다"
      security: []
      summary: 로그인
      tags:
      - session-controller
