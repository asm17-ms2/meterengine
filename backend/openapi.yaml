          items:
            $ref: "#/components/schemas/EventResult"
    IngestEventRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
          description: 고객 등록 응답의 id(UUID)입니다. 같은 업무 환경에 등록한 고객이어야 합니다.
          example: 3f2b8c1e-7a4d-4e6b-9c0a-5d1f2e3a4b5c
        properties:
          type: object
          additionalProperties: {}
          description: "JSON 객체입니다. 비어 있어도({}) 됩니다. 미터의 집계 속성과 구분 키를 여기에 담습니다."
          example:
            units: 12
        timestamp:
          type: string
          format: date-time
          description: "이벤트가 발생한 시각입니다. 오프셋을 붙인 ISO 8601로 보냅니다(예: 2026-11-05T10:00:00+09:00).\
            \ 조회 응답에서는 occurred_at으로 나옵니다."
          example: 2026-11-05T10:00:00+09:00
        transaction_id:
          type: string
          description: 이벤트마다 고유한 값으로 1자에서 255자입니다. 같은 값으로 다시 보내면 저장하지 않고 처음 저장한 이벤트를
            유지합니다.
          example: tx-20261105-0001
          maxLength: 255
          minLength: 0
        type:
          type: string
          description: 이벤트 유형입니다. 미터의 event_type과 같은 값이어야 그 미터에 집계됩니다.
          example: api_call
          minLength: 1
      required:
      - customer_id
      - properties
      - timestamp
      - transaction_id
      - type
    IngestEventResponse:
      type: object
      properties:
        duplicate:
          type: boolean
          description: "200 응답에만 실립니다. false면 이번 요청으로 저장했고, true면 같은 transaction_id의\
            \ 이벤트가 이미 있어 저장하지 않고 처음 것을 유지했습니다. 202 응답에는 아직 저장 전이라 없습니다."
