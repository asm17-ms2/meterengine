openapi: 3.1.0
info:
  description: |
    사용량 기반 과금 플랫폼의 API. 사용량 이벤트를 수집하고, 고객별 월 사용량과 청구 예정액을 조회한다.

    요청마다 Authorization 헤더에 Bearer 값으로 API 키(me_live_ 또는 me_test_로 시작)나
    로그인 세션 토큰을 싣는다. 도입사는 키나 세션이 정한다. 헤더가 없으면 401이다.

    오류 응답은 code, message, errors로 이뤄진다. 오류별 처리는 code로 분기한다. message는
    code마다 하나인 한국어 문구이고, errors는 틀린 필드를 짚을 수 있는 400에만 실린다.
  title: MeterEngine API
  version: v1
servers:
- description: 이 문서를 제공한 호스트
  url: /
security:
- bearerAuth: []
paths:
  /v1/api-keys:
    get:
      description: |
        세션 도입사의 API 키를 만든 순서로 돌려준다. 기본은 전체이며 사용 중, 폐기, 만료 상태를 고를 수 있다.
        사용 중은 현재 인증 가능한 키다. 폐기된 키는 만료 시각과 관계없이 폐기로 분류한다. 키 원문은 싣지 않는다.
        로그인 세션만 부를 수 있고 API 키로는 부를 수 없다. 페이지를 나누지 않는다.
      operationId: listApiKeys
      parameters:
      - description: 조회할 키 상태. 생략하면 전체
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - active
          - revoked
          - expired
          - all
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListApiKeysResponse"
          description: API 키 목록. 하나도 없으면 api_keys가 빈 배열이다
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
      summary: API 키 목록 조회
      tags:
      - api-key-controller
    post:
      description: |
        세션 도입사에 API 키를 발급하고 원문을 돌려준다. 원문은 이 응답에서만 볼 수 있고 서버는 해시만 저장한다.
        replaced_api_key_id를 주면 그 키를 이 키로 교체한다. 옛 키는 지금부터 유예 시간(기본 24시간)이 지나면 끝나고,
        이미 그보다 이른 만료 시각이 있으면 그대로 둔다. 로그인 세션만 부를 수 있고 API 키로는 부를 수 없다.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiKeySecretResponse"
          description: 발급한 키와 원문
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: label이 비었거나 255자를 넘거나, scopes가 비었거나 ingest, read, admin이 아닌 값을 담았거나,
            mode가 live나 test가 아니거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_not_found: replaced_api_key_id가 세션 도입사의 폐기하지\
            \ 않은 키가 아니다"
      summary: API 키 발급
      tags:
      - api-key-controller
  /v1/api-keys/{id}:
    delete:
      description: |
        API 키를 폐기한다. 폐기한 키로 요청하면 401이다. 행은 지우지 않고 폐기 시각을 남긴다.
        이미 폐기한 키면 폐기 시각을 그대로 두고 204다. 로그인 세션만 부를 수 있고 API 키로는 부를 수 없다.
      operationId: deleteApiKey
      parameters:
      - description: 폐기할 키의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: 폐기했다. 본문 없음
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 UUID 형식이 틀렸다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_not_found: 세션 도입사에 그런 키가 없다"
      summary: API 키 폐기
      tags:
      - api-key-controller
  /v1/api-keys/{id}/scopes:
    put:
      description: "현재 도입사의 사용 중인 API 키의 스코프만 바꾼다. 키 원문, 모드와 만료 시각을 유지하며 다음 요청부터 바\
        뀐 권한을 적용한다. 로그인 사용자의 관리 권한이 필요하며 API 키로는 부를 수 없다."
      operationId: updateApiKeyScopes
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApiKeyScopesRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
          description: 바뀐 키의 메타데이터. 원문과 해시는 제공하지 않는다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 스코프가 비었거나 지원하지 않는 값이다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: 로그인 관리 권한이 없다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_not_found: 현재 도입사에 그런 키가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=api_key_unavailable: 폐기되거나 만료된 키다"
      summary: API 키 권한 변경
      tags:
      - api-key-controller
  /v1/billable-metric-prices:
    get:
      description: 지정 월에 유효한 조합별 최신 단가를 돌려준다. 월은 기본 이번 달이며 customer_id가 없으면 도입사 공통
        단가만 조회한다.
      operationId: listBillableMetricPrices
      parameters:
      - in: query
        name: month
        required: false
        schema:
          type: string
      - in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricPricesResponse"
          description: 미터별 가격 목록. 미터가 없으면 billable_metric_prices가 빈 배열이다
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 미터별 가격 목록 조회
      tags:
      - billable-metric-price-controller
  /v1/billable-metrics:
    get:
      description: |
        등록한 미터를 code 오름차순으로 전부 돌려준다.
        페이지를 나누지 않는다.
      operationId: listBillableMetrics
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricsResponse"
          description: 미터 목록. 미터가 없으면 billable_metrics가 빈 배열이다
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 미터 목록 조회
      tags:
      - billable-metric-controller
    post:
      description: |
        미터를 등록한다. type이 미터의 event_type과 같은 사용량 이벤트가 이 미터의 집계 대상이다.
        aggregation은 sum, count, count_distinct, min, max, avg, first, last, median, percentile을 받으며 대소문자를 구분하지 않는다.
        count는 전체 이벤트 수이며 target_property를 지정하지 않는다. count_distinct는 대상 속성의 숫자, 문자열, 불리언 고유값 수다.
        나머지는 숫자 속성만 집계한다. first와 last는 occurred_at, transaction_id 순서다. median은 50백분위, percentile은 0~100의 percentile이 필수다.
        집계량을 unit_size(기본 1)로 나눈 뒤 rounding_mode(none, ceil, floor, round)를 rounding_precision(0~12, 기본 0)에 적용한다.
        round는 사사오입이며 none은 유한소수를 그대로 보존하고 순환소수는 유효숫자와 소수 자릿수를 각각 최소 18자리로 보존한다. code는 도입사 안에서 유일하고 등록 뒤 바꿀 수 없다.
        같은 이벤트와 속성에 여러 미터를 등록할 수 있다. 각 미터에 단가를 설정하면 각각 청구한다.
      operationId: createBillableMetric
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillableMetricRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BillableMetricResponse"
          description: 등록된 미터
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: code, name, event_type, aggregation 중 빈 필드가 있거나, 문자열 필드에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있다.
            code=invalid_billable_metric: 집계 방식과 대상 속성, 단위, 반올림, 백분위 설정이 맞지 않거나 dimension_properties에 중복이나 빈 키가 있다. 어느 필드가 왜 거절됐는지는 errors에 있다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=billable_metric_already_exists: 같은 code의 미터가 이미 있다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 집계 미터 등록
      tags:
      - billable-metric-controller
  /v1/billable-metrics/{code}:
    delete:
      description: |
        미터를 지운다. 지운 미터는 되돌릴 수 없다.
        집계된 이벤트가 한 건이라도 있거나 단가가 붙은 미터는 지울 수 없고 409다.
        이미 지운 미터를 다시 지우면 404다.
      operationId: deleteBillableMetric
      parameters:
      - description: 지울 미터의 code.
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        "204":
          description: 지웠다. 본문 없음
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 code에 NUL 문자나 짝이 없는 UTF-16 서로게이\
            트가 있다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=billable_metric_not_found: 그런 code의 미터가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=billable_metric_has_events: 집계된 이벤트가 있어 지울 수 없다.
            code=billable_metric_has_price_rate: 단가가 붙어 있어 지울 수 없다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 집계 미터 삭제
      tags:
      - billable-metric-controller
    get:
      operationId: getBillableMetric
      parameters:
      - in: path
        name: code
        required: true
        schema:
