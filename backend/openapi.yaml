      properties:
        field:
          type: string
          description: 틀린 필드의 이름입니다. 요청에 쓴 이름과 같습니다.
          example: event_type
        message:
          type: string
          description: 이 필드의 값이 거절된 이유
          example: 공백일 수 없습니다
