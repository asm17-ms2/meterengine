openapi: 3.1.0
info:
  description: |
    사용량 기반 과금 플랫폼의 API. 사용량 이벤트를 수집하고, 고객별 월 사용량과 청구 예정액을 조회한다.

    도입사는 X-Organization-Id 헤더로 받는다. 이 헤더는 임시물이며 MS2-126이 Bearer API 키 인증을
    붙이면서 인증 주체에서 꺼내는 형태로 바뀐다.

    오류 응답은 RFC 9457 problem+json이고 4xx에는 code 확장 멤버가 붙는다. 화면 문구는 이 값으로
    고른다. title과 detail은 영어이고 로그와 개발자용이라 그대로 띄우지 않는다. 5xx는 본문 형식을
    약속하지 않으므로 클라이언트는 상태 코드만 본다.
  title: MeterEngine API
  version: v1
servers:
- description: 문서를 서빙한 호스트
  url: /
paths:
  /v1/billable-metrics:
    get:
      description: |
        이 도입사의 미터를 code 오름차순으로 전부 돌려준다.
        미터가 없거나 등록되지 않은 도입사면 billable_metrics가 빈 배열이다.
        페이지를 나누지 않는다. 이 도입사의 전부가 응답의 정의다.
      operationId: listBillableMetrics
      parameters:
      - description: 도입사 ID. Bearer 인증으로 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricsResponse"
          description: 미터 목록. 미터가 없으면 billable_metrics가 빈 배열이다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 미터 목록 조회
      tags:
      - billable-metric-controller
    post:
      description: |
        집계 미터를 등록한다. event_type이 같은 사용량 이벤트가 이 미터의 집계 대상이 된다.
        집계 함수는 SUM만 받는다. SUM은 이벤트 properties에서 target_property 키의 값을 합산하므로
        target_property가 필수다.
        코드는 도입사 안에서 유일하고, 등록 뒤 바꿀 수 없다.
      operationId: createBillableMetric
      parameters:
      - description: 도입사 ID. Bearer 인증으로 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillableMetricRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BillableMetricResponse"
          description: 등록된 미터. 반영 결과를 확인하는 창구다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: |
            code=validation_error: code, name, event_type, aggregation 중 빈 필드가 있거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=invalid_billable_metric: aggregation이 SUM이 아니거나, SUM인데 target_property가 없다. 사유는 detail에 있다.
            code=unknown_organization: X-Organization-Id가 등록된 도입사가 아니다.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=metric_already_exists: 같은 코드의 미터가 이미 있다. 다른 코드를 써야 한다"
      summary: 집계 미터 등록
      tags:
      - billable-metric-controller
  /v1/billable-metrics/{code}/price-policy:
    post:
      description: |
        미터에 가격 정책(가격을 가르는 속성 키의 선언)을 등록한다.
        무차원 미터면 dimension_properties를 빈 배열로 보낸다.
        단가는 이 API가 받지 않고 별도의 단가 API가 등록한다.
        단가가 아직 없는 미터는 청구 예정액 계산에서 라인이 제외된다.
        미터당 정책은 1개다. 이미 있으면 409이고, 수정과 삭제 API는 아직 없다.
      operationId: register
      parameters:
      - description: 도입사 ID. Bearer 인증이 붙으면 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 정책을 붙일 미터의 code.
        in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePricePolicyRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PricePolicyResponse"
          description: 등록된 정책 전체. 반영 결과를 확인하는 창구다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: |
            code=validation_error: dimension_properties가 없거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=invalid_price_policy: 선언에 중복 키나 빈 키가 있다. 사유는 detail에 있다.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=metric_not_found: 그런 미터가 없다. 다른 도입사 소속이어도 같다"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=price_policy_already_exists: 이 미터에 정책이 이미 있다. 요청을 고쳐서\
            \ 될 일이 아니다"
      summary: 가격 정책 등록
      tags:
      - price-policy-controller
  /v1/customers:
    get:
      description: |
        이 도입사의 고객을 이름 오름차순으로 전부 돌려준다. 동명이인이 있어도 순서가 흔들리지 않게
        customer_id가 두 번째 정렬 키다. 사용량 조회, 청구 예정액과 같은 순서다.
        고객이 없거나 등록되지 않은 도입사면 customers가 빈 배열이다.
        페이지를 나누지 않는다. 이 도입사의 전부가 응답의 정의이며, 사용량과 청구 예정액 응답도
        같은 고객 집합을 한 번에 담는다.
      operationId: list
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
          description: 고객 목록. 한 명도 없으면 customers가 빈 배열이다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 고객 목록 조회
      tags:
      - customer-controller
    post:
      description: |
        고객을 만들고 서버가 발급한 customer_id와 함께 돌려준다. 이벤트 수집은 이 id를 실어 보낸다.
        이름 중복을 막지 않는다. 같은 이름의 계열사나 부서를 따로 관리할 수 있고, 구별은 customer_id가 한다.
        Location 헤더를 주지 않는다. 단건 조회 경로가 없어 가리킬 곳이 없다.
      operationId: create
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCustomerRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 만들어진 고객
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: |
            code=validation_error: name이 비었거나 255자를 넘거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=unknown_organization: X-Organization-Id가 등록된 도입사가 아니다.
      summary: 고객 등록
      tags:
      - customer-controller
  /v1/customers/{id}:
    delete:
      description: |
        고객을 지운다. 행이 실제로 사라져 목록과 사용량, 청구 예정액에서 빠지고
        그 고객 id를 실은 이벤트는 미등록 고객으로 거절된다. 되돌리는 API는 없다.
        사용량 이벤트가 한 건이라도 있으면 지우지 않고 409로 거절한다. 이벤트는 청구 근거이고
        지울 수 없어서, 고객만 지우면 그 사용량이 어느 청구서에도 오르지 않는다.
        같은 고객을 두 번 지우면 두 번째는 204가 아니라 404다.
      operationId: delete
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 지울 고객의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: 지웠다. 본문 없음
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=validation_error: 헤더나 경로의 UUID 형식이 틀렸다"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=customer_not_found: 없거나 다른 도입사 소속이다"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=customer_has_events: 사용량 이벤트가 있어 지울 수 없다. 요청을 고쳐서 될 일\
            이 아니다"
      summary: 고객 삭제
      tags:
      - customer-controller
    put:
      description: |
        고객 이름을 바꾸고 갱신된 고객을 돌려준다. 단건 조회가 없으므로 이 응답이 반영 결과를 확인하는 창구다.
        PATCH가 아닌 이유는 고칠 수 있는 것이 이름 하나이고 그것이 항상 필수라, 부분 갱신이라 부를 것이 없어서다.
        필드가 늘면서 일부만 보내는 요청이 필요해지면 그때 PATCH를 따로 추가한다.
        다른 도입사 소속이거나 이미 지워진 고객은 404다. 지운 고객은 행 자체가 없어 없는 고객과 구별되지 않는다.
      operationId: update
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 고칠 고객의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCustomerRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 갱신된 고객
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=validation_error: name이 비었거나 255자를 넘거나, 헤더나 경로의 UUID\
            \ 형식이 틀렸다"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=customer_not_found: 없거나 다른 도입사 소속이다. 둘을 구별해 답하지 않는다"
      summary: 고객 수정
      tags:
      - customer-controller
  /v1/events:
    get:
      description: |
        지정한 달의 이벤트를 occurred_at 최신순으로 한 페이지씩 돌려준다. 같은 시각이 여럿이면
        transaction_id 내림차순으로 순서가 고정돼, 같은 요청을 여러 번 보내도 결과가 같다.
        기간은 KST 기준의 달이다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 귀속된다 (사용량 조회와 같은 판정).
        customer_id, month, event_type을 함께 주면 AND로 걸리고 total도 필터를 적용한 뒤의 건수다.
        properties는 저장된 값을 그대로 낸다. 서버가 키를 고르거나 값을 해석하지 않는다.
        저장 타입이 jsonb라 키 순서와 공백은 수집 때와 달라질 수 있고, 숫자 자릿수는 그대로다.

        FE 규약 둘은 서버가 강제할 수 없어 여기 적어 둔다.
        page는 0부터다(화면의 1페이지 = page=0). 필터를 바꾸면 page를 0으로 되돌린다.
        안 그러면 3페이지를 보다가 조건을 좁혔을 때 그만큼 페이지가 없어 빈 화면이 뜬다.
      operationId: query
      parameters:
      - description: 도입사 ID. MS2-126의 Bearer 인증으로 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 0부터 세는 페이지 번호. 화면의 1페이지가 0이다.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: 한 페이지에 담을 개수.
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: 고객을 좁힌다. 생략하면 도입사의 모든 고객이 대상이다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "조회할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이벤트 종류를 좁힌다. 미터에 없는 값도 저장돼 있으면 그대로 조회된다.
        in: query
        name: event_type
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventPageResponse"
          description: 한 페이지 분량의 이벤트. 조건에 맞는 것이 없으면 events가 빈 배열이다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: |
            code=validation_error: page가 음수거나 size가 1~100 밖이거나, customer_id가 UUID가
            아니거나 month가 yyyy-MM이 아니거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=unknown_customer_reference: (도입사, customer_id) 조합을 찾을 수 없다. 미등록과 다른 도입사
            소속은 구별되지 않는다.
      summary: 사용량 이벤트 조회
      tags:
      - event-controller
    post:
      description: |
        같은 (도입사, transaction_id)의 재전송은 저장하지 않고 최초 저장본을 유지한다(first-write-wins).
        재전송도 200이며 duplicate가 true로 내려온다.
        properties의 내용은 검증하지 않는다. 저장 타입이 jsonb라 키 순서와 공백은 보존되지 않지만,
        숫자는 정수/소수 모두 자릿수가 잘리지 않는다.
        timestamp는 이벤트 발생 시각이며 occurred_at으로 저장된다.
        received_at은 서버가 찍으며 요청에 담긴 값은 무시된다.
      operationId: ingest
      parameters:
      - description: 도입사 ID. MS2-126의 Bearer 인증으로 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventIngestRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventIngestResponse"
          description: 저장했거나(duplicate=false) 이미 저장돼 있다(true)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: |
            code=validation_error: 형식 검증 실패. errors에 필드명과 사유가 들어 있다.
            code=unknown_customer_reference: (도입사, customer_id) 조합을 찾을 수 없다.
            code=invalid_event: DB가 담을 수 없는 값이다. 같은 본문으로 재시도해도 성공하지 않는다.
      summary: 사용량 이벤트 수집
      tags:
      - event-controller
  /v1/invoices/draft:
    get:
      description: |
        도입사의 모든 고객에 대해 미터별 사용량 x 단가로 청구 예정액을 계산해 돌려준다.
        집계는 조회 시점에 계산하며 저장하지 않는다. 기간은 KST 기준의 달이다.
        금액은 원 단위 정수이고, 라인(고객 x 미터)마다 원 미만을 절사한 뒤 합산한다.
        이벤트가 없는 고객도 모든 미터 라인이 수량 0, 금액 0으로 들어간다.
        고객 순서는 이름 오름차순, 라인 순서는 미터 code 오름차순으로 고정이다.
      operationId: previewDraftInvoice
      parameters:
      - description: 도입사 ID. MS2-126의 Bearer 인증으로 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: "집계할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftInvoiceResponse"
          description: 고객별 청구 예정액. 미터가 없는 도입사는 각 고객의 lines가 빈 배열이다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "X-Organization-Id 누락/형식 오류, 또는 month 형식 오류. code=validation_error이\
            고 errors에 필드명과 사유가 들어 있다"
      summary: 청구 예정액 조회
      tags:
      - draft-invoice-controller
  /v1/price-policies:
    get:
      description: |
        이 도입사의 미터를 code 오름차순으로 전부 돌려주고, 미터마다 등록된 가격 정책을 함께 싣는다.
        정책이 아직 없는 미터는 dimension_properties가 null이다. 빈 배열은 정책이 있는 무차원 미터라는 뜻이라 서로 다르다.
        화면이 정책을 붙일 미터를 고르려면 정책 없는 미터도 보여야 해서 함께 싣는다.
        미터가 없거나 등록되지 않은 도입사면 price_policies가 빈 배열이다.
        미터의 이름과 집계 기준은 싣지 않는다. 미터 자체의 조회는 미터 API의 몫이다.
        단가는 무차원 조합('{}')에 붙은 기본 단가 하나만 싣는다. 조합별 단가는 다차원 계산이 붙을 때 함께 연다.
        수량을 싣지 않으므로 이 응답만으로는 금액을 계산할 수 없다.
        페이지를 나누지 않는다. 이 도입사의 전부가 응답의 정의다.
      operationId: listPricePolicies
      parameters:
      - description: 도입사 ID. Bearer 인증이 붙으면 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PricePolicyListResponse"
          description: 미터별 가격 정책. 미터가 없으면 price_policies가 빈 배열이다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 가격 정책 목록 조회
      tags:
      - price-policy-controller
  /v1/usage:
    get:
      description: |
        도입사의 미터마다 그 미터의 event_type과 맞는 이벤트를 고객별로 합산해 돌려준다.
        기간은 KST 기준의 달이다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 귀속된다.
        도입사의 모든 고객이 응답에 들어가며, 이벤트가 없는 고객은 quantity가 0이다.
        properties의 target_property 값이 숫자가 아닌 이벤트는 합계에서 빠진다.
        금액은 내지 않는다 (사용량 x 단가는 청구 예정액 조회의 몫).
      operationId: aggregateBillableMetricUsages
      parameters:
      - description: 도입사 ID. MS2-126의 Bearer 인증으로 대체될 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: "집계할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricUsagesResponse"
          description: 미터별/고객별 사용량. 미터가 없는 도입사는 billable_metric_usages가 빈 배열이다
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
          description: "X-Organization-Id 누락/형식 오류, 또는 month 형식 오류. code=validation_error이\
            고 errors에 필드명과 사유가 들어 있다"
      summary: 고객별 월 사용량 조회
      tags:
      - billable-metric-usage-controller
components:
  schemas:
    BillableMetricResponse:
      type: object
      properties:
        aggregation:
          type: string
        code:
          type: string
        event_type:
          type: string
        name:
          type: string
        target_property:
          type: string
    BillableMetricUsageCustomer:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        quantity:
          type: number
    BillableMetricUsageResponse:
      type: object
      properties:
        aggregation:
          type: string
        code:
          type: string
        customers:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricUsageCustomer"
        event_type:
          type: string
        name:
          type: string
        target_property:
          type: string
    CreateBillableMetricRequest:
      type: object
      properties:
        aggregation:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        event_type:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        target_property:
          type: string
      required:
      - aggregation
      - code
      - event_type
      - name
    CustomerListResponse:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
    CustomerResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        customer_id:
          type: string
          format: uuid
        name:
          type: string
    DraftInvoiceCustomer:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DraftInvoiceLine"
    DraftInvoiceLine:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        billable_metric_code:
          type: string
        quantity:
          type: number
        target_property:
          type: string
        unit_price:
          type: number
    DraftInvoiceResponse:
      type: object
      properties:
        calculated_at:
          type: string
          format: date-time
        customers:
          type: array
          items:
            $ref: "#/components/schemas/DraftInvoiceCustomer"
        month:
          type: string
        total_amount:
          type: integer
          format: int64
    EventEntry:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties: {}
        received_at:
          type: string
          format: date-time
        transaction_id:
          type: string
    EventIngestRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        event_type:
          type: string
          minLength: 1
        properties:
          type: object
          additionalProperties: {}
        timestamp:
          type: string
          format: date-time
        transaction_id:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - customer_id
      - event_type
      - properties
      - timestamp
      - transaction_id
    EventIngestResponse:
      type: object
      properties:
        duplicate:
          type: boolean
        transaction_id:
          type: string
    EventPageResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventEntry"
        month:
          type: string
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    ListBillableMetricUsagesResponse:
      type: object
      properties:
        billable_metric_usages:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricUsageResponse"
        month:
          type: string
    ListBillableMetricsResponse:
      type: object
      properties:
        billable_metrics:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricResponse"
    MetricPricePolicyResponse:
      type: object
      properties:
        billable_metric_code:
          type: string
        dimension_properties:
          type:
          - array
          - "null"
          description: "가격을 가르는 이벤트 속성 키의 선언. 정책이 아직 없는 미터는 null이고, 정책이 있는 무차원 미터는\
            \ 빈 배열이다"
          items:
            type: string
        unit_price:
          type:
          - number
          - "null"
          description: "무차원 조합('{}')에 붙은 기본 단가. 단가 행이 아직 없으면 null이고, 그 미터는 청구 예정액\
            \ 계산에서 라인이 빠진다. 0은 무료를 뜻하는 값이라 null과 다르다"
    PricePolicyListResponse:
      type: object
      properties:
        price_policies:
          type: array
          items:
            $ref: "#/components/schemas/MetricPricePolicyResponse"
    PricePolicyResponse:
      type: object
      properties:
        billable_metric_code:
          type: string
        dimension_properties:
          type: array
          items:
            type: string
    ProblemFieldError:
      type: object
      description: 형식 검증에 걸린 필드 하나
      properties:
        field:
          type: string
          example: event_type
        message:
          type: string
          example: 공백일 수 없습니다
    ProblemResponse:
      type: object
      description: RFC 9457 problem+json 오류 응답. code 확장 멤버가 최상위에 실린다.
      properties:
        code:
          type: string
          description: |
            오류 종류를 고르는 기계 판독용 값. 화면 문구는 이 값으로 고른다.
            지금 도달 가능한 4xx에는 모두 실리지만 required가 아니다. 서버가 분류하지 못한 4xx에는
            일부러 붙이지 않으므로, 클라이언트는 값이 없을 때의 기본 문구를 갖고 있어야 한다.
          enum:
          - validation_error
          - unknown_customer_reference
          - invalid_event
          - malformed_request_body
          - request_type_not_supported
          - response_type_not_acceptable
          - method_not_allowed
          - endpoint_not_found
          - customer_not_found
          - customer_has_events
          - unknown_organization
          - metric_not_found
          - price_policy_already_exists
          - invalid_price_policy
          - metric_already_exists
          - invalid_billable_metric
          example: validation_error
        detail:
          type: string
          description: |
            이 요청에 한정된 설명. 영어이고 로그와 개발자용이다. 화면에 그대로 띄우지 않는다.
            도입사에게 보여줄 문구는 code로 고르고, 필드별 사유는 errors[].message를 쓴다.
          example: the request could not be accepted as sent
        errors:
          type: array
          description: |
            형식 검증에 걸린 필드 목록. code=validation_error일 때만 실리고 다른 code에는 아예 없다.
            필드마다 도입사가 보낸 이름(field)과 사유(message)가 들어 있다.
          items:
            $ref: "#/components/schemas/ProblemFieldError"
        instance:
          type: string
          format: uri
          description: 문제가 난 요청의 경로.
          example: /v1/events
        status:
          type: integer
          format: int32
          description: HTTP 상태 코드. 응답 상태 줄과 같다. 이 스키마에서 유일하게 항상 실리는 필드다.
          example: 400
        title:
          type: string
          description: 상태의 짧은 요약. 화면 문구로 쓰지 않는다.
          example: Bad Request
      required:
      - status
    SaveCustomerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - name
    SavePricePolicyRequest:
      type: object
      properties:
        dimension_properties:
          type: array
          items:
            type: string
      required:
      - dimension_properties
