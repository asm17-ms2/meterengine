        external_id:
          type: string
          description: 자사 시스템에서 고객을 가리키는 ID입니다. 등록할 때 보내지 않았으면 null입니다.
        id:
          type: string
          format: uuid
          description: 고객 ID(UUID)입니다. 사용량 이벤트의 customer_id에 씁니다.
        name:
          type:
          - string
