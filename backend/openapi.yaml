  /v1/email-verifications:
    post:
      description: |
        가입한 계정이 있고 아직 인증하지 않았으면 새 인증 메일을 보냅니다. 앞서 보낸 링크도 만료 전까지 쓸 수 있습니다.
        계정이 없거나 이미 인증했으면 아무것도 보내지 않습니다. 어느 경우든 같은 202를 돌려줍니다.
        요청 수 한도를 확인한 뒤 turnstile_token을 확인하고 나서 처리합니다.
      operationId: createEmailVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailVerificationRequest"
        required: true
      responses:
        "202":
          description: 접수했습니다. 보냈는지는 알려 주지 않습니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: email이 비었거나 이메일 형식이 아니거나 254자를 넘거나, turnstile_token이 2048자를 넘습니다.
            code=captcha_failed: turnstile_token이 없거나 확인을 통과하지 못했습니다. 위젯을 다시 풀고 보냅니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 다시 보내기 한도를 넘었습니다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
              style: simple
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=captcha_unavailable: 캡차 확인 결과를 받지 못해 요청을 받지 않았습니다. 잠시\
            \ 뒤 다시 시도합니다."
      security: []
      summary: 인증 메일 다시 보내기
      tags:
      - email-verification-controller
  /v1/event-batches:
    post:
      description: |
        이벤트를 1건부터 100건까지 한 요청에 담아 보냅니다. 응답의 results에 보낸 순서대로 이벤트마다 결과가 하나씩 나오고, 이벤트 하나가 거절돼도 나머지 이벤트는 그대로 처리합니다.

        | HTTP 상태 | 뜻 | 나올 수 있는 result |
        | --- | --- | --- |
        | 200 | 모든 이벤트를 요청 안에서 처리했습니다. | stored, duplicate, rejected |
        | 202 | 받은 이벤트가 하나 이상 있습니다. 저장은 응답 뒤에 합니다. | accepted, rejected, failed |
        | 400 | 요청 전체를 거절했습니다. 본문을 JSON으로 읽을 수 없거나, events가 없거나 비었거나 100건을 넘습니다. | 없음(results 대신 오류 응답) |

        200과 202는 둘 다 성공입니다. 어느 쪽으로 답할지는 서버 구성에 따라 다르므로 상태 코드로 분기하지 말고 이벤트마다 result를 확인합니다.

        | result | 뜻 | 다시 보내기 |
        | --- | --- | --- |
        | stored | 이번 요청으로 저장했습니다. | 보내지 않습니다. |
        | duplicate | 같은 transaction_id의 이벤트가 이미 저장돼 있어 저장하지 않았습니다. 처음 저장한 이벤트를 유지합니다. | 보내지 않습니다. |
        | accepted | 받기만 했고 아직 저장하지 않았습니다. 고객 확인과 중복 판정을 포함한 저장은 응답 뒤에 합니다. | 보내지 않습니다. |
        | rejected | 거절했습니다. 이유는 error.code에 있습니다. | 그대로 보내면 같은 이유로 거절됩니다. 값을 고친 뒤 보냅니다. |
        | failed | 받지 못했습니다. | 같은 transaction_id로 다시 보냅니다. |

        ### accepted와 stored의 차이

        stored는 저장까지 끝났다는 뜻이고, accepted는 받았다는 뜻일 뿐 저장을 약속하지 않습니다. accepted 이벤트는 저장할 때 다음과 같이 처리합니다.

        - 고객이 없거나(customer_not_found) 보관한 고객이면(customer_archived) 저장하지 않고 수집 거절 기록(GET /v1/event-rejections/search)에 남깁니다.
        - 같은 transaction_id의 이벤트가 이미 저장돼 있으면 저장하지 않고 처음 이벤트를 유지합니다. 따로 기록하거나 알리지 않습니다.
        - 나머지는 저장합니다.

        이벤트 수집이 202로 답할 때는 요청에서 바로 rejected로 돌려준 이벤트가 수집 거절 기록에 남지 않습니다. 응답의 error를 로그에 남겨 확인합니다.

        ### 다시 보내야 하는 경우

        - result가 failed인 이벤트: 그 이벤트를 같은 transaction_id로 다시 보냅니다. 같은 transaction_id는 한 번만 저장되므로, 실제로는 받았던 이벤트를 다시 보내도 두 번 저장되지 않습니다.
        - 503 event_ingest_unavailable: 이벤트를 하나도 받지 못했습니다. 같은 요청을 그대로 다시 보냅니다.
        - 429 rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After 헤더의 초만큼 기다린 뒤 같은 요청을 다시 보냅니다.
      operationId: ingestEventBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventBatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                stored_duplicate_rejected:
                  description: "0번은 저장했고, 1번은 이미 저장된 transaction_id라 저장하지 않았고, 2번은\
                    \ timestamp에 오프셋이 없어 거절한 경우입니다."
                  summary: "저장, 중복, 형식 오류"
                  value:
                    results:
                    - index: 0
                      transaction_id: tx-20261105-0001
                      result: stored
                    - index: 1
                      transaction_id: tx-20261105-0002
                      result: duplicate
                    - index: 2
                      transaction_id: tx-20261105-0003
                      result: rejected
                      error:
                        code: validation_error
                        message: 요청 값이 올바르지 않습니다
                        errors:
                        - field: "events[2].timestamp"
                          message: 이벤트 필드의 형식이 올바르지 않습니다
              schema:
                $ref: "#/components/schemas/IngestEventBatchResponse"
          description: 모든 이벤트를 요청 안에서 처리했습니다. 이 응답에는 accepted와 failed가 없습니다.
        "202":
          content:
            application/json:
              examples:
                accepted_rejected_failed:
                  description: "0번은 받았고, 1번은 받는 기간이 지나 거절했고, 2번은 받지 못해 다시 보내야 하는 경\
                    우입니다."
                  summary: "받음, 기간 지남, 받지 못함"
                  value:
                    results:
                    - index: 0
                      transaction_id: tx-20261105-0001
                      result: accepted
                    - index: 1
                      transaction_id: tx-20261105-0002
                      result: rejected
                      error:
                        code: event_too_old
                        message: 받는 기간이 지난 이벤트입니다
                        errors:
                        - field: "events[1].timestamp"
                          message: 수신 시각보다 35일 넘게 지난 시각입니다
                    - index: 2
                      transaction_id: tx-20261105-0003
                      result: failed
                      error:
                        code: event_ingest_unavailable
                        message: 이벤트를 받지 못했습니다. 같은 transaction_id로 다시 보내세요
              schema:
                $ref: "#/components/schemas/IngestEventBatchResponse"
          description: 받은 이벤트가 하나 이상 있습니다. 저장은 응답 뒤에 합니다. 이 응답에는 stored와 duplicate가
            없습니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=malformed_request_body: 본문을 JSON으로 읽을 수 없습니다.
            code=validation_error: events가 없거나 비었거나 100건을 넘습니다. 이벤트 하나의 형식 오류는 이 응답이 아니라 그 이벤트의 rejected 결과로 돌려줍니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=request_body_too_large: 요청 본문이 512KB를 넘습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=event_ingest_unavailable: 이벤트를 하나도 받지 못했습니다. 그대로 다시 보\
            내면 됩니다."
      summary: 사용량 이벤트 batch 수집
      tags:
      - event-batch-controller
  /v1/event-issues/search:
    get:
      description: "저장된 이벤트를 지금 미터 정의와 단가로 다시 검사해, 연결할 미터가 없거나, 수량을 읽을 수 없거나, 적용 단\
        가가 없어 과금에서 빠진 이벤트를 돌려줍니다. 대상은 조회한 달에 발생했고 occurred_at이 cutoff_at보다 이른 이벤트이\
        며, cutoff_at은 지금 시각과 그 달의 끝 가운데 이른 쪽입니다. 수신 시각(received_at)은 보지 않으므로 집계 마감\
        \ 뒤에 받아 청구에서 빠진 지난달 이벤트를 따로 가려내지 않습니다. total과 summary는 고객, 검색어, 사유 조건을 적용한\
        \ 문제 행 수이며, 한 이벤트가 여러 미터에서 문제가 되면 여러 번 셉니다. warnings는 이 조건과 관계없이 그 달 전체를 셉\
        니다. 수집을 거절한 이벤트는 저장되지 않아 들지 않습니다. 원본 properties는 돌려주지 않습니다. 모르는 조회 조건은 400\
        \ validation_error로 거절합니다."
      operationId: searchEventIssues
      parameters:
      - description: "조회할 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다."
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이 고객의 이벤트만 봅니다. 없는 고객이면 404 customer_not_found입니다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "이 문제 종류만 봅니다. unknown_event_type(연결할 미터 없음), invalid_target_property(수\
          량을 읽을 수 없음), unpriced_usage(적용 단가 없음) 가운데 하나입니다."
        in: query
        name: reason
        required: false
        schema:
          type: string
          pattern: unknown_event_type|invalid_target_property|unpriced_usage
      - description: "transaction_id, 고객 이름, 고객 외부 ID에서 이 문자열을 대소문자 구분 없이 부분 검색합니다\
          ."
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 0
      - description: 0부터 세는 페이지 번호
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: 한 페이지에 담을 개수
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventIssuesResponse"
          description: 한 페이지 분량의 과금에서 빠진 이벤트입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: month, reason, page, size 값이 틀렸거나 모\
            르는 조회 조건이 있습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 과금에서 빠진 이벤트 조회
      tags:
      - event-issue-controller
  /v1/event-rejections/search:
