    patch:
      description: "미터를 보낸 값으로 통째로 바꿉니다. PUT과 같지만 If-Match가 반드시 있어야 합니다. 조회한 version을\
        \ 큰따옴표로 감싸 If-Match 헤더에 보냅니다. 그 사이 다른 요청이 미터를 고쳐 version이 다르면 409입니다. 다른 요\
        청이 고친 값을 덮어쓰지 않으려면 이 경로를 쓰고, version 확인 없이 덮어써도 되면 PUT /v1/billable-metrics/{code}를\
        \ 씁니다."
