  /v1/payment-attempts/{id}/cancellations:
    get:
      description: |
        결제 시도의 취소를 요청 시각이 늦은 것부터 돌려줍니다.
        requested_at과 completed_at은 KST(+09:00)로 나옵니다.
      operationId: listPaymentCancellations
      parameters:
      - description: 취소 내역을 볼 결제 시도의 ID
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPaymentCancellationsResponse"
          description: 결제 취소 목록
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 id가 UUID가 아닙니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_attempt_not_found: 그런 결제 시도가 없습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 결제 취소 목록 조회
      tags:
      - payment-cancellation-controller
    post:
      description: |
        done인 결제 시도의 금액 전부나 일부를 토스페이먼츠에 취소 요청합니다. amount를 빼면 남은 결제 금액 전부를 취소합니다.
        남은 결제 금액은 시도 금액에서 done인 취소의 합을 뺀 값입니다. 시도의 결제 모드에 저장한 토스페이먼츠 키로 토스페이먼츠를 부릅니다.
        취소되면 status=done, 거절되면 status=failed와 failure_code, failure_message가 남고 둘 다 201입니다.
        토스페이먼츠 응답으로 결과를 확인하지 못하면 status=pending인 취소를 201로 돌려줍니다.
        시도 하나에 pending인 취소는 하나뿐입니다. 있으면 409입니다. 테스트 키인지 라이브 키인지가 취소 대상의 결제 모드와 다르면 409입니다.
        Idempotency-Key를 주면 같은 조직과 업무 환경의 같은 요청을 다시 보내도 그 취소를 지금 상태로 201로 돌려줍니다. 같은 키로 다른 시도, 금액, 사유를 보내면 409입니다.
        이 키는 고객과 미터 등록의 Idempotency-Key와 규칙이 다릅니다. UUID만 받고, 충돌 code는 payment_cancellation_idempotency_conflict이며, 다시 돌려준 응답에 Idempotency-Replayed 헤더를 붙이지 않습니다.
        requested_at과 completed_at은 KST(+09:00)로 나옵니다.
        payments 권한이 필요합니다. admin 권한만으로는 부를 수 없습니다.
      operationId: createPaymentCancellation
      parameters:
      - description: 취소할 결제 시도의 ID
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: 취소 요청마다 새로 만든 UUID입니다. 응답을 받지 못해 다시 요청할 때는 같은 값을 보냅니다.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentCancellationRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentCancellationResponse"
          description: "결제 취소입니다. status는 done, failed, pending 중 하나입니다."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 경로의 id나 Idempotency-Key가 UUID가 아니거나, amount가 양수가 아니거나, reason이 비었거나 200자를 넘거나 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있습니다.
            code=malformed_request_body: 본문을 JSON으로 읽을 수 없거나 amount가 정수가 아닙니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_attempt_not_found: 그런 결제 시도가 없습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=payment_mode_mismatch: 테스트 키인지 라이브 키인지가 취소 대상의 결제 모드와 다릅니다.
            code=payment_attempt_not_cancelable: 시도가 done이 아닙니다.
            code=payment_attempt_fully_canceled: done인 시도를 이미 전액 취소해 남은 결제 금액이 0원입니다.
            code=payment_cancellation_in_progress: 이 시도에 pending인 취소가 있습니다.
            code=payment_cancellation_amount_exceeded: amount가 남은 결제 금액보다 큽니다.
            code=payment_cancellation_idempotency_conflict: 같은 Idempotency-Key를 다른 취소 요청에 썼습니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 결제 취소 요청
      tags:
      - payment-cancellation-controller
  /v1/payment-method-registrations/{token}:
    get:
      description: |
        카드 등록 페이지가 토스페이먼츠 SDK를 띄우는 데 쓸 값을 돌려줍니다. 일회용 카드 등록 token으로 인증하는 공개 API입니다.
        token은 응답에 싣지 않습니다.
        없거나, 만료됐거나, 이미 카드 등록에 쓴 링크는 모두 404입니다.
        expires_at은 KST(+09:00)로 나옵니다.
      operationId: getPaymentMethodRegistration
      parameters:
      - description: 카드 등록 링크를 만들 때 받은 token
        in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentMethodRegistrationResponse"
          description: 카드 등록 링크
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: token에 NUL 문자나 짝이 없는 UTF-16 서로게이트가\
            \ 있습니다."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_method_registration_not_found: 링크가 없거나, 만료됐거나\
            , 이미 쓰였습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=customer_archived: 링크를 만든 뒤 고객을 보관했습니다.
            code=toss_payments_credential_missing: 링크를 만든 결제 모드의 토스페이먼츠 키가 없습니다.
      security: []
      summary: 카드 등록 링크 조회
      tags:
      - payment-method-registration-controller
  /v1/payment-method-registrations/{token}/billing-keys:
    post:
      description: |
        카드 등록 페이지가 토스페이먼츠 SDK로 받은 authKey를 보내면 빌링키를 발급하고 고객의 카드로 저장합니다.
        일회용 카드 등록 token으로 인증하는 공개 API입니다.
        링크를 만든 결제 모드의 카드로 저장합니다. 그 결제 모드에 카드가 있으면 새 카드로 바꾸고 이전 빌링키는 토스페이먼츠에서 지웁니다.
        성공하면 링크는 쓰인 것이 되어 다시 쓸 수 없습니다. 토스페이먼츠가 거절했거나 결과를 알 수 없으면 링크는 쓰이지 않은 채 남습니다.
        빌링키 원문은 응답에 싣지 않습니다. authenticated_at은 KST(+09:00)로 나옵니다.
      operationId: createBillingKey
      parameters:
      - description: 카드 등록 링크를 만들 때 받은 token
        in: path
        name: token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillingKeyRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentMethodResponse"
          description: 저장한 고객 카드
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: auth_key, customer_key, consent_document_version 중 빈 값이 있거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, customer_key가 링크의 고객과 다릅니다.
            code=payment_method_rejected: 토스페이먼츠가 카드 인증을 거절했습니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=payment_method_registration_not_found: 링크가 없거나, 만료됐거나\
            , 이미 쓰였습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=customer_archived: 링크를 만든 뒤 고객을 보관했습니다.
            code=toss_payments_credential_missing: 링크를 만든 결제 모드의 토스페이먼츠 키가 없습니다.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_unavailable: 토스페이먼츠 응답으로 빌링키 발급 결과를 확인하\
            지 못했습니다."
      security: []
      summary: 빌링키 발급
      tags:
      - billing-key-controller
  /v1/payment-methods:
    get:
      description: |
        현재 업무 환경에 등록한 고객 카드를 customer_id 오름차순으로 전부 돌려줍니다. customer_id를 주면 그 고객의 카드만 돌려줍니다.
        여러 고객의 카드를 한 번에 보거나 교체되거나 보관된 이전 카드까지 볼 때 씁니다. 카드가 없으면 404가 아니라 빈 배열을 돌려줍니다.
        고객 한 명의 지금 카드만 확인하려면 GET /v1/customers/{id}/payment-method를 씁니다.
        빌링키 원문은 싣지 않습니다.
        페이지를 나누지 않습니다. authenticated_at은 KST(+09:00)로 나옵니다.
        status가 archived나 all이면 교체되거나 보관된 이전 카드를 현재 행 뒤에 교체되거나 보관된 시각 내림차순으로 붙이고, archived_at에 그 시각을 담습니다. 이전 카드는 새 결제에 다시 쓰이지 않습니다.
      operationId: listPaymentMethods
      parameters:
      - description: 보관 상태입니다. 생략하면 active입니다.
        in: query
        name: status
        required: false
        schema:
          type: string
          default: active
          enum:
          - active
          - archived
          - all
      - description: 주면 이 고객의 카드만 돌려줍니다. 생략하면 모든 고객의 카드를 돌려줍니다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPaymentMethodsResponse"
          description: 고객 카드 목록입니다. 등록한 카드가 없으면 payment_methods가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 요청 값이 올바르지 않습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 고객 카드 목록 조회
      tags:
      - payment-method-controller
  /v1/payment-reconciliation-mismatches:
    get:
      description: |
        하루치 토스페이먼츠 거래 목록과 MeterEngine의 done 결제 시도, done 취소를 맞춰 보고 남긴 불일치를 돌려줍니다. 현재 업무 환경의 기록만 담고, 기존 데이터에서는 두 결제 모드를 담습니다.
        기간은 불일치를 찾은 시각(detected_at)의 KST 날짜로 거르고, from 날짜 0시부터 to 날짜가 끝날 때까지입니다.
        detected_at 내림차순입니다. transacted_at과 detected_at은 KST(+09:00)로 나옵니다. 페이지를 나누지 않습니다.
      operationId: listPaymentReconciliationMismatches
      parameters:
      - description: "기간의 첫날(yyyy-MM-dd, KST)"
        example: 2026-10-01
        in: query
        name: from
        required: true
        schema:
          type: string
          format: date
      - description: "기간의 마지막 날(yyyy-MM-dd, KST)입니다. 이날 전부를 담습니다."
        example: 2026-10-31
        in: query
        name: to
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPaymentReconciliationMismatchesResponse"
          description: 불일치 목록입니다. 기간 안에 불일치가 없으면 payment_reconciliation_mismatches가
            빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: from이나 to가 없거나 yyyy-MM-dd가 아니거나 0001-01-01부\
            터 9999-12-31까지의 범위 밖이거나, from이 to보다 늦습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 결제 대사 불일치 목록 조회
      tags:
      - payment-reconciliation-mismatch-controller
  /v1/payment-setting:
    get:
      description: |
        현재 업무 환경의 결제 모드를 돌려줍니다. 테스트 환경과 라이브 환경의 결제 모드는 고정이며 updated_at=null입니다.
        기존 데이터는 저장한 결제 모드를 쓰고, 바꾼 적 없으면 mode=test입니다.
        updated_at은 KST(+09:00)로 나옵니다.
      operationId: getPaymentSetting
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentSettingResponse"
          description: 결제 모드
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 요청 값이 올바르지 않습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 결제 모드 조회
      tags:
      - payment-setting-controller
    put:
      description: |
        기존 데이터의 결제 모드를 바꿉니다. live로 바꾸려면 live 결제 모드의 토스페이먼츠 키가 먼저 저장되어 있어야 합니다.
        테스트 환경과 라이브 환경은 현재 업무 환경과 같은 mode만 받습니다. 다른 mode는 payment_mode_mismatch로 거절합니다.
        로그인 세션만 부를 수 있고 API 키로는 부를 수 없습니다.
        updated_at은 KST(+09:00)로 나옵니다.
      operationId: updatePaymentSetting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentSettingRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentSettingResponse"
