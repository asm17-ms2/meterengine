openapi: 3.1.0
info:
  description: |
    사용량 기반 과금 플랫폼의 API. 사용량 이벤트를 수집하고, 고객별 월 사용량과 청구 예정액을 조회한다.

    모든 요청에 X-Organization-Id 헤더로 도입사 ID를 보낸다. 인증이 붙기 전까지 쓰는 임시 헤더다.

    오류 응답은 code, message, errors로 이뤄진다. 오류별 처리는 code로 분기한다. message는
    code마다 하나인 한국어 문구이고, errors는 틀린 필드를 짚을 수 있는 400에만 실린다.
  title: MeterEngine API
  version: v1
servers:
- description: 이 문서를 제공한 호스트
  url: /
paths:
  /v1/billable-metric-prices:
    get:
      description: |
        등록한 미터를 code 오름차순으로 전부 돌려주고, 미터마다 가격 정책과 기본 단가를 붙인다.
        가격 정책이 없는 미터는 dimension_properties가 null이다. 빈 배열은 이벤트 속성에 따라 단가가 갈리지 않는다는 뜻이다.
        unit_price는 속성 조건 없이 적용되는 기본 단가이고, 없으면 null이다. 속성 값 조합별 단가는 싣지 않는다.
        페이지를 나누지 않는다.
      operationId: listBillableMetricPrices
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricPricesResponse"
          description: 미터별 가격 목록. 미터가 없으면 billable_metric_prices가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 미터별 가격 목록 조회
      tags:
      - billable-metric-price-controller
  /v1/billable-metrics:
    get:
      description: |
        등록한 미터를 code 오름차순으로 전부 돌려준다.
        X-Organization-Id가 등록되지 않은 도입사여도 오류가 아니라 빈 배열이다.
        페이지를 나누지 않는다.
      operationId: listBillableMetrics
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricsResponse"
          description: 미터 목록. 미터가 없으면 billable_metrics가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 미터 목록 조회
      tags:
      - billable-metric-controller
    post:
      description: |
        미터를 등록한다. type이 미터의 event_type과 같은 사용량 이벤트가 이 미터의 집계 대상이다.
        aggregation은 sum만 받는다. sum은 이벤트 properties에서 target_property 키의 값을 합산하므로
        target_property가 필수다.
        code는 도입사 안에서 유일해야 하고 등록 뒤 바꿀 수 없다.
      operationId: createBillableMetric
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillableMetricRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BillableMetricResponse"
          description: 등록된 미터
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: code, name, event_type, aggregation 중 빈 필드가 있거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=invalid_billable_metric: aggregation이 sum이 아니거나, sum인데 target_property가 없다. 어느 필드가 왜 거절됐는지는 errors에 있다.
            code=unknown_organization: X-Organization-Id가 등록된 도입사가 아니다.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=billable_metric_already_exists: 같은 code의 미터가 이미 있다"
      summary: 집계 미터 등록
      tags:
      - billable-metric-controller
  /v1/billable-metrics/{code}/price-policy:
    post:
      description: |
        미터의 가격 정책을 등록한다. 가격 정책은 단가를 가르는 이벤트 속성 키를 선언한 것이다.
        속성에 따라 단가가 갈리지 않으면 dimension_properties를 빈 배열로 보낸다.
        단가는 이 API로 등록하지 않는다. 단가가 없는 미터는 청구 예정액에 라인이 나오지 않는다.
        미터 하나에 가격 정책은 하나다. 이미 있으면 409다.
      operationId: createPricePolicy
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 가격 정책을 등록할 미터의 code.
        in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricePolicyRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PricePolicyResponse"
          description: 등록된 가격 정책
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: dimension_properties가 없거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=invalid_price_policy: dimension_properties에 중복된 키나 빈 키가 있다. 어느 필드가 왜 거절됐는지는 errors에 있다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=billable_metric_not_found: 그런 미터가 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=price_policy_already_exists: 이 미터에 가격 정책이 이미 있다"
      summary: 가격 정책 등록
      tags:
      - price-policy-controller
  /v1/customers:
    get:
      description: |
        등록한 고객을 이름 오름차순으로 전부 돌려준다. 이름이 같으면 id 순이다.
        사용량 조회, 청구 예정액 조회의 고객 순서와 같다.
        X-Organization-Id가 등록되지 않은 도입사여도 오류가 아니라 빈 배열이다.
        페이지를 나누지 않는다.
      operationId: listCustomers
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListCustomersResponse"
          description: 고객 목록. 한 명도 없으면 customers가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니다"
      summary: 고객 목록 조회
      tags:
      - customer-controller
    post:
      description: |
        고객을 등록하고 서버가 발급한 id와 함께 돌려준다. 사용량 이벤트를 보낼 때 이 id를 customer_id에 싣는다.
        이름이 같은 고객을 여럿 등록할 수 있다. 구별은 id로 한다.
      operationId: createCustomer
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 등록된 고객
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: name이 비었거나 255자를 넘거나, X-Organization-Id가 없거나 UUID가 아니다.
            code=unknown_organization: X-Organization-Id가 등록된 도입사가 아니다.
      summary: 고객 등록
      tags:
      - customer-controller
  /v1/customers/{id}:
    delete:
      description: |
        고객을 지운다. 지운 고객은 목록과 사용량, 청구 예정액에서 빠지고
        그 id로 보낸 이벤트는 404(customer_not_found)로 거절된다. 지운 고객은 되돌릴 수 없다.
        사용량 이벤트가 한 건이라도 있는 고객은 지울 수 없고 409다.
        이미 지운 고객을 다시 지우면 404다.
      operationId: deleteCustomer
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 지울 고객의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: 지웠다. 본문 없음
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 헤더나 경로의 UUID 형식이 틀렸다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: 그런 고객이 없다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_has_events: 사용량 이벤트가 있는 고객이라 지울 수 없다"
      summary: 고객 삭제
      tags:
      - customer-controller
    put:
      description: |
        고객 이름을 바꾸고 바뀐 고객을 돌려준다.
      operationId: updateCustomer
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 고칠 고객의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 바뀐 고객
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: name이 비었거나 255자를 넘거나, 헤더나 경로의 UUID\
            \ 형식이 틀렸다"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: 그런 고객이 없다"
      summary: 고객 수정
      tags:
      - customer-controller
  /v1/events:
    get:
      description: |
        지정한 달의 이벤트를 occurred_at 최신순으로 한 페이지씩 돌려준다.
        occurred_at이 같으면 transaction_id 내림차순이다.
        기간은 KST 기준의 달이다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 든다. 사용량 조회와 기준이 같다.
        customer_id, month, type을 함께 주면 모두 만족하는 이벤트만 나오고, total은 조건을 적용한 뒤의 건수다.
        properties는 저장된 값 그대로다. 키 순서와 공백은 보낸 것과 다를 수 있고, 숫자 자릿수는 그대로다.
      operationId: listEvents
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: 0부터 세는 페이지 번호.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: 한 페이지에 담을 개수.
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: 고객을 좁힌다. 생략하면 모든 고객이 대상이다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "조회할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이벤트 type을 좁힌다. 어느 미터의 event_type도 아닌 값이어도 저장된 이벤트는 조회된다.
        in: query
        name: type
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListEventsResponse"
          description: 한 페이지 분량의 이벤트. 조건에 맞는 것이 없으면 events가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: page가 음수거나 size가 1~100 밖이거나, customer_id가 UUID가
            아니거나 month가 yyyy-MM이 아니거나, X-Organization-Id가 없거나 UUID가 아니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없다"
      summary: 사용량 이벤트 조회
      tags:
      - event-controller
    post:
      description: |
        사용량 이벤트 한 건을 저장한다.
        transaction_id가 같은 이벤트를 다시 보내면 저장하지 않고 처음 저장한 이벤트를 유지한다.
        이때도 응답은 200이고 duplicate가 true다. 응답을 받지 못했으면 같은 transaction_id로 다시 보내면 된다.
        properties의 내용은 검증하지 않는다. 키 순서와 공백은 보존되지 않고,
        숫자는 정수와 소수 모두 자릿수가 잘리지 않는다.
        timestamp는 이벤트가 발생한 시각이고 조회 응답에서는 occurred_at으로 나온다.
        received_at은 서버가 받은 시각이며 요청에 실어도 무시된다.
      operationId: ingestEvent
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
          description: 저장했다(duplicate=false). 이미 저장된 transaction_id면 duplicate=true다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 필수 필드가 없거나 형식이 틀렸다. 어느 필드가 왜 거절됐는지는 errors에 있다.
            code=invalid_event: 저장할 수 없는 값이 들어 있다. 같은 본문을 다시 보내도 성공하지 않는다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없다"
      summary: 사용량 이벤트 수집
      tags:
      - event-controller
  /v1/invoices/draft:
    get:
      description: |
        모든 고객의 청구 예정액을 미터별 사용량 x 단가로 계산해 돌려준다.
        조회할 때마다 계산하며 저장하지 않는다. 기간은 KST 기준의 달이다.
        금액은 원 단위 정수다. 라인(고객 x 미터)마다 원 미만을 버린 뒤 합산한다.
        이벤트가 없는 고객도 단가가 있는 미터마다 수량 0, 금액 0인 라인이 나온다.
        고객은 이름 오름차순, 라인은 미터 code 오름차순이다.
      operationId: previewDraftInvoice
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: "집계할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftInvoiceResponse"
          description: 고객별 청구 예정액. 등록한 미터가 없으면 각 고객의 lines가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니거나,\
            \ month가 yyyy-MM이 아니다"
      summary: 청구 예정액 조회
      tags:
      - draft-invoice-controller
  /v1/usage:
    get:
      description: |
        미터마다 type이 그 미터의 event_type과 같은 이벤트를 고객별로 합산해 돌려준다.
        기간은 KST 기준의 달이다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 든다.
        모든 고객이 응답에 나오며, 이벤트가 없는 고객은 quantity가 0이다.
        properties의 target_property 값이 숫자가 아닌 이벤트는 합계에서 빠진다.
        금액은 싣지 않는다. 금액은 청구 예정액 조회(GET /v1/invoices/draft)가 준다.
      operationId: aggregateBillableMetricUsages
      parameters:
      - description: 도입사 ID. 인증이 붙기 전까지 쓰는 임시 헤더다.
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
          format: uuid
      - description: "집계할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricUsagesResponse"
          description: "미터별, 고객별 사용량. 등록한 미터가 없으면 billable_metric_usages가 빈 배열이다"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: X-Organization-Id가 없거나 UUID가 아니거나,\
            \ month가 yyyy-MM이 아니다"
      summary: 고객별 월 사용량 조회
      tags:
      - billable-metric-usage-controller
components:
  schemas:
    BillableMetricPriceResponse:
      type: object
      properties:
        billable_metric_code:
          type: string
        dimension_properties:
          type:
          - array
          - "null"
          description: "단가를 가르는 이벤트 속성 키. 가격 정책이 없는 미터는 null이고, 속성에 따라 단가가 갈리지 않는\
            \ 미터는 빈 배열이다"
          items:
            type: string
        unit_price:
          type:
          - number
          - "null"
          description: "속성 조건 없이 적용되는 기본 단가. 없으면 null이고, 그 미터는 청구 예정액에 라인이 나오지 않는다\
            . 0은 무료라는 뜻이라 null과 다르다"
    BillableMetricResponse:
      type: object
      properties:
        aggregation:
          type: string
        code:
          type: string
        event_type:
          type: string
        name:
          type: string
        target_property:
          type: string
    BillableMetricUsageCustomer:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
          description: 집계 시점의 고객 이름
        quantity:
          type: number
          description: 이벤트 properties의 값을 합산한 수량. 소수 자릿수를 그대로 싣는다
    BillableMetricUsageResponse:
      type: object
      properties:
        aggregation:
          type: string
        code:
          type: string
        customers:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricUsageCustomer"
        event_type:
          type: string
        name:
          type: string
        target_property:
          type: string
    CreateBillableMetricRequest:
      type: object
      properties:
        aggregation:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        event_type:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        target_property:
          type: string
      required:
      - aggregation
      - code
      - event_type
      - name
    CreateCustomerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - name
    CreatePricePolicyRequest:
      type: object
      properties:
        dimension_properties:
          type: array
          items:
            type: string
      required:
      - dimension_properties
    CustomerResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
    DraftInvoiceCustomer:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DraftInvoiceLine"
    DraftInvoiceLine:
      type: object
      properties:
        amount:
          type: integer
          format: int64
        billable_metric_code:
          type: string
        quantity:
          type: number
        target_property:
          type: string
        unit_price:
          type: number
    DraftInvoiceResponse:
      type: object
      properties:
        calculated_at:
          type: string
          format: date-time
        customers:
          type: array
          items:
            $ref: "#/components/schemas/DraftInvoiceCustomer"
        month:
          type: string
        total_amount:
          type: integer
          format: int64
    ErrorResponse:
      type: object
      description: "오류 응답. code로 오류 종류를 구분하고, message는 code마다 하나인 한국어 문구다."
      properties:
        code:
          type: string
          description: 오류 종류. 오류별 처리는 이 값으로 분기한다.
          enum:
          - validation_error
          - malformed_request_body
          - unknown_organization
          - invalid_event
          - invalid_billable_metric
          - invalid_price_policy
          - customer_not_found
          - billable_metric_not_found
          - endpoint_not_found
          - method_not_allowed
          - response_type_not_acceptable
          - customer_has_events
          - billable_metric_already_exists
          - price_policy_already_exists
          - request_type_not_supported
          - internal_server_error
        errors:
          type: array
          description: 틀린 필드 목록. 400 응답에만 실린다.
          items:
            $ref: "#/components/schemas/FieldError"
        message:
          type: string
          description: code마다 하나인 한국어 문구. 예고 없이 바뀔 수 있으니 분기에 쓰지 않는다.
          example: 서버 내부 오류입니다
      required:
      - code
      - message
    EventResponse:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        occurred_at:
          type: string
          format: date-time
        properties:
          type: object
          additionalProperties: {}
        received_at:
          type: string
          format: date-time
        transaction_id:
          type: string
        type:
          type: string
    FieldError:
      type: object
      description: 틀린 필드 하나
      properties:
        field:
          type: string
          description: 틀린 값을 보낸 자리의 이름. 요청에 쓴 이름과 같다.
          example: event_type
        message:
          type: string
          description: 이 자리의 값이 거절된 이유.
          example: 공백일 수 없습니다
    IngestEventRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        properties:
          type: object
          additionalProperties: {}
        timestamp:
          type: string
          format: date-time
        transaction_id:
          type: string
          maxLength: 255
          minLength: 0
        type:
          type: string
          minLength: 1
      required:
      - customer_id
      - properties
      - timestamp
      - transaction_id
      - type
    IngestEventResponse:
      type: object
      properties:
        duplicate:
          type: boolean
        transaction_id:
          type: string
    ListBillableMetricPricesResponse:
      type: object
      properties:
        billable_metric_prices:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricPriceResponse"
    ListBillableMetricUsagesResponse:
      type: object
      properties:
        billable_metric_usages:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricUsageResponse"
        month:
          type: string
    ListBillableMetricsResponse:
      type: object
      properties:
        billable_metrics:
          type: array
          items:
            $ref: "#/components/schemas/BillableMetricResponse"
    ListCustomersResponse:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/CustomerResponse"
    ListEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        month:
          type: string
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    PricePolicyResponse:
      type: object
      properties:
        billable_metric_code:
          type: string
        dimension_properties:
          type: array
          items:
            type: string
    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - name
