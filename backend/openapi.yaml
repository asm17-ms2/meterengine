components:
  schemas:
    AcceptOrganizationInvitationRequest:
      type: object
      properties:
        consents:
          type: array
          description: "새로 만들 계정의 약관 동의입니다. 초대 이메일로 가입한 계정이 없을 때 보내며, terms_of_service와\
            \ privacy_policy를 한 번씩 담습니다."
          items:
            $ref: "#/components/schemas/InvitationConsentRequest"
        name:
          type: string
          description: 새로 만들 계정의 사용자 이름입니다. 초대 이메일로 가입한 계정이 없을 때 보내며 255자까지입니다.
          maxLength: 255
          minLength: 0
        password:
          type: string
          description: "새로 만들 계정의 비밀번호입니다. 초대 이메일로 가입한 계정이 없을 때 보내며, 8자 이상 72자 이하이\
            고 UTF-8로 72바이트 이하여야 합니다."
          maxLength: 72
          minLength: 8
    AcceptSessionConsentsRequest:
      type: object
      properties:
        consents:
          type: array
          description: 동의한 문서입니다. 동의가 남은 사용자는 terms_of_service와 privacy_policy를 한
            번씩 담습니다.
          items:
            $ref: "#/components/schemas/CreateSignupConsentRequest"
          minItems: 1
        new_password:
          type: string
          description: 대표관리자나 MeterEngine 운영자가 만든 계정이 처음 동의할 때 정하는 새 비밀번호입니다. 처음 받은
            비밀번호와 달라야 합니다.
          maxLength: 72
          minLength: 8
      required:
      - consents
    ApiKeyResponse:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          description: 키를 발급한 시각(ISO 8601)
        environment_id:
          type: string
          format: uuid
          description: 키를 발급한 업무 환경의 ID(UUID)입니다. 업무 환경에 속하지 않은 키에는 이 필드가 없습니다.
        expires_at:
          type: string
          format: date-time
          description: "키가 만료되는 시각(ISO 8601)입니다. 교체된 키면 24시간 유예가 끝나는 시각이고, 교체되지 않은\
            \ 키는 null입니다."
        id:
          type: string
          format: uuid
          description: API 키 ID(UUID)
        label:
          type: string
          description: 키를 알아보려고 붙인 이름
        last_four:
          type: string
          description: 원문의 끝 네 글자입니다. 키를 알아보는 데 씁니다.
        mode:
          type: string
          description: "테스트 키인지 라이브 키인지 나타냅니다. live는 원문이 me_live_로, test는 me_test_로\
            \ 시작합니다."
          enum:
          - live
          - test
        rate_limit_per_minute:
          type: integer
          format: int32
          description: "분당 요청 한도입니다. null이면 라이브 키는 무제한이고, 테스트 키에는 테스트 환경 한도가 걸립니다\
            . 값이 있으면 테스트 키는 이 값과 테스트 환경 한도 가운데 작은 쪽이 적용됩니다. 1분 단위로 끊어 세지 않습니다. 처음에\
            는 한도만큼 연달아 보낼 수 있고, 그 뒤에는 분당 한도의 속도로 다시 채워집니다."
        revoked_at:
          type: string
          format: date-time
          description: 키를 폐기한 시각(ISO 8601)입니다. 폐기하지 않았으면 null입니다.
        scopes:
          type: array
          description: 키의 권한입니다. admin은 ingest와 read를 포함하고 payments는 포함하지 않습니다.
          items:
            type: string
