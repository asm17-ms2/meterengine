  /v1/live-environment-applications:
    get:
      description: |
        모든 조직의 신청을 최근 것부터 돌려줍니다. status를 주면 그 상태의 신청만 돌려줍니다.
        승인한 신청은 승인 뒤 첫 실결제 응답의 상점아이디를 observed_toss_payments_merchant_id에 담습니다. 신청한 값과 다르면 운영자가 확인합니다.
        MeterEngine 운영자 로그인 세션만 부를 수 있습니다. 페이지를 나누지 않습니다.
      operationId: listLiveEnvironmentApplications
      parameters:
      - description: 상태로 좁힙니다. 생략하면 모든 상태입니다.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - pending
          - approved
          - rejected
          pattern: pending|approved|rejected
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListLiveEnvironmentApplicationsResponse"
          description: 신청 목록입니다. 없으면 live_environment_applications가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: status가 pending, approved, rejected가\
            \ 아닙니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청입니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
      summary: 라이브 환경 이용 신청 목록 조회
      tags:
      - live-environment-application-controller
  /v1/live-environment-applications/{id}/status:
    put:
      description: |
        검토 중인 신청을 승인하거나 거절하고 바뀐 신청을 돌려줍니다.
        승인하면 신청한 조직의 라이브 환경이 열려 그 조직이 라이브 환경과 라이브 키를 쓸 수 있습니다. 신청할 때 받은 토스페이먼츠 키도 이때 라이브 환경의 토스페이먼츠 키로 저장합니다.
        거절은 rejection_reason이 있어야 하고, 신청한 조직이 그 사유를 읽습니다. 거절된 조직은 다시 신청할 수 있습니다.
        MeterEngine 운영자 로그인 세션만 부를 수 있습니다.
      operationId: updateLiveEnvironmentApplicationStatus
      parameters:
      - description: 검토할 신청의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLiveEnvironmentApplicationStatusRequest"
        required: true
