                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: mode가 비었거나 test나 live가 아니거나, NUL 문자\
            나 짝이 없는 UTF-16 서로게이트가 있습니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_credential_missing: live로 바꾸려는데 live 결제\
            \ 모드의 토스페이먼츠 키가 없습니다."
      summary: 결제 모드 변경
      tags:
      - payment-setting-controller
  /v1/price-plans:
    get:
      description: |
        customer_id를 주면 그 고객의 요금제만, 생략하면 공통 요금제만 돌려줍니다.
        month를 주면 시작 월부터 종료 월 전까지에 그 달이 드는 버전만, 생략하면 기간과 관계없이 버전 이력을 돌려줍니다. 보관 여부는 month와 관계없이 status로 고릅니다. 시작 월 내림차순이고 페이지를 나누지 않습니다.
        청구는 보관 효력(archived_from)까지 따져 버전을 고르므로, month와 status=all로 조회한 목록에서 시작 월이 가장 늦은 버전이 그 달 청구에 쓰입니다. 그 버전이 archived_from부터 멈췄으면 이전 버전으로 돌아가지 않습니다.
      operationId: listPricePlans
      parameters:
      - description: "이 달(yyyy-MM, KST)이 시작 월부터 종료 월 전까지에 드는 버전만 고릅니다. 보관 여부는 이 값과\
          \ 관계없이 status로 고릅니다. 생략하면 기간으로 거르지 않습니다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이 고객의 요금제만 고릅니다. 생략하면 공통 요금제만 나옵니다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "보관 상태로 고릅니다. 생략하면 active로 보관하지 않은 버전만 나옵니다. archived는 보관한 버전\
          , all은 둘 다입니다."
        in: query
        name: status
        required: false
        schema:
          type: string
          default: active
          enum:
          - active
          - archived
          - all
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListPricePlansResponse"
          description: 요금제 버전 목록입니다. 조건에 맞는 것이 없으면 price_plans가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: customer_id가 UUID가 아니거나, month가 yyyy-MM이\
            \ 아니거나 0001-01부터 9999-12까지의 범위 밖이거나, status가 active, archived, all 가운데\
            \ 하나가 아닙니다."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 현재 업무 환경에 없\
            습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 요금제 이력 조회
      tags:
      - price-plan-controller
    post:
      description: "기본료와 최소 사용료 요금제 버전을 등록합니다. customer_id를 주면 그 고객 요금제, 생략하면 공통 요\
        금제입니다. 사용료 합이 최소 사용료보다 적으면 차액을 최소 사용료 조정 항목으로 더한 뒤 기본료를 더합니다. 그 달 사용량이 없는\
        \ 고객에게는 적용하지 않습니다. 청구할 때 기본료와 최소 사용료는 10원 미만을 버린 값을 쓰며, 버린 기본료가 0원이면 기본료 청\
        구 항목이 생기지 않습니다. 같은 고객 범위와 시작 월의 버전이 있으면 그 버전을 고칩니다."
      operationId: createPricePlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePricePlanRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PricePlanResponse"
          description: 저장한 요금제입니다. 같은 고객 범위와 시작 월의 버전을 고친 경우에도 201입니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=price_plan_history_immutable: effective_from이 이번 달보다 앞입니다.
            code=customer_archived: customer_id가 가리키는 고객을 보관했습니다.
            code=archive_restoration_conflict: 같은 고객 범위와 시작 월의 버전을 보관했지만 그 버전이 이번 달에는 아직 적용됩니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 기본료와 최소 사용료 요금제 등록
      tags:
      - price-plan-controller
  /v1/price-plans/{id}:
    delete:
      description: 이번 달까지 적용하고 다음 달부터 멈춥니다. 아직 시작하지 않은 버전은 시작 전에 취소됩니다. 버전 이력은 남깁니다.
        이미 보관한 버전에 다시 보내도 204입니다.
