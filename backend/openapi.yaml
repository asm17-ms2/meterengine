  /v1/events:
    get:
      description: |
        지정한 달의 이벤트를 한 페이지씩 돌려줍니다.
        기본은 occurred_at 최신순이고, occurred_at이 같으면 transaction_id 내림차순입니다. sort와 order로 정렬 기준과 방향을 바꾸면 값이 같은 이벤트는 transaction_id를 같은 방향으로 정렬합니다.
        기간은 KST 기준의 달입니다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 듭니다. 사용량 조회와 기준이 같습니다.
        customer_id, month, type을 함께 주면 모두 만족하는 이벤트만 나오고, total은 조건을 적용한 뒤의 건수입니다.
        from과 to를 함께 주면 월 대신 자유 기간을 조회합니다. 시작은 포함하고 종료 시각은 제외합니다. 날짜만 준 to는 그 날짜의 하루 전체를 포함합니다. 시간대 없는 날짜와 시각은 KST입니다.
        q는 transaction_id, 고객 이름과 외부 ID의 부분 검색입니다. properties는 그 JSON 객체의 키와 값을 모두 가진 이벤트만 고릅니다.
        from과 to는 함께 주어야 하고 month와 같이 쓸 수 없습니다. 청구서 검색은 한쪽만 주거나 month와 함께 줄 수 있어 규칙이 다릅니다.
        모르는 조회 조건은 무시합니다. 내보내기, 월 목록, 과금에서 빠진 이벤트 검색과 수집 거절 검색은 모르는 조회 조건을 400으로 거절합니다.
        properties는 저장된 값 그대로입니다. 키 순서와 공백은 보낸 것과 다를 수 있고, 숫자 자릿수는 그대로입니다.
      operationId: listEvents
      parameters:
      - description: 0부터 세는 페이지 번호.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - description: 한 페이지에 담을 개수.
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: 이 고객의 이벤트만 돌려줍니다. 생략하면 모든 고객이 대상입니다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "조회할 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다. from, to와 함께 쓸 수 없습니다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이 유형의 이벤트만 돌려줍니다. 어느 미터의 event_type도 아닌 값이어도 저장된 이벤트는 조회됩니다.
        in: query
        name: type
        required: false
        schema:
          type: string
      - description: "기간 조회의 시작 시각이며 이 시각을 포함합니다. 날짜(yyyy-MM-dd)나 ISO 8601 시각으로 주고\
          , 시간대가 없으면 KST입니다. to와 함께 줘야 하며 month와 같이 쓸 수 없습니다."
        in: query
        name: from
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - description: 기간 조회의 종료 시각이며 이 시각은 포함하지 않습니다. 날짜만 주면 그 날짜의 하루 전체를 포함합니다. 형식은
          from과 같습니다.
        in: query
        name: to
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - description: "transaction_id, 고객 이름, 고객 외부 ID에서 이 문자열을 대소문자 구분 없이 부분 검색합니다\
          ."
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 512
          minLength: 0
      - description: "정렬 기준입니다. occurred_at(기본), received_at, transaction_id, customer_name,\
          \ type 가운데 하나입니다."
        in: query
        name: sort
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      - description: 정렬 방향입니다. desc(기본) 또는 asc입니다.
        in: query
        name: order
        required: false
        schema:
          type: string
          maxLength: 4
          minLength: 0
      - description: "JSON 객체 문자열입니다. properties에 이 객체의 키와 값이 모두 들어 있는 이벤트만 봅니다(예\
          : {\"region\":\"seoul\"})."
        in: query
        name: properties
        required: false
        schema:
          type: string
          maxLength: 4096
          minLength: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListEventsResponse"
          description: 한 페이지 분량의 이벤트입니다. 조건에 맞는 것이 없으면 events가 빈 배열입니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: page가 음수거나 size가 1~100 밖이거나, customer_id가 UUID가
            아니거나 month가 yyyy-MM이 아니거나 0001-01부터 9999-12까지의 범위 밖이거나, type에 NUL 문자나 짝이 없는 UTF-16 서로게이트가
            있습니다. from과 to 가운데 하나만 줬거나 month와 함께 줬거나 읽을 수 없는 시각이거나, sort, order, properties 값이 틀려도 같습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 수집 이벤트 목록 조회
      tags:
      - event-controller
    post:
      description: |
        사용량 이벤트 한 건을 받습니다.
        이벤트를 받으면 202로 답하고 저장은 뒤에서 합니다. 요청 안에서 저장까지 마치면 200으로 답하기도 하며, 이 경우도 정상입니다. 200과 202를 모두 성공으로 처리하세요.
        transaction_id가 같은 이벤트를 다시 보내면 저장하지 않고 처음 저장한 이벤트를 유지합니다.
        200으로 답할 때는 duplicate가 true입니다. 응답을 받지 못했으면 같은 transaction_id로 다시 보내면 됩니다.
        properties는 키나 문자열 값에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나 숫자가 소수점 앞 131072자리나 소수점 뒤 16383자리를 넘으면 거절하고, 그 밖의 내용은 검증하지 않습니다.
        키 순서와 공백은 보존하지 않고, 숫자는 정수와 소수 모두 자릿수를 자르지 않습니다.
        timestamp는 이벤트가 발생한 시각이고 조회 응답에서는 occurred_at으로 나옵니다.
        received_at은 수신 시각이며 요청에 실어도 무시합니다.
        timestamp가 수신 시각보다 35일 넘게 과거이면 받지 않습니다. 1일은 24시간이며, 정확히 35일 전인 이벤트는 받습니다.
        200으로 답할 때는 이미 저장된 transaction_id면 timestamp가 받는 기간 밖이어도 거절하지 않고 duplicate=true로 답합니다.
        202로 답할 때는 고객 확인과 중복 판정을 저장할 때 하므로 404와 409를 내지 않습니다. 고객이 없거나 보관한 고객의 이벤트는 수집 거절에 기록됩니다.
        202로 답할 때는 받는 기간 밖의 timestamp를 이미 저장된 transaction_id여도 400 event_too_old로 거절하고, 이 거절은 수집 거절에 기록되지 않습니다.
      operationId: ingestEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
          description: "받아서 저장까지 마쳤습니다. 이번에 저장했으면 duplicate=false, 이미 저장된 transaction_id면\
            \ duplicate=true입니다."
        "202":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IngestEventResponse"
          description: 요청을 받았습니다. 저장은 뒤에서 하며 응답에 duplicate가 없습니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=malformed_request_body: 본문을 JSON으로 읽을 수 없거나 값의 타입이 맞지 않습니다. timestamp에 오프셋이 없거나 customer_id가 UUID가 아니어도 이 code입니다.
            code=validation_error: 필수 필드가 없거나 transaction_id가 255자를 넘거나, 문자열(properties 안쪽 포함)에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나, properties의 숫자가 소수점 앞 131072자리나 소수점 뒤 16383자리를 넘거나, timestamp가 저장할 수 없는 범위의 시각입니다. 어느 필드가 왜 거절됐는지는 errors에 있습니다.
            code=event_too_old: timestamp가 수신 시각보다 35일 넘게 과거입니다. 같은 이벤트를 다시 보내도 받지 않습니다. errors[0].field는 timestamp입니다. event_too_old 거절은 이벤트 수집이 202로 답할 때는 수집 거절에 기록되지 않습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: customer_id가 가리키는 고객이 없습니다. 이벤트 수\
            집이 202로 답할 때는 이 응답 대신 저장할 때 수집 거절에 기록합니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_archived: customer_id가 가리키는 고객을 보관했습니다. 이미 저\
            장된 transaction_id면 거절하지 않고 200 duplicate=true로 답합니다. 이벤트 수집이 202로 답할 때\
            는 이 응답 대신 저장할 때 수집 거절에 기록합니다."
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=request_body_too_large: 요청 본문이 64KB를 넘습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=event_ingest_unavailable: 이벤트를 받지 못했습니다. 같은 transaction_id로\
            \ 다시 보내면 됩니다."
      summary: 사용량 이벤트 수집
      tags:
      - event-controller
  /v1/events/export:
    get:
      description: "이벤트 목록과 같은 월 또는 자유 기간, 고객, 유형, 검색어, 속성 조건과 정렬을 적용합니다. page와 size는\
        \ 받지만 내보내기에는 쓰지 않습니다. 조건 전체가 10,000행을 넘거나, include_properties=true일 때 원본 properties\
        \ 합계가 32MB를 넘으면 400 validation_error로 거절합니다. UTF-8 BOM과 CRLF를 쓰며, 수식으로 읽힐\
        \ 문자열은 앞에 작은따옴표를 붙입니다. include_properties=true일 때만 원본 properties JSON 열을 더\
        하며 숫자 자릿수를 그대로 둡니다. 모르는 조회 조건은 400 validation_error로 거절합니다."
      operationId: exportEvents
      parameters:
      - description: 받지만 내보내기에는 쓰지 않습니다. CSV에는 조건 전체의 행이 들어갑니다.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
