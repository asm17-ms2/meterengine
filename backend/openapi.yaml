  /v1/toss-payments-credentials:
    get:
      description: |
        저장한 토스페이먼츠 키를 mode 오름차순으로 돌려준다. 저장한 모드만 나온다.
        시크릿 키 원문은 돌려주지 않고 마지막 네 자만 secret_key_last_four로 준다.
        verified_at과 updated_at은 KST(+09:00)로 나온다.
      operationId: listTossPaymentsCredentials
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListTossPaymentsCredentialsResponse"
          description: 키 목록. 저장한 키가 없으면 toss_payments_credentials가 빈 배열이다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 요청 값이 올바르지 않다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 토스페이먼츠 키 목록 조회
      tags:
      - toss-payments-credential-controller
  /v1/toss-payments-credentials/{mode}:
    put:
      description: |
        경로의 mode에 쓸 토스페이먼츠 클라이언트 키와 시크릿 키를 저장한다. 그 모드에 키가 있으면 덮어쓴다.
        test 모드는 test_ck_와 test_sk_로, live 모드는 live_ck_와 live_sk_로 시작하는 키만 받는다.
        결제위젯 키(test_gck_, test_gsk_ 등)는 받지 않는다.
        저장 전에 시크릿 키로 토스페이먼츠 결제 조회를 한 번 불러 키가 유효한지 확인한다.
        시크릿 키는 암호화해 저장하고, 응답에는 마지막 네 자만 싣는다.
        verified_at과 updated_at은 KST(+09:00)로 나온다.
      operationId: updateTossPaymentsCredential
      parameters:
      - description: 키를 쓸 결제 모드. test 또는 live.
        in: path
        name: mode
        required: true
        schema:
          type: string
          enum:
          - test
          - live
          pattern: test|live
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTossPaymentsCredentialRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TossPaymentsCredentialResponse"
          description: 저장한 키
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: 경로의 mode가 test나 live가 아니거나, client_key나 secret_key가 비었거나, 문자열에 NUL 문자나 짝이 없는 UTF-16 서로게이트가 있거나.
            code=invalid_toss_payments_credential: 키가 mode에 맞는 접두사로 시작하지 않거나, 토스페이먼츠가 시크릿 키를 거절했다. 어느 필드가 거절됐는지는 errors에 있다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=toss_payments_unavailable: 토스페이먼츠 응답으로 키가 유효한지 확인하지 못\
            했다. 키는 저장하지 않았다"
      summary: 토스페이먼츠 키 저장
      tags:
      - toss-payments-credential-controller
  /v1/toss-payments-webhooks/{organization_id}:
    post:
      description: |
        토스페이먼츠 개발자센터에 도입사마다 등록하는 웹훅 주소다. 일회용 카드 등록 토큰으로 인증하는 공개 API다.
        본문은 믿지 않는다. eventType이 PAYMENT_STATUS_CHANGED일 때만 data.orderId로 그 도입사의 결제 시도를 찾고, 시도 결제 모드의 키로 토스페이먼츠에 결제를 다시 조회해 반영한다.
        다시 조회한 결제가 DONE이면 pending인 시도를 done으로, ABORTED나 EXPIRED면 failed로 바꾼다. 시도에 pending인 취소가 있고 조회한 cancels에 맞는 취소가 있으면 그 취소를 done으로 바꾼다.
        본문을 JSON으로 읽을 수 없거나, 다른 eventType이거나, 그런 시도가 없으면 바꾸지 않고 200이다.
      operationId: receiveTossPaymentsWebhook
      parameters:
      - description: 웹훅을 등록한 도입사의 ID.
        in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        "200":
          description: 받았다. 본문은 없다
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 경로의 organization_id가 UUID가 아니다"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=internal_server_error: 토스페이먼츠 재조회 결과를 확인하지 못했다. 토스페이먼\
            츠가 다시 보낸다"
      security: []
      summary: 토스페이먼츠 웹훅 수신
      tags:
      - toss-payments-webhook-controller
  /v1/usage:
    get:
      description: |
        미터마다 event_type이 같은 이벤트를 설정한 집계 방식으로 계산한다.
        기간은 KST 기준의 달이다. occurred_at 2026-08-31T23:59:59+09:00 이벤트는 8월에,
        2026-09-01T00:00:00+09:00 이벤트는 9월에 든다.
        지금 이후 시각의 이벤트는 집계에 들지 않는다.
        모든 고객이 응답에 나오며, 이벤트가 없는 고객은 quantity가 0이고 dimension_usages가 빈 배열이다.
        dimension_usages는 미터의 dimension_properties마다 이벤트 properties에서 뽑은 값의 조합별로 수량을 나눈 것이고,
        고객 전체 수량은 원본 이벤트를 따로 집계하므로 조합별 수량의 합과 다를 수 있다. 청구는 조합별 정확 수량에 단가를 적용한다. none이면 raw_quantity_numerator/(raw_quantity_denominator*unit_size), 반올림 모드이면 처리한 quantity를 사용한다.
        raw_quantity는 변환 전 집계량, quantity는 unit_size 나눗셈과 반올림을 적용한 결과다.
        count는 속성과 관계없이 전체 이벤트를 센다. count_distinct는 숫자, 문자열, 불리언 고유값만 세고 나머지는 제외한다.
        다른 집계는 target_property가 숫자인 이벤트만 계산한다. 차원이 없으면 dimension_values가 빈 객체다.
        금액은 싣지 않는다. 금액은 청구 예정액 조회(GET /v1/invoices/draft)가 준다.
      operationId: aggregateBillableMetricUsages
      parameters:
      - description: "집계할 달(yyyy-MM, KST). 생략하면 이번 달이다."
        example: 2026-08
        in: query
        name: month
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListBillableMetricUsagesResponse"
          description: "미터별, 고객별 사용량. 등록한 미터가 없으면 billable_metric_usages가 빈 배열이다"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: month가 yyyy-MM이 아니거나 0001-01부터 9999-12까\
            지의 범위 밖이다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이거나, 도입사가 정해지지 않은 로그인 세션이다.
            code=organization_not_active: 도입사가 활성 상태가 아니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었다. Retry-After 헤더\
            의 초만큼 기다린 뒤 다시 보낸다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 초
              required: true
              schema:
                type: integer
                format: int32
      summary: 고객별 월 사용량 조회
      tags:
      - billable-metric-usage-controller
  /v1/user-accounts:
    get:
      description: |
        모든 사용자를 만든 순서로 돌려준다. 사용자마다 소속된 도입사를 소속된 순서로 담는다.
        operator 로그인 세션만 부를 수 있다. 페이지를 나누지 않는다.
      operationId: listUserAccounts
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListUserAccountsResponse"
          description: 사용자 목록
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: 키의 스코프나 계정의 역할로는 할 수 없는 요청이다."
      summary: 사용자 목록 조회
      tags:
      - user-account-controller
    post:
      description: |
        플랫폼 운영자 세션으로 새 운영자 계정을 만든다. 역할은 서버가 operator로 정한다.
        도입사 소속과 대리 동의는 만들지 않는다. 새 계정은 본인이 로그인해 필수 안내에 동의해야 운영할 수 있다.
        이미 가입한 이메일이면 계정과 비밀번호를 바꾸지 않고 409를 돌려준다. 기존 계정의 승격은 역할 변경 경로를 사용한다.
      operationId: createUserAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserAccountRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserAccountResponse"
          description: 소속 도입사가 없는 새 플랫폼 운영자
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 이메일, 이름이나 초기 비밀번호가 형식 또는 길이 규칙을 벗어났\
            다"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 모르는 값이거나, 폐기 또는 만료됐다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=permission_denied: 플랫폼 운영자 세션이 아니다. code=consent_required:\
            \ 본인 안내 동의가 필요하다"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=email_already_exists: 이미 가입한 이메일이다"
      summary: 플랫폼 운영자 생성
      tags:
      - user-account-controller
