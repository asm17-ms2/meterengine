        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: 그런 고객이 없습니다."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 고객 조회
      tags:
      - customer-controller
    patch:
      description: "고객 이름과 청구 이메일을 보낸 값으로 통째로 바꿉니다. PUT과 같지만 If-Match가 반드시 있어야 합니다\
        . 조회한 version을 큰따옴표로 감싸 If-Match 헤더에 보냅니다. 그 사이 다른 요청이 고객을 고쳐 version이 다르면\
        \ 409이고 원래 데이터는 그대로입니다. 다른 요청이 고친 값을 덮어쓰지 않으려면 이 경로를 쓰고, version 확인 없이 덮어써\
        도 되면 PUT /v1/customers/{id}를 씁니다."
      operationId: updateConditionalCustomer
      parameters:
      - description: 고칠 고객의 ID
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "고객을 조회해 받은 version을 큰따옴표로 감싼 값(예: \"3\")입니다. 반드시 보내야 하며, 빼거나\
          \ 형식이 틀리면 400, 지금 version과 다르면 409입니다."
        in: header
        name: If-Match
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 바뀐 고객
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=validation_error: name이 비었거나 255자를 넘거나 NUL 문자나 짝이 없는 UTF-16 서로게이트를 담았거나, billing_email이 이메일 형식이 아니거나(@ 뒤 도메인에 점이 있어야 합니다) 254자를 넘거나, 경로의 UUID 형식이 틀렸습니다. If-Match가 큰따옴표로 감싼 version이 아니어도 이 코드이며 errors의 field는 If-Match입니다. PATCH에서 If-Match를 빼도 같습니다.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=authentication_required: Authorization 헤더가 없습니다.
            code=invalid_credentials: 키나 토큰의 형식이 틀렸거나, 등록되지 않은 값이거나, 폐기되거나 만료됐습니다.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=permission_denied: 키의 권한이나 계정의 역할로는 할 수 없는 요청이거나, 조직이 정해지지 않은 로그인 세션입니다.
            code=organization_not_active: 조직의 이용이 정지됐습니다.
            code=consent_required: 로그인 세션의 사용자가 약관과 개인정보 처리방침에 아직 동의하지 않았습니다. POST /v1/sessions/current/consents로 동의합니다.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=customer_not_found: 그런 고객이 없습니다."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
            code=customer_archived: 보관한 고객입니다. 복원한 뒤 고칩니다.
            code=resource_version_conflict: If-Match의 version이 지금 version과 다릅니다. 다시 조회한 뒤 고칩니다.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=rate_limit_exceeded: 키의 분당 요청 한도를 넘었습니다. Retry-After\
            \ 헤더의 초만큼 기다린 뒤 다시 보냅니다."
          headers:
            Retry-After:
              description: 다시 보내기 전에 기다릴 시간(초)
              required: true
              schema:
                type: integer
                format: int32
      summary: 버전을 확인한 고객 수정
      tags:
      - customer-controller
    put:
      description: |
        고객 이름과 청구 이메일을 바꾸고 바뀐 고객을 돌려줍니다.
        보낸 값으로 통째로 바꿉니다. billing_email을 빼거나 null로 보내면 청구 이메일이 지워집니다.
        If-Match는 선택입니다. 보내면 version을 확인하고, 빼면 확인 없이 덮어씁니다. 다른 요청이 고친 값을 덮어쓰지 않으려면 If-Match를 보내거나 PATCH /v1/customers/{id}를 씁니다.
      operationId: updateCustomer
      parameters:
      - description: 고칠 고객의 ID.
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "고객을 조회해 받은 version을 큰따옴표로 감싼 값(예: \"3\")입니다. 선택이며, 보내면 지금 version과\
          \ 다를 때 409입니다."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: 바뀐 고객
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: |
