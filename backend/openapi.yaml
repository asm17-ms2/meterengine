      - description: 받지만 내보내기에는 쓰지 않습니다. CSV에는 조건 전체의 행이 들어갑니다.
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - description: 이 고객의 이벤트만 봅니다. 생략하면 모든 고객이 대상입니다.
        in: query
        name: customer_id
        required: false
        schema:
          type: string
          format: uuid
      - description: "조회할 달(yyyy-MM, KST)입니다. 생략하면 이번 달입니다. from, to와 함께 쓸 수 없습니다."
        in: query
        name: month
        required: false
        schema:
          type: string
      - description: 이 유형의 이벤트만 봅니다.
        in: query
        name: type
        required: false
        schema:
          type: string
      - description: "기간 조회의 시작 시각이며 이 시각을 포함합니다. 날짜(yyyy-MM-dd)나 ISO 8601 시각으로 주고\
          , 시간대가 없으면 KST입니다. to와 함께 줘야 하며 month와 같이 쓸 수 없습니다."
        in: query
        name: from
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - description: 기간 조회의 종료 시각이며 이 시각은 포함하지 않습니다. 날짜만 주면 그 날짜의 하루 전체를 포함합니다. 형식은
          from과 같습니다.
        in: query
        name: to
        required: false
        schema:
          type: string
          maxLength: 64
          minLength: 0
      - description: "transaction_id, 고객 이름, 고객 외부 ID에서 이 문자열을 대소문자 구분 없이 부분 검색합니다\
          ."
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 512
          minLength: 0
      - description: "정렬 기준입니다. occurred_at(기본), received_at, transaction_id, customer_name,\
          \ type 가운데 하나입니다."
        in: query
        name: sort
        required: false
        schema:
          type: string
          maxLength: 40
          minLength: 0
      - description: 정렬 방향입니다. desc(기본) 또는 asc입니다.
        in: query
        name: order
        required: false
        schema:
          type: string
          maxLength: 4
          minLength: 0
      - description: "JSON 객체 문자열입니다. properties에 이 객체의 키와 값이 모두 들어 있는 이벤트만 봅니다(예\
          : {\"region\":\"seoul\"})."
        in: query
        name: properties
        required: false
        schema:
          type: string
          maxLength: 4096
          minLength: 0
      - description: true면 원본 properties JSON 열을 더합니다. 기본은 false입니다.
        in: query
        name: include_properties
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
          description: 고른 조건 전체의 이벤트 CSV입니다. 결과가 없어도 같은 열 제목을 돌려줍니다.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "code=validation_error: 조회 조건 값이 틀렸거나 모르는 조회 조건이 있거나, 조건 전체\
            가 10,000행을 넘거나, include_properties=true일 때 원본 properties 합계가 32MB를 넘습니\
            다."
        "401":
          content:
            application/json:
              schema:
