            , 이 값을 저장하기 전에 확정한 항목은 null입니다."
        dimension_values:
          type: object
          additionalProperties: {}
          description: "확정할 때 저장한 구분 값입니다. 이 구분 값의 단가를 수량에 곱했습니다. 미터에 dimension_properties가\
            \ 없었거나 기본료, 최소 사용료 조정 항목이면 빈 객체입니다."
        line_type:
          type: string
          description: "청구 항목 종류입니다. per_unit, volume, graduated_tier는 사용료, base_fee는\
