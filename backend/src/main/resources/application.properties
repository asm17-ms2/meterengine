spring.application.name=meter-engine

# 반대 방향(엔티티로 스키마를 만들거나 고치는 값)으로 바꾸면 usage_event의 append-only 트리거와
# 시드 보증이 무너진다.
spring.jpa.hibernate.ddl-auto=validate

# 노출을 넓히려면 ActuatorExposureIntegrationTest를 같이 고친다.
management.endpoints.web.exposure.include=health,prometheus

# 없으면 Grafana의 지연 패널(deploy/grafana/dashboards)이 조용히 빈 그래프가 된다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 끄면 한 엔드포인트가 400을 두 스키마로 낸다.
spring.mvc.problemdetails.enabled=true

# fixed가 아니면 한 응답에 한국어와 영어가 섞인다.
# FrameworkExceptionHandlerIntegrationTest의 Accept-Language 단언이 지킨다.
spring.web.locale=ko
spring.web.locale-resolver=fixed

# 없으면 Jackson이 소수를 Double로 바인딩해 자릿수가 잘린다.
# EventIngestIntegrationTest의 소수는_자릿수가_잘리지_않고_저장된다가 지킨다.
spring.jackson.deserialization.use-big-decimal-for-floats=true

tosspayments.secret-key=${TOSSPAYMENTS_SECRET_KEY:test_sk_LOCAL_PLACEHOLDER}
