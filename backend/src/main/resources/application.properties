spring.application.name=meter-engine

# 반대 방향(엔티티로 스키마를 만들거나 고치는 값)으로 바꾸면 event 테이블의 append-only 트리거와
# 시드 보증이 무너진다.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

# 인증은 API 키와 세션 토큰만 받는다. 빼면 Boot가 쓰이지 않는 기본 사용자를 만들고 비밀번호를 로그에 남긴다.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# 로그인 세션의 절대 만료. 로그인한 뒤 이만큼 지나면 쓰던 중이어도 다시 로그인해야 한다.
meterengine.session.ttl=12h

# 키를 교체할 때 옛 키를 더 쓸 수 있는 시간. 이만큼 지나면 옛 키는 401이다.
meterengine.api-key.replacement-grace=24h

# 다른 서버에서 바꾼 키(발급, 폐기, 권한 변경)와 도입사 상태는 이 간격 안에 이 서버의 키 테이블에 들어온다.
meterengine.api-key.table-refresh-interval=30s

# 기동할 때 넣는 첫 운영자와 프론트 콘솔 키. 비우면 건너뛴다.
meterengine.bootstrap.operator-email=${OPERATOR_EMAIL:}
meterengine.bootstrap.operator-password=${OPERATOR_PASSWORD:}
meterengine.bootstrap.frontend-api-key=${FRONTEND_API_KEY:}
meterengine.bootstrap.frontend-organization-id=${FRONTEND_ORGANIZATION_ID:}

# 새 서버가 받자마자 느리지 않게 준비 신호 전에 수집 경로를 데운다. 키가 비면 건너뛴다.
# 시간 상한은 컨테이너가 스스로 다시 뜰 때도 ALB 헬스 체크가 서버를 빼기 전에 끝나게 짧게 둔다.
meterengine.ingest-warmup.api-key=${INGEST_WARMUP_API_KEY:}
meterengine.ingest-warmup.organization-id=${INGEST_WARMUP_ORGANIZATION_ID:}
meterengine.ingest-warmup.customer-id=${INGEST_WARMUP_CUSTOMER_ID:}
meterengine.ingest-warmup.requests=${INGEST_WARMUP_REQUESTS:1000}
meterengine.ingest-warmup.time-limit=${INGEST_WARMUP_TIME_LIMIT:20s}

# 이 서버가 맡는 일. all은 전부, ingest는 수집 API, consumer는 카프카를 읽어 저장, api는 관리 API와 예약 작업이다.
# 카프카 컨슈머는 all과 consumer에서만, 예약 작업은 all과 api에서만 돈다.
meterengine.role=${METERENGINE_ROLE:all}
# 수집 API가 받은 이벤트를 보내는 곳. direct는 요청 안에서 DB에 저장하고, kafka는 카프카에 발행한 뒤 202로 답한다.
meterengine.event.write-path=${EVENT_WRITE_PATH:direct}
meterengine.event.kafka.producer-name=${HOSTNAME:unknown}
# 카프카 메시지 하나의 기본 상한 1MB보다 작게 받는다. 배치는 원소 하나가 통째로 차지해도 그 상한을 넘지 않는 크기다.
meterengine.event.body-limit.single=64KB
meterengine.event.body-limit.batch=512KB

# direct에서는 브로커에 연결하지 않는다.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# 브로커 한 대가 죽어도 응답한 이벤트를 잃지 않게, 복제본이 받은 뒤에야 발행을 끝난 것으로 본다.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# 브로커가 답하지 않을 때 요청 스레드가 묶이는 시간의 상한. 순서대로 브로커 주소 대기, 요청 한 번, 재시도를 합친 전체.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
# 컨슈머는 묶음으로 읽어 한 트랜잭션에 넣고, DB 커밋 뒤에 오프셋을 넘긴다. 묶음 크기는 측정하며 맞춘다.
spring.kafka.consumer.group-id=event-ingest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=500
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=batch

# DB가 답 없이 끊기면(장애 전환 등) 커넥션이 끝없이 묶여 앱이 회복하지 못한다(Discussion #389).
# HikariCP 권장: 가장 긴 쿼리의 2에서 3배와 30초 중 긴 쪽.
spring.datasource.hikari.data-source-properties.socketTimeout=30

management.endpoints.web.exposure.include=health,prometheus

# 없으면 Grafana의 지연 패널(deploy/grafana/dashboards)이 조용히 빈 그래프가 된다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections=true
# 여러 SQL을 보내는 집계 조회는 30초를 넘을 수 있어, 기본 상한 30초에 p99가 붙지 않게 올린다.
management.metrics.distribution.maximum-expected-value.http.server.requests=120s
# 경로 틀과 고정 uri를 합치면 기본 한도 100에 닿아 그 뒤 새 API 지표가 버려지므로 올린다.
management.metrics.web.server.max-uri-tags=200
server.tomcat.mbeanregistry.enabled=true

# 토스 호출 p99가 읽기 제한 60초에 다가가는지 보려고 기본 상한 30초보다 크게 둔다.
management.metrics.distribution.percentiles-histogram.meterengine.toss.payments.request=true
management.metrics.distribution.maximum-expected-value.meterengine.toss.payments.request=90s

spring.web.locale=ko
spring.web.locale-resolver=fixed

spring.jackson.deserialization.use-big-decimal-for-floats=true

# 예약 작업마다 스레드가 하나씩 돌도록 @Scheduled 메서드 수 이상으로 둔다. 모자라면 토스 응답이 늦을 때 결제 작업이 스레드를 모두 잡아 웹훅 발송이 밀린다.
spring.task.scheduling.pool.size=6

crypto.encryption-key=${CRYPTO_ENCRYPTION_KEY:}
meterengine.webhook.enabled=${WEBHOOK_ENABLED:true}
meterengine.webhook.allow-private-network=${WEBHOOK_ALLOW_PRIVATE_NETWORK:false}
meterengine.notification.unbilled-usage-cron=${UNBILLED_USAGE_REPORT_CRON:0 0 9 * * *}

# 매시 정각에 확정 시각(다음 달 1일 14:00 KST)이 지난 달을 자동 확정한다. 켜면 첫 정시에 확정 시각이 지난 과거 달이 모두 확정된다.
meterengine.invoice.auto-finalize.enabled=${INVOICE_AUTO_FINALIZE_ENABLED:false}

meterengine.auth-rate-limit.enabled=${METERENGINE_AUTH_RATE_LIMIT_ENABLED:true}
meterengine.auth-rate-limit.login-ip-limit=${METERENGINE_AUTH_RATE_LIMIT_LOGIN_IP_LIMIT:100}
meterengine.auth-rate-limit.login-account-limit=${METERENGINE_AUTH_RATE_LIMIT_LOGIN_ACCOUNT_LIMIT:10}
meterengine.auth-rate-limit.login-window=${METERENGINE_AUTH_RATE_LIMIT_LOGIN_WINDOW:5m}
meterengine.auth-rate-limit.signup-ip-limit=${METERENGINE_AUTH_RATE_LIMIT_SIGNUP_IP_LIMIT:20}
meterengine.auth-rate-limit.signup-account-limit=${METERENGINE_AUTH_RATE_LIMIT_SIGNUP_ACCOUNT_LIMIT:3}
meterengine.auth-rate-limit.signup-window=${METERENGINE_AUTH_RATE_LIMIT_SIGNUP_WINDOW:30m}
meterengine.auth-rate-limit.trusted-proxies=${METERENGINE_AUTH_RATE_LIMIT_TRUSTED_PROXIES:}
meterengine.auth-rate-limit.load-balancers=${METERENGINE_AUTH_RATE_LIMIT_LOAD_BALANCERS:}
