spring.application.name=meter-engine

# 로컬 DB는 spring-boot-docker-compose가 자동 기동한다.
# 실행 위치가 backend/면 backend/compose.yaml(include 심), 레포 루트면 루트 docker-compose.yml을 찾는다.

# 스키마의 정본은 Flyway 마이그레이션이고 엔티티가 그것을 따라간다 (MS2-129).
# validate는 스키마를 건드리지 않고 엔티티와 실제 테이블이 어긋났는지 기동 때 확인만 한다. 컬럼명 오타를
# 첫 쿼리가 아니라 기동 시점에 잡는다. Boot 기본값은 none이라 명시하지 않으면 검사 자체가 없다.
# [주의] 반대 방향(엔티티로 스키마를 만들거나 고치는 값)으로 절대 바꾸지 말 것. usage_event의 append-only
# 트리거와 시드가 Flyway 소관이라, Hibernate가 스키마를 손대면 그 보증이 통째로 무너진다.
spring.jpa.hibernate.ddl-auto=validate

# 프레임워크가 내는 4xx를 우리 도메인 오류와 같은 형식(RFC 9457 problem+json)으로 맞춘다 (MS2-130).
# 우리 핸들러는 이 설정과 무관하게 늘 ProblemDetail을 낸다. 이 스위치는 반대쪽, 즉 검증 실패나
# 헤더 누락 같은 프레임워크 예외를 같은 형식으로 끌어온다. 끄면 한 엔드포인트가 400을 두 스키마로
# 낸다.
#
# [정정 2026-08-17, MS2-150 B-3] 예전 주석은 "덮는 범위는 4xx뿐"이라고 적었으나 사실이 아니다.
# ConversionNotSupportedException, HttpMessageNotWritableException, MethodValidationException 셋은
# 500인데 다른 4xx와 같은 ProblemDetail 경로를 탄다(spring-webmvc 바이트코드 실측). 즉 일부 5xx도
# problem+json으로 나가고 일부는 BasicErrorController의 Boot 기본 형식으로 나가며, 클라이언트는
# 둘을 구분할 방법이 없다.
#
# 그래서 팀 규약은 "5xx의 본문 형식에 의존하지 않는다. FE는 상태 코드만 쓴다"다. FrameworkExceptionHandler
# 도 4xx에만 code를 붙인다. 도입사 잘못으로 저장에 실패하는 경우가 5xx로 새지 않게
# EventExceptionHandler가 4xx로 잡는 것은 그대로다.
#
# [갱신 2026-08-17, MS2-150 A-1] @ConditionalOnMissingBean(ResponseEntityExceptionHandler.class)라,
# 그 타입을 상속한 빈을 만들면 자동 설정이 물러나고 프레임워크 예외 처리를 전부 떠안는다.
# 예전 주석은 그래서 "advice는 상속하지 말 것"이라고 금지했는데, 그것은 사고로 상속했을 때의 경고였다.
# 지금은 FrameworkExceptionHandler가 의도적으로 상속해 그 자리를 대신한다. 20종을 전부 물려받으므로
# 잃는 것이 없고, 상태 코드와 응답 헤더 결정은 프레임워크에 남는다.
# [주의] 그 클래스 외에 또 상속하면 둘 중 하나만 등록되어 조용히 절반이 사라진다.
spring.mvc.problemdetails.enabled=true

# errors[].message의 기본 언어를 못박는다 (MS2-150 6단계, B-2의 대가 2).
#
# 이 값이 없으면 Accept-Language를 안 보낸 요청의 문구가 **JVM 기본 로케일**을 따라간다. 그래서 같은
# 코드가 이 맥북(ko_KR)에서는 한국어로, en_US로 도는 CI나 컨테이너에서는 영어로 답한다. 값이 아니라
# 실행 환경이 계약을 정하는 상태다.
#
# [실측 2026-08-17] 그 갈림이 이미 있었다. MockMvc의 MockHttpServletRequest는 Accept-Language를
# 안 붙이는데, 이 설정 전에는 테스트가 영어("must not be blank")를 받고 같은 머신의 bootRun은
# 한국어("공백일 수 없습니다")를 받았다. 즉 테스트가 검증하던 문구와 도입사가 받던 문구가 서로 달랐다.
#
# [실측으로 뒤집음] 처음에는 accept-header 리졸버를 두고 기본값만 ko로 박았다. Accept-Language를
# 보낸 요청에는 언어 선택권을 주자는 뜻이었는데, 돌려 보니 **반만 번역된 응답**이 나왔다.
# Accept-Language: en이면 Hibernate Validator는 en 번들을 갖고 있어 "must not be blank"로 답하는데,
# 우리 문구(messages.properties)는 ko 하나뿐이라 "필수 항목입니다"가 그대로 나갔다. 한 응답 안에
# 두 언어가 섞인다. messages_en.properties를 더해도 en만 막힐 뿐, Hibernate가 번들을 가진 다른
# 로케일(fr, ja 등)에서 같은 혼합이 다시 난다. 우리가 번역을 따라갈 수 없는 조합이 항상 남는다.
#
# 그래서 리졸버를 fixed로 고정한다. 어떤 Accept-Language가 와도 ko다. 잃는 것은 언어 선택권인데
# 지금 소비자가 전부 국내용(관리자 화면, 데모 CLI, 국내 도입사)이라 쓰는 곳이 없고, 오류 문구가
# 클라이언트마다 달라지면 로그와 지원 문의도 같이 갈린다. 다국어가 필요해지면 그때 번들을 갖춰
# 의도적으로 연다.
#
# title과 detail은 이 설정과 무관하게 영어로 둔다. 화면에 쓰지 않기로 했고(B-2) 로그와 개발자용이라
# 검색 가능한 고정 문자열이 낫다. errors[].message만 도입사가 읽는 자리다.
spring.web.locale=ko
spring.web.locale-resolver=fixed

# JSON 필드명은 전역 SNAKE_CASE 대신 DTO의 @JsonProperty로 못박는다. 전역 설정은 springdoc
# 생성물처럼 우리가 만들지 않은 응답까지 바꾼다.

# properties의 소수를 정밀도 손실 없이 저장한다 (MS2-130).
# 없으면 Jackson이 소수를 Double로 바인딩해 재직렬화 때 자릿수가 잘린다 (실측:
# 0.1234567890123456789 -> 0.12345678901234568). usage_event는 append-only라 되돌릴 수 없고 그
# 값이 청구 근거가 된다. jsonb의 숫자는 numeric이라 자릿수를 그대로 담는다.
spring.jackson.deserialization.use-big-decimal-for-floats=true

# springdoc 설정은 여기 두지 않는다 (MS2-140). 생성물의 키 순서 고정처럼 문서 파일에만 필요한 설정을 여기
# 넣으면 런타임 /scalar의 목록 순서까지 따라 바뀐다. 생성 전용 설정은 build.gradle.kts의 test 태스크가
# 시스템 프로퍼티로 준다.
