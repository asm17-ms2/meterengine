spring.application.name=meter-engine

# 반대 방향(엔티티로 스키마를 만들거나 고치는 값)으로 바꾸면 event 테이블의 append-only 트리거와
# 시드 보증이 무너진다.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,prometheus

# 없으면 Grafana의 지연 패널(deploy/grafana/dashboards)이 조용히 빈 그래프가 된다.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.web.locale=ko
spring.web.locale-resolver=fixed

spring.jackson.deserialization.use-big-decimal-for-floats=true

tosspayments.secret-key=${TOSSPAYMENTS_SECRET_KEY:test_sk_LOCAL_PLACEHOLDER}

payment.billing-key-encryption-key=${BILLING_KEY_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
