spring.application.name=meter-engine

# 로컬 DB는 spring-boot-docker-compose가 자동 기동한다.
# 실행 위치가 backend/면 backend/compose.yaml(include 심), 레포 루트면 루트 docker-compose.yml을 찾는다.

# 스키마는 Flyway 마이그레이션(db/migration)이 정본이다.
# Hibernate는 스키마를 만들지 않고 엔티티-스키마 불일치만 기동 시 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# API JSON 필드명(snake_case, docs/api/openapi.yaml 전체 규약)은 전역 네이밍 전략이 아니라
# DTO의 @JsonProperty로 명시한다. 전역 설정을 쓰지 않는 이유는 ADR 0007 참조.

# MS2-38 임시: 인증 스텁이 API 키 -> 도입사 매핑으로 대체할 때까지 수집이 귀속될 고정 도입사.
# 로컬 확인 시 이 id로 organizations 행을 시드해야 한다 (backend/README.md 참조).
meterengine.ingestion.organization-id=00000000-0000-0000-0000-000000000001
