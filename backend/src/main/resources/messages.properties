# errors[].message 중 우리가 만드는 문구 (MS2-150 6단계, B-2/D-6).
#
# Bean Validation 제약(@NotNull, @NotBlank, @Size, @Min, @Max)의 문구는 여기 없다. Hibernate
# Validator가 로케일별 번들을 들고 있어 ko를 이미 준다("공백일 수 없습니다", "100 이하여야 합니다").
# 그것을 여기서 덮어쓰지 않는 이유는 우리가 쓰는 제약마다 번역을 떠안게 되고, 제약이 늘 때 번역 누락이
# 조용히 영어로 새기 때문이다. 프레임워크가 주는 자리는 프레임워크에 맡긴다.
#
# 여기 있는 둘은 Bean Validation이 만들지 않는 자리다. 헤더 누락과 타입 불일치는 제약 위반이 아니라
# 바인딩 실패라 제약 애노테이션이 없고, 그래서 문구를 우리가 준다. 6단계 전에는 이 둘만 영어로 남아
# 한 응답 안에서 한국어와 영어가 섞였다.
#
# 파일 인코딩은 UTF-8이다. Spring Boot의 spring.messages.encoding 기본값이 UTF-8이라 따로 안 준다.

# 필수 헤더가 없다. MissingRequestHeaderException.
problem.field.required=필수 항목입니다

# 선언한 타입으로 못 바꿨다. {0}은 기대 타입 이름(UUID, YearMonth 등)이다.
# 도입사가 보낸 값은 넣지 않는다 (MS2-150 B-4). 기대 타입은 우리 스키마라 반사가 아니다.
problem.field.type-mismatch={0} 형식이어야 합니다

# 기대 타입을 알 수 없을 때. MethodArgumentTypeMismatchException.getRequiredType()이 null인 경우다.
problem.field.unparseable=형식을 해석할 수 없습니다

# Bean Validation이 문구를 못 준 경우의 최후 기본값. FieldError.getDefaultMessage()가 null일 때만 쓴다.
problem.field.invalid=올바르지 않습니다
