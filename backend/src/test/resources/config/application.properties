spring.profiles.active=test

# 개발용 고정 키(CryptoProperties.TEST_KEY)는 local, test 프로파일에서만 받는다.
crypto.encryption-key=AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
meterengine.scheduling.enabled=false
meterengine.scheduling.enabled=false
meterengine.webhook.allow-private-network=true
meterengine.auth-rate-limit.enabled=false
# 개발자 셸의 예열 환경변수가 시험으로 새지 않게 끈다.
meterengine.ingest-warmup.api-key=

# 시험이 넣은 키를 백그라운드 갱신이 시험 도중에 지우지 않게 길게 둔다. 갱신 동작은 ApiKeyTableLoaderTest가 본다.
meterengine.api-key.table-refresh-interval=1h
