[versions]
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
spotless = "8.9.0"
google-java-format = "1.36.1"
checkstyle = "14.3.0"
springdoc = "3.0.3"
archunit = "1.5.1"
aws-sdk = "2.57.4"

[libraries]
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-sdk-sesv2 = { module = "software.amazon.awssdk:sesv2" }
archunit-junit6 = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
springdoc-openapi-starter-webmvc-scalar = { module = "org.springdoc:springdoc-openapi-starter-webmvc-scalar", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
