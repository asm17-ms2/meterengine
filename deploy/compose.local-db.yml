# MS2-164(RDS)가 끝날 때까지만 쓰는 임시 DB. 배포 경로 전체를 미리 관통시켜 보려고 둔다.
#
# compose는 -f를 여러 번 주면 뒤 파일이 앞 파일 위에 겹쳐진다. 그래서 이 파일은
# compose.prod.yml을 고치지 않고 backend의 DB 주소만 갈아끼운다:
#   docker compose -f compose.prod.yml -f compose.local-db.yml up -d
#
# 붙일지 말지는 deploy.sh가 판단한다. Parameter Store의 db-host가 아직 PLACEHOLDER면 붙이고,
# 실제 RDS 엔드포인트로 바뀌면 자동으로 떨어져 나간다. 즉 RDS가 생긴 뒤에 할 일은
# 파라미터 값을 채우고 재배포하는 것뿐이다.
#
# 치울 때: 이 파일과 deploy.sh의 PLACEHOLDER 분기를 함께 지운다. 볼륨도 같이 지운다
#   (docker volume rm meterengine-prod_local-db-data).

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: meterengine
      POSTGRES_USER: meterengine
      # 임시 DB의 임시 비밀번호다. 포트를 호스트에 열지 않아 compose 네트워크 밖에서는
      # 닿지 않는다. 진짜 비밀번호는 Parameter Store에 SecureString으로 들어간다.
      POSTGRES_PASSWORD: meterengine
    volumes:
      # postgres:18부터 데이터 마운트 지점이 /var/lib/postgresql 이다(하위 data가 아니다).
      - local-db-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1로 TCP를 본다. 유닉스 소켓으로 검사하면 초기화 중 임시 서버를
      # healthy로 잘못 읽는다(루트 docker-compose.yml에 같은 주석이 있다).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U meterengine -d meterengine"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      # compose.prod.yml이 Parameter Store 값으로 만든 주소를 이 세 줄이 덮어쓴다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meterengine
      SPRING_DATASOURCE_USERNAME: meterengine
      SPRING_DATASOURCE_PASSWORD: meterengine
    depends_on:
      postgres:
        # DB가 받을 준비가 된 뒤에 뜬다. 백엔드는 기동 시 Flyway 마이그레이션을 돌리는데,
        # DB가 아직 안 떠 있으면 그대로 죽는다.
        condition: service_healthy

volumes:
  local-db-data:
