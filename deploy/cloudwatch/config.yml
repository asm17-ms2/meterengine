# cloudwatch_exporter 설정. 계정의 모든 RDS 인스턴스와 MeterEngine ALB를 읽는다. env 라벨은 공용 Prometheus가 이름에서 만든다.
# 자격은 EC2 역할이다. 5분 단위로만 나오는 지표(크레딧, EBS 잔량)는 period_seconds가 300이다.

region: ap-northeast-2
period_seconds: 60
delay_seconds: 120
set_timestamp: false
metrics:
  - aws_namespace: AWS/RDS
    aws_metric_name: CPUUtilization
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: DatabaseConnections
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: WriteIOPS
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: ReadIOPS
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  # 디스크 지연은 AWS 권장 경보와 같은 p90으로 받는다.
  - aws_namespace: AWS/RDS
    aws_metric_name: WriteLatency
    aws_dimensions: [DBInstanceIdentifier]
    aws_extended_statistics: [p90]
  - aws_namespace: AWS/RDS
    aws_metric_name: ReadLatency
    aws_dimensions: [DBInstanceIdentifier]
    aws_extended_statistics: [p90]
  - aws_namespace: AWS/RDS
    aws_metric_name: WriteThroughput
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: ReadThroughput
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: DiskQueueDepth
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: EBSIOBalance%
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
    period_seconds: 300
  - aws_namespace: AWS/RDS
    aws_metric_name: EBSByteBalance%
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
    period_seconds: 300
  - aws_namespace: AWS/RDS
    aws_metric_name: CPUCreditBalance
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
    period_seconds: 300
  - aws_namespace: AWS/RDS
    aws_metric_name: FreeableMemory
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: SwapUsage
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  # 남은 공간은 AWS 권장 경보와 같은 최솟값으로 받는다.
  - aws_namespace: AWS/RDS
    aws_metric_name: FreeStorageSpace
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Minimum]
  - aws_namespace: AWS/RDS
    aws_metric_name: MaximumUsedTransactionIDs
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  # Performance Insights가 켜진 인스턴스에서만 나온다.
  - aws_namespace: AWS/RDS
    aws_metric_name: DBLoad
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: TransactionLogsGeneration
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: TransactionLogsDiskUsage
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  - aws_namespace: AWS/RDS
    aws_metric_name: CheckpointLag
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
  # 앱 서버 대상 그룹(back-, front-, ingst-)만 읽는다. Grafana 대상 그룹(graf-)은 대시보드가 쓰지 않아 조회 요금만 는다.
  # 대상 그룹 목록은 10분마다 다시 찾는다. 대상 그룹을 교체하면 새 그룹 지표가 그만큼 늦게 보인다.
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HealthyHostCount
    aws_dimensions: [LoadBalancer, TargetGroup]
    aws_statistics: [Minimum]
    aws_dimension_select_regex: &app_target_groups
      LoadBalancer: ["app/meterengine-.+-alb/.+"]
      TargetGroup: ["targetgroup/(back|front|ingst)-.+"]
    list_metrics_cache_ttl: 600
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: UnHealthyHostCount
    aws_dimensions: [LoadBalancer, TargetGroup]
    aws_statistics: [Maximum]
    aws_dimension_select_regex: *app_target_groups
    list_metrics_cache_ttl: 600
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: RequestCount
    aws_dimensions: [LoadBalancer, TargetGroup]
    aws_statistics: [Sum]
    aws_dimension_select_regex: *app_target_groups
    list_metrics_cache_ttl: 600
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_Target_5XX_Count
    aws_dimensions: [LoadBalancer, TargetGroup]
    aws_statistics: [Sum]
    aws_dimension_select_regex: *app_target_groups
    list_metrics_cache_ttl: 600
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: TargetResponseTime
    aws_dimensions: [LoadBalancer, TargetGroup]
    aws_extended_statistics: [p50, p99]
    aws_dimension_select_regex: *app_target_groups
    list_metrics_cache_ttl: 600
  # ALB가 직접 낸 5xx다. 502는 서버 keep-alive가 ALB보다 먼저 끊겨도 나서 따로 본다.
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_ELB_5XX_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    aws_dimension_select_regex: &meterengine_albs
      LoadBalancer: ["app/meterengine-.+-alb/.+"]
    list_metrics_cache_ttl: 600
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_ELB_502_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]
    aws_dimension_select_regex: *meterengine_albs
    list_metrics_cache_ttl: 600
