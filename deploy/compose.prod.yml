# 운영 스택. 로컬용인 루트 docker-compose.yml과 다른 파일이고, DB가 RDS라 postgres 서비스가 없다.
# 손으로 부를 때는 --env-file이 반드시 필요하다:
#   docker compose --env-file /etc/meterengine/prod.env -f compose.prod.yml up -d

name: meterengine-prod

# EBS가 20GB뿐이라 컨테이너당 30MB로 묶는다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 파일이 아니라 디렉터리를 마운트한다. 파일 단위 bind mount는 inode에 묶이는데 git checkout은
      # 파일을 새로 써서 갈아끼우므로, 배포해도 Caddyfile 변경이 반영되지 않는다.
      - ./caddy:/etc/caddy:ro
      # 지우면 인증서를 새로 발급받는데 Let's Encrypt는 같은 도메인에 주 5회 제한이 있다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    logging: *default-logging

  backend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 없다}/meterengine-backend:${IMAGE_TAG:?IMAGE_TAG가 없다}
    restart: unless-stopped
    environment:
      # 이미지에 datasource 설정이 없어서, 운영에서 DB에 붙는 유일한 경로가 이 변수들이다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?DB_HOST가 없다}:${DB_PORT:?DB_PORT가 없다}/${DB_NAME:?DB_NAME이 없다}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME이 없다}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없다}
      TOSSPAYMENTS_SECRET_KEY: ${TOSSPAYMENTS_SECRET_KEY:?TOSSPAYMENTS_SECRET_KEY가 없다}
    ports:
      # 컨테이너에 healthcheck를 넣지 않은 이유: 실행 이미지가 JRE만 담고 있어 curl도 wget도 없다.
      - "127.0.0.1:8080:8080"
    logging: *default-logging

  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 없다}/meterengine-frontend:${IMAGE_TAG:?IMAGE_TAG가 없다}
    restart: unless-stopped
    environment:
      # 프론트는 브라우저가 아니라 자기 서버에서 백엔드를 부른다(서버 컴포넌트).
      METERENGINE_API_BASE_URL: http://backend:8080
      METERENGINE_ORGANIZATION_ID: ${ORGANIZATION_ID:?ORGANIZATION_ID가 없다}
      METERENGINE_ORGANIZATION_NAME: ${ORGANIZATION_NAME:?ORGANIZATION_NAME이 없다}
    ports:
      - "127.0.0.1:3000:3000"
    logging: *default-logging

  # 모니터링 컨테이너는 서비스 트래픽을 받지 않고, 죽어도 서비스는 돈다. 접근법은 deploy/README.md.

  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    # command를 주면 이미지의 기본 인자가 통째로 사라져서 config 경로도 같이 줘야 한다.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    logging: *default-logging

  # /proc과 /sys 마운트만으로 호스트 값이 나온다. 호스트 네트워크 모드는 쓰지 않는다.
  node-exporter:
    image: prom/node-exporter:v1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD가 없다}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # provisioning 파일(grafana/provisioning/alerting)이 이 변수를 읽는다.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?SLACK_WEBHOOK_URL이 없다}
    ports:
      # 3000은 frontend가 쓰고 있어 3001이다. SSM 포트 포워딩이 인스턴스의 localhost로 들어온다.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
