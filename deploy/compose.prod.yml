name: meterengine-prod

# 디스크가 작아 컨테이너 로그 크기를 묶는다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 프론트만 고정 주소 대역(172.30.0.8/29) 안의 주소를 받아 백엔드가 그 대역에서 온 사용자 IP 헤더만 믿는다. 나머지는 ip_range에서 받는다.
networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

# 서버마다 백엔드와 프론트 하나씩이다. ALB가 두 포트로 바로 보내고, 보안 그룹이 ALB와 공용 모니터링 서버만 들인다.
# 프로필이 없으면 앱만 뜬다. agents는 공용 모니터링 서버가 긁는 서버별 수집 대상이다. 켤지는 deploy/environments가 정한다.
services:
  backend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 없다}/${IMAGE_REPOSITORY_PREFIX:?IMAGE_REPOSITORY_PREFIX가 없다}-backend:${IMAGE_TAG:?IMAGE_TAG가 없다}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?DB_HOST가 없다}:${DB_PORT:?DB_PORT가 없다}/${DB_NAME:?DB_NAME이 없다}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME이 없다}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없다}
      # 값을 바꾸면 이미 저장한 암호문을 풀지 못한다.
      CRYPTO_ENCRYPTION_KEY: ${CRYPTO_ENCRYPTION_KEY:?CRYPTO_ENCRYPTION_KEY가 없다}
      METERENGINE_AUTH_RATE_LIMIT_ENABLED: ${METERENGINE_AUTH_RATE_LIMIT_ENABLED:-true}
      METERENGINE_AUTH_RATE_LIMIT_LOGIN_IP_LIMIT: ${METERENGINE_AUTH_RATE_LIMIT_LOGIN_IP_LIMIT:-100}
      METERENGINE_AUTH_RATE_LIMIT_LOGIN_ACCOUNT_LIMIT: ${METERENGINE_AUTH_RATE_LIMIT_LOGIN_ACCOUNT_LIMIT:-10}
      METERENGINE_AUTH_RATE_LIMIT_LOGIN_WINDOW: ${METERENGINE_AUTH_RATE_LIMIT_LOGIN_WINDOW:-5m}
      METERENGINE_AUTH_RATE_LIMIT_SIGNUP_IP_LIMIT: ${METERENGINE_AUTH_RATE_LIMIT_SIGNUP_IP_LIMIT:-20}
      METERENGINE_AUTH_RATE_LIMIT_SIGNUP_ACCOUNT_LIMIT: ${METERENGINE_AUTH_RATE_LIMIT_SIGNUP_ACCOUNT_LIMIT:-3}
      METERENGINE_AUTH_RATE_LIMIT_SIGNUP_WINDOW: ${METERENGINE_AUTH_RATE_LIMIT_SIGNUP_WINDOW:-30m}
      METERENGINE_AUTH_RATE_LIMIT_TRUSTED_PROXIES: ${METERENGINE_AUTH_RATE_LIMIT_TRUSTED_PROXIES:-172.30.0.8/29}
      METERENGINE_AUTH_RATE_LIMIT_LOAD_BALANCERS: ${METERENGINE_AUTH_RATE_LIMIT_LOAD_BALANCERS:-10.0.0.0/20,10.0.16.0/20}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:?OPERATOR_EMAIL이 없다}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?OPERATOR_PASSWORD가 없다}
      # SSM에 invoice-auto-finalize-enabled가 없으면 자동 확정은 꺼진 채로 뜬다.
      INVOICE_AUTO_FINALIZE_ENABLED: ${INVOICE_AUTO_FINALIZE_ENABLED:-false}
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-true}
      # 키가 없으면 백엔드가 예열을 건너뛴다.
      INGEST_WARMUP_API_KEY: ${INGEST_WARMUP_API_KEY:-}
      INGEST_WARMUP_ORGANIZATION_ID: ${INGEST_WARMUP_ORGANIZATION_ID:-}
      INGEST_WARMUP_CUSTOMER_ID: ${INGEST_WARMUP_CUSTOMER_ID:-}
      INGEST_WARMUP_REQUESTS: ${INGEST_WARMUP_REQUESTS:-1000}
      INGEST_WARMUP_TIME_LIMIT: ${INGEST_WARMUP_TIME_LIMIT:-20s}
      # 메모리 한도가 1792MB보다 작으면 JVM이 SerialGC를 고르므로, 한도가 없던 때와 같은 G1을 지정한다.
      JAVA_TOOL_OPTIONS: -XX:+UseG1GC -XX:MaxRAMPercentage=${BACKEND_MAX_RAM_PERCENTAGE:?BACKEND_MAX_RAM_PERCENTAGE가 없다}
      # ALB idle(130초)보다 길어야 ALB가 재사용하려던 연결을 서버가 먼저 닫아 생기는 502가 없다.
      SERVER_TOMCAT_KEEPALIVETIMEOUT: 140s
    mem_limit: ${BACKEND_MEM_LIMIT:?BACKEND_MEM_LIMIT가 없다}
    # Spring의 종료 단계 한도(30s)보다 길어야 처리 중 요청을 마치기 전에 SIGKILL되지 않는다.
    stop_grace_period: 35s
    # 실행 이미지에 curl과 wget이 없어 healthcheck를 두지 않는다. ALB와 deploy.sh가 컨테이너 밖에서 본다.
    ports:
      - "8080:8080"
    networks:
      - proxy
    logging: *default-logging

  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 없다}/${IMAGE_REPOSITORY_PREFIX:?IMAGE_REPOSITORY_PREFIX가 없다}-frontend:${IMAGE_TAG:?IMAGE_TAG가 없다}
    restart: unless-stopped
    environment:
      # 브라우저가 아니라 프론트 서버가 같은 서버의 백엔드를 부른다.
      METERENGINE_API_BASE_URL: http://backend:8080
      # 공개 인보이스 조회는 이 origin에서 온 요청만 받는다. 별칭은 ALB가 SITE_DOMAIN으로 리다이렉트한다.
      METERENGINE_PUBLIC_ORIGIN: https://${SITE_DOMAIN:?SITE_DOMAIN이 없다}
      # Node 기본 5초는 ALB idle(130초)보다 짧아, ALB가 닫힌 연결을 재사용하면 502가 난다.
      KEEP_ALIVE_TIMEOUT: "140000"
    ports:
      - "3000:3000"
    networks:
      proxy:
        ipv4_address: 172.30.0.11
    logging: *default-logging

  node-exporter:
    profiles: [agents]
    image: prom/node-exporter:v1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    # 공용 모니터링 서버가 서버 밖에서 긁는다. 보안 그룹이 그 서버만 들인다.
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    logging: *default-logging

  # 컨테이너별 CPU와 메모리, 서버 전체 네트워크를 낸다. 공용 모니터링 서버가 9101로 긁는다.
  cadvisor:
    profiles: [agents]
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    # 호스트 8080은 백엔드가 쓴다.
    ports:
      - "9101:8080"
    command:
      - --docker_only=true
      # 기본 1초는 CPU를 더 쓰므로 수집 주기에 맞춘다.
      - --housekeeping_interval=15s
      - --enable_metrics=cpu,memory,network
      # compose가 붙이는 도커 라벨을 지표 라벨로 옮기지 않는다. 컨테이너는 name 라벨로 충분히 가른다.
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m
    logging: *default-logging
