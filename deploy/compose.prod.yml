# 운영 스택. EC2 한 대에서 이 세 컨테이너가 돈다.
#
# 로컬 개발용인 루트 docker-compose.yml과는 다른 파일이다. 저쪽은 postgres 하나뿐이고,
# 이쪽은 DB가 RDS라 postgres 서비스가 없다(MS2-164 대기 중에는 compose.local-db.yml로 임시 대체).
#
# 실행은 배포 스크립트(deploy.sh)가 한다. 손으로 부를 때도 --env-file이 반드시 필요하다:
#   docker compose --env-file /etc/meterengine/prod.env -f compose.prod.yml up -d

# 로컬 스택(name: meterengine)과 프로젝트를 분리한다. 같은 이름이면 컨테이너와 볼륨이 섞인다.
name: meterengine-prod

# 컨테이너 로그 기본값은 무제한 증가다. EBS가 20GB뿐이라 컨테이너당 30MB로 묶는다.
# YAML 앵커는 참조하는 곳보다 위에 있어야 해서 services 앞에 둔다.
# 서버에 붙어 로그를 보려면: docker compose -p meterengine-prod logs -f backend
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 인터넷에 노출되는 유일한 컨테이너.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 파일 하나가 아니라 디렉터리를 마운트한다. 파일 단위 bind mount는 그 파일의 inode에
      # 묶이는데, git checkout은 파일을 제자리에서 고치지 않고 새로 써서 갈아끼운다. 그러면
      # 컨테이너는 사라진 옛 inode를 계속 보게 되어, 배포해도 Caddyfile 변경이 반영되지 않는다
      # (MS2-166에서 www를 더할 때 실제로 겪었다). 디렉터리 마운트는 이름으로 매번 찾으므로
      # 교체된 파일이 그대로 보인다.
      - ./caddy:/etc/caddy:ro
      # 발급받은 인증서가 여기 저장된다. 이 볼륨을 지우면 재배포 때 새로 발급을 시도하는데,
      # Let's Encrypt는 같은 도메인에 주 5회 제한이 있어 반복하면 발급이 막힌다.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    logging: *default-logging

  backend:
    # 태그는 배포하는 커밋의 git SHA다. latest를 쓰지 않는 이유는 지금 서버에서 도는 것이
    # 정확히 어느 커밋인지 태그만 보고 알 수 있어야 롤백이 가능하기 때문이다.
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 없다}/meterengine-backend:${IMAGE_TAG:?IMAGE_TAG가 없다}
    restart: unless-stopped
    environment:
      # 이미지에는 datasource 설정이 없다(application.properties에 한 줄도 없음).
      # 로컬은 spring-boot-docker-compose가 만들어 주지만 그건 developmentOnly라 jar에 없다.
      # 즉 운영에서 DB에 붙는 유일한 경로가 이 세 변수다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?DB_HOST가 없다}:${DB_PORT:?DB_PORT가 없다}/${DB_NAME:?DB_NAME이 없다}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME이 없다}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 없다}
    ports:
      # 127.0.0.1에만 묶는다. 배포 스크립트가 서버 안에서 헬스체크를 부르기 위한 통로이고,
      # 인터넷에서는 닿지 않는다(보안 그룹도 80/443만 열려 있어 이중으로 막힌다).
      # 컨테이너 안에 healthcheck를 넣지 않은 이유: 실행 이미지가 JRE만 담고 있어
      # curl도 wget도 없다. 헬스체크 하나 때문에 이미지에 패키지를 더하지 않는다.
      - "127.0.0.1:8080:8080"
    logging: *default-logging

  frontend:
    image: ${ECR_REGISTRY:?ECR_REGISTRY가 없다}/meterengine-frontend:${IMAGE_TAG:?IMAGE_TAG가 없다}
    restart: unless-stopped
    environment:
      # 프론트는 브라우저가 아니라 자기 서버에서 백엔드를 부른다(서버 컴포넌트).
      # 그래서 공개 도메인이 아니라 compose 네트워크 안의 서비스 이름으로 간다.
      METERENGINE_API_BASE_URL: http://backend:8080
      # 이 두 개는 값이 없어도 lib/config.ts의 기본값으로 조용히 넘어간다. 그러면 운영 화면이
      # 아무 오류 없이 엉뚱한 도입사를 보여줄 수 있어, :? 로 없으면 아예 뜨지 않게 막는다.
      METERENGINE_ORGANIZATION_ID: ${ORGANIZATION_ID:?ORGANIZATION_ID가 없다}
      METERENGINE_ORGANIZATION_NAME: ${ORGANIZATION_NAME:?ORGANIZATION_NAME이 없다}
    ports:
      - "127.0.0.1:3000:3000"
    logging: *default-logging

volumes:
  caddy-data:
  caddy-config:
