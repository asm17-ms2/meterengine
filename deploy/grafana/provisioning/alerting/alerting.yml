# 경보 규칙과 Slack 연동. 임계값의 근거는 각 규칙의 주석에 있다.
# 값은 운영하면서 조정하는 것을 전제로 한 시작값이다. 조정하면 이 파일을 고쳐 배포한다.
#
# 발화 테스트: 임계값을 일부러 낮춰 배포해 Slack 수신을 확인하고 원복한다.
# 한 번도 울려 보지 않은 경보는 없는 것과 같다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-webhook
        type: slack
        settings:
          # Grafana가 기동 때 환경변수로 치환한다. 값은 Parameter Store
          # /meterengine/prod/slack-webhook-url 에서 온다 (deploy.sh -> compose environment).
          url: $SLACK_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: slack
    group_by: ["alertname"]
    # 같은 경보의 재알림은 4시간에 한 번. 계속 울리면 아무도 안 보게 된다.
    repeat_interval: 4h

groups:
  - orgId: 1
    name: meterengine
    folder: MeterEngine
    interval: 1m
    rules:
      # 헬스체크 실패. Prometheus가 백엔드 scrape에 실패하면 up이 0이 된다.
      # 프로세스 다운, 포트 불통, 응답 불능을 전부 잡는다. 멈춘 색은 늘 0이라 대상 중 최댓값을 본다.
      # 블루그린 배포는 배포 중에도 한 색이 응답하므로 1분이면 정상 배포로는 울리지 않는다.
      - uid: backend-down
        title: 백엔드 헬스체크 실패
        condition: C
        for: 1m
        # Prometheus 자체가 죽어 평가할 데이터가 없어도 문제 상황이므로 경보로 취급한다.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 어느 백엔드 색도 1분 넘게 scrape에 응답하지 않는다. meterengine.com API가 죽었을 가능성이 높다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(up{job="backend"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 두 색이 함께 뜨는 것은 배포 중 잠깐뿐이라, 오래 이어지면 배포가 옛 색을 멈추기 전에 중단된 것이다.
      # 데이터 없음과 조회 실패는 Prometheus 쪽 문제라 헬스체크 실패 경보가 잡는다.
      # 여기서 울리면 한쪽 색을 멈추라고 잘못 안내하므로 둘 다 Alerting으로 두지 않는다.
      - uid: backend-both-colors-up
        title: 백엔드 두 색이 함께 떠 있음
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 블루와 그린이 15분 넘게 함께 떠 있다. 배포가 옛 색을 멈추기 전에 중단됐을 수 있으니 deploy.sh 로그를 보고 한쪽을 멈춘다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(up{job="backend"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      # 5xx율 5% 초과가 5분 지속. outcome은 Micrometer가 상태 코드에서 만들어 주는 라벨이다.
      # /actuator는 제외한다. Prometheus scrape가 항상 성공하는 요청을 분당 4건 깔아서,
      # 트래픽이 적을 때 실제 오류율을 임계값 아래로 희석시킨다.
      # 트래픽이 0이면 0/0 = NaN이라 NoData가 되는데, 요청이 없는 것은 장애가 아니므로 OK로 둔다.
      - uid: high-5xx-rate
        title: 5xx 응답 비율 초과
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: 최근 5분 요청의 5% 넘게 5xx로 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR",uri!~"/actuator.*"}[5m])) / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # CPU 5분 평균 80% 초과가 10분 지속. t4g.medium 2vCPU 기준으로, 짧은 스파이크(배포,
      # 마이그레이션)는 넘기고 지속 포화만 잡는 값이다.
      - uid: high-cpu
        title: CPU 사용률 초과
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: EC2 CPU가 10분 넘게 80%를 웃돌고 있다. 처리량 한계이거나 폭주하는 프로세스가 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # 예약 작업 경보는 결제와 웹훅, 청구 제외 통보 작업만 본다. 인보이스 쪽 작업은 따로 경보한다.
      # 인스턴스가 둘이어도 맞게 카운터는 sum, 마지막 성공 시각은 max로 묶는다.

      # 실행이 예외로 끝났거나, 실행은 끝났지만 일부 대상이 실패했다.
      # 카운터가 첫 실패 때 값 1로 처음 생기면 increase()가 0으로 보므로, 15분 안에 새로 생긴 시계열도 실패로 센다.
      - uid: scheduled-job-failed
        title: 예약 작업 실패
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 예약 작업 {{ $labels.job_name }} 이 최근 15분 안에 실패했다. scheduled_job_run의 error_summary와 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (job_name) (meterengine_scheduled_job_run_total{result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}
                unless meterengine_scheduled_job_run_total{result="failed"} offset 15m) > 0)
                or (sum by (job_name) (increase(meterengine_scheduled_job_run_total{result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}[15m])) > 0)
                or (sum by (job_name) (meterengine_scheduled_job_items_total{result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}
                unless meterengine_scheduled_job_items_total{result="failed"} offset 15m) > 0)
                or (sum by (job_name) (increase(meterengine_scheduled_job_items_total{result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}[15m])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 마지막 성공 뒤 경과 시간. 성공한 적 없이 지금 프로세스에서 실행만 된 작업은 백엔드 기동 뒤 경과 시간으로 본다.
      # 30초, 1분 주기 작업은 5분 동안 성공이 없으면 울린다.
      - uid: scheduled-job-missed-minute
        title: 예약 작업 미실행 (1분 이하 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 예약 작업 {{ $labels.job_name }} 이 5분 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (job_name) (meterengine_scheduled_job_last_success_seconds{job_name=~"payment_attempt_confirmation|webhook_delivery"}))
                or on (job_name) (count by (job_name) (meterengine_scheduled_job_run_total{job_name=~"payment_attempt_confirmation|webhook_delivery"}) * 0
                + scalar(time() - max(process_start_time_seconds{job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }

      # 10분 주기 재시도 작업은 세 번 연속 성공이 없으면 울린다.
      - uid: scheduled-job-missed-ten-minute
        title: 예약 작업 미실행 (10분 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 예약 작업 {{ $labels.job_name }} 이 30분 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (job_name) (meterengine_scheduled_job_last_success_seconds{job_name="payment_retry"}))
                or on (job_name) (count by (job_name) (meterengine_scheduled_job_run_total{job_name="payment_retry"}) * 0
                + scalar(time() - max(process_start_time_seconds{job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1800] }

      # 하루 한 번 도는 작업은 정해진 시각에서 1시간이 지나도록 그날 성공이 없으면 울린다.
      - uid: scheduled-job-missed-day
        title: 예약 작업 미실행 (하루 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 예약 작업 {{ $labels.job_name }} 이 25시간 넘게 성공하지 않았다. 오늘 실행이 빠졌거나 실패했다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (job_name) (meterengine_scheduled_job_last_success_seconds{job_name=~"payment_reconciliation|unbilled_usage_report"}))
                or on (job_name) (count by (job_name) (meterengine_scheduled_job_run_total{job_name=~"payment_reconciliation|unbilled_usage_report"}) * 0
                + scalar(time() - max(process_start_time_seconds{job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90000] }

      # 결제 경보는 테스트 모드도 본다. 테스트 결제에서도 울려야 경보가 살아 있는지 알 수 있다. mode 라벨로 구분한다.

      # 결과를 모르는 결제가 확정 작업으로도 풀리지 않고 10분 넘게 남았다. 고객이 돈을 냈는지 모르는 상태다.
      - uid: payment-stale-pending
        title: 결제 결과 모름 미해결
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 결과를 모르는 결제가 10분 넘게 남아 있다. 토스페이먼츠 조회가 실패하고 있는지 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (mode) (meterengine_payment_stale_pending)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 재시도 상한까지 실패해 더는 자동으로 청구하지 않는 인보이스가 생겼다. 사람이 고객에게 연락해야 한다.
      # 예약 작업 실패와 같은 이유로 1시간 안에 새로 생긴 시계열도 센다.
      - uid: payment-retry-exhausted
        title: 결제 재시도 소진
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 재시도 상한까지 결제가 실패한 인보이스가 최근 1시간 안에 생겼다 (mode {{ $labels.mode }}).
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (mode) (meterengine_payment_retry_exhausted_total unless meterengine_payment_retry_exhausted_total offset 1h) > 0)
                or (sum by (mode) (increase(meterengine_payment_retry_exhausted_total[1h])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 매일 대사에서 우리 결제 기록과 토스페이먼츠 거래가 어긋났다.
      # 예약 작업 실패와 같은 이유로 1시간 안에 새로 생긴 시계열도 센다.
      - uid: payment-reconciliation-mismatch
        title: 결제 대사 불일치
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 결제 대사에서 불일치가 나왔다 (mode {{ $labels.mode }}). GET /v1/payment-reconciliation-mismatches 로 내용을 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (mode) (meterengine_payment_reconciliation_mismatch_total unless meterengine_payment_reconciliation_mismatch_total offset 1h) > 0)
                or (sum by (mode) (increase(meterengine_payment_reconciliation_mismatch_total[1h])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 실패로 끝나 더는 보내지 않는 웹훅이 생겼다(재시도 상한, 선점 만료, 막힌 주소). 도입사가 이벤트를 받지 못했다.
      # 예약 작업 실패와 같은 이유로 15분 안에 새로 생긴 시계열도 센다.
      - uid: webhook-delivery-failed
        title: 웹훅 전송 실패
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 실패로 끝난 웹훅이 최근 15분 안에 생겼다. 전송 기록 조회 API로 엔드포인트와 실패 이유를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum (meterengine_webhook_delivery_total{result="failed",reason!="endpoint_disabled"} unless meterengine_webhook_delivery_total{result="failed"} offset 15m) > 0)
                or (sum (increase(meterengine_webhook_delivery_total{result="failed",reason!="endpoint_disabled"}[15m])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 보낼 때가 지난 웹훅이 10분 넘게 밀렸다. 실패가 없어도 발송이 처리량을 따라가지 못하면 도입사 통보가 늦는다.
      - uid: webhook-delivery-backlog
        title: 웹훅 발송 적체
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 보낼 때가 지난 웹훅이 10분 넘게 밀려 있다. 응답이 느린 수신 주소가 발송 시간을 쓰고 있는지 전송 기록 조회 API와 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(meterengine_webhook_delivery_backlog_age_seconds)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [600] }
