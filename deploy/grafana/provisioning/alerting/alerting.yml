# 경보 규칙과 Slack 연동. 임계값은 운영하며 조정하는 시작값이다.
# 발화 테스트: 임계값을 일부러 낮춰 배포해 Slack 수신을 확인하고 원복한다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-webhook
        type: slack
        settings:
          # Grafana가 기동 때 환경변수로 치환한다. 값은 Parameter Store
          # 환경의 Parameter Store 경로 아래 slack-webhook-url 에서 온다 (deploy.sh나 공용 서버의 monitoring/start.sh -> compose environment).
          url: $SLACK_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: slack
    group_by: ["alertname"]
    # 같은 경보의 재알림은 4시간에 한 번. 계속 울리면 아무도 안 보게 된다.
    repeat_interval: 4h

# 블루그린 시절의 두 색 경보다. 이제 서버가 여러 대인 것이 정상이라 이미 만들어진 규칙도 지운다.
deleteRules:
  - orgId: 1
    uid: backend-both-colors-up

groups:
  - orgId: 1
    name: meterengine
    folder: MeterEngine
    interval: 1m
    # 공용 Prometheus는 측정 환경(test-로 시작)도 긁어 모든 선택자에서 빼고 env별로 울린다.
    # 포함 필터를 쓰면 env 라벨이 없는 서버 안 Prometheus에서 경보가 모두 꺼진다.
    rules:
      # 프로세스 다운, 포트 불통, 응답 불능을 잡는다. 환경마다 백엔드 서버 중 최댓값을 봐서 한 대라도 응답하면 울리지 않는다.
      # 롤링은 새 서버가 healthy가 된 뒤 옛 서버를 빼므로 정상 배포로는 울리지 않는다.
      - uid: backend-down
        title: 백엔드 헬스체크 실패
        condition: C
        for: 1m
        # Prometheus 자체가 죽어 평가할 데이터가 없어도 문제 상황이므로 경보로 취급한다.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}에서 백엔드 서버가 하나도 1분 넘게 scrape에 응답하지 않는다. 그 환경의 API가 죽었을 가능성이 높다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env) (up{env!~"test-.*", job="backend"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 서버 찾기는 실행 중인 앱 서버만 보여, 서버가 0대면 up 계열이 사라져 위 경보가 울리지 않는다. 그래서 환경마다 0을 깔고 센다.
      # 찾은 서버를 세므로 서버는 있는데 백엔드가 죽은 경우는 위 경보가 맡는다.
      - uid: app-fleet-empty
        title: 앱 서버 없음
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}에서 공용 모니터링이 찾은 앱 서버가 1분 넘게 0대다. 오토스케일링 그룹의 최소 대수와 활동 기록을 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                count by (env) (up{env!~"test-.*", job="backend"})
                or label_replace(vector(0), "env", "staging", "", "")
                or label_replace(vector(0), "env", "production", "", "")
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 5xx율 5% 초과가 5분 지속. outcome은 Micrometer가 상태 코드에서 만들어 주는 라벨이다.
      # /actuator는 제외한다. Prometheus scrape가 항상 성공하는 요청을 분당 4건 깔아서,
      # 트래픽이 적을 때 실제 오류율을 임계값 아래로 희석시킨다.
      # 트래픽이 0이면 0/0 = NaN이라 NoData가 되는데, 요청이 없는 것은 장애가 아니므로 OK로 둔다.
      - uid: high-5xx-rate
        title: 5xx 응답 비율 초과
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}에서 최근 5분 요청의 5% 넘게 5xx로 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (env) (rate(http_server_requests_seconds_count{env!~"test-.*", outcome="SERVER_ERROR",uri!~"/actuator.*"}[5m])) / sum by (env) (rate(http_server_requests_seconds_count{env!~"test-.*", uri!~"/actuator.*"}[5m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # 서버마다 CPU 5분 평균 80% 초과가 10분 지속. t4g.medium 2vCPU 기준으로, 짧은 스파이크(배포,
      # 마이그레이션)는 넘기고 지속 포화만 잡는 값이다.
      - uid: high-cpu
        title: CPU 사용률 초과
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}의 서버 {{ $labels.instance }} CPU가 10분 넘게 80%를 웃돌고 있다. 처리량 한계이거나 폭주하는 프로세스가 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (1 - avg by (env, instance) (rate(node_cpu_seconds_total{env!~"test-.*", mode="idle"}[5m])))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # 예약 작업 경보는 결제와 웹훅, 청구 제외 통보 작업만 본다. 인보이스 쪽 작업은 따로 경보한다.
      # 인스턴스가 둘이어도 맞게 카운터는 sum, 마지막 성공 시각은 max로 묶는다.

      # 실행이 예외로 끝났거나, 실행은 끝났지만 일부 대상이 실패했다.
      # 카운터가 첫 실패 때 값 1로 처음 생기면 increase()가 0으로 보므로, 15분 안에 새로 생긴 시계열도 실패로 센다.
      - uid: scheduled-job-failed
        title: 예약 작업 실패
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 최근 15분 안에 실패했다. scheduled_job_run의 error_summary와 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}
                unless meterengine_scheduled_job_run_total{env!~"test-.*", result="failed"} offset 15m) > 0)
                or (sum by (env, job_name) (increase(meterengine_scheduled_job_run_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}[15m])) > 0)
                or (sum by (env, job_name) (meterengine_scheduled_job_items_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}
                unless meterengine_scheduled_job_items_total{env!~"test-.*", result="failed"} offset 15m) > 0)
                or (sum by (env, job_name) (increase(meterengine_scheduled_job_items_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}[15m])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 마지막 성공 뒤 경과 시간. 성공한 적 없이 지금 프로세스에서 실행만 된 작업은 백엔드 기동 뒤 경과 시간으로 본다.
      # 30초, 1분 주기 작업은 5분 동안 성공이 없으면 울린다.
      - uid: scheduled-job-missed-minute
        title: 예약 작업 미실행 (1분 이하 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 5분 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name=~"payment_attempt_confirmation|webhook_delivery"}))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name=~"payment_attempt_confirmation|webhook_delivery"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }

      # 10분 주기 재시도 작업은 세 번 연속 성공이 없으면 울린다.
      - uid: scheduled-job-missed-ten-minute
        title: 예약 작업 미실행 (10분 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 30분 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name="payment_retry"}))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name="payment_retry"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1800] }

      # 인보이스 자동 확정은 매시 정각에 돌아 마지막 성공이 끝난 뒤 2시간 안에 다음 성공이 없으면 울린다. 꺼져 있어 한 번도 돌지 않았으면 시계열이 없어 울리지 않는다.
      - uid: invoice-auto-finalize-missed
        title: 인보이스 자동 확정 미실행
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 2시간 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name="invoice_auto_finalize"}))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name="invoice_auto_finalize"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [7200] }

      # 하루 한 번 도는 작업은 정해진 시각에서 1시간이 지나도록 그날 성공이 없으면 울린다.
      # 슬롯을 이긴 색이 배포로 멈춰 그 시리즈가 사라져도 26시간 안의 가장 최근 성공을 본다.
      - uid: scheduled-job-missed-day
        title: 예약 작업 미실행 (하루 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 25시간 넘게 성공하지 않았다. 오늘 실행이 빠졌거나 실패했다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (max_over_time(meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name=~"payment_reconciliation|unbilled_usage_report"}[26h])))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name=~"payment_reconciliation|unbilled_usage_report"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90000] }

      # 결제 경보는 테스트 모드도 본다. 테스트 결제에서도 울려야 경보가 살아 있는지 알 수 있다. mode 라벨로 구분한다.

      # 결과를 모르는 결제가 확정 작업으로도 풀리지 않고 10분 넘게 남았다. 고객이 돈을 냈는지 모르는 상태다.
      - uid: payment-stale-pending
        title: 결제 결과 모름 미해결
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 결과를 모르는 결제가 10분 넘게 남아 있다. 토스페이먼츠 조회가 실패하고 있는지 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env, mode) (meterengine_payment_stale_pending{env!~"test-.*", mode="live"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 재시도 상한까지 실패해 더는 자동으로 청구하지 않는 인보이스가 생겼다. 사람이 고객에게 연락해야 한다.
      # 예약 작업 실패와 같은 이유로 1시간 안에 새로 생긴 시계열도 센다.
      - uid: payment-retry-exhausted
        title: 결제 재시도 소진
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 재시도 상한까지 결제가 실패한 인보이스가 최근 1시간 안에 생겼다 (env {{ $labels.env }}, mode {{ $labels.mode }}).
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env, mode) (meterengine_payment_retry_exhausted_total{env!~"test-.*", mode="live"} unless meterengine_payment_retry_exhausted_total{env!~"test-.*", mode="live"} offset 1h) > 0)
                or (sum by (env, mode) (increase(meterengine_payment_retry_exhausted_total{env!~"test-.*", mode="live"}[1h])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 매일 대사에서 우리 결제 기록과 토스페이먼츠 거래가 어긋났다.
      # 예약 작업 실패와 같은 이유로 1시간 안에 새로 생긴 시계열도 센다.
      - uid: payment-reconciliation-mismatch
        title: 결제 대사 불일치
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 결제 대사에서 불일치가 나왔다 (env {{ $labels.env }}, mode {{ $labels.mode }}). GET /v1/payment-reconciliation-mismatches 로 내용을 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env, mode) (meterengine_payment_reconciliation_mismatch_total{env!~"test-.*", mode="live"} unless meterengine_payment_reconciliation_mismatch_total{env!~"test-.*", mode="live"} offset 1h) > 0)
                or (sum by (env, mode) (increase(meterengine_payment_reconciliation_mismatch_total{env!~"test-.*", mode="live"}[1h])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 자동 확정이 서버 쪽 오류로 확정하지 못한 고객과 달이 남았다. 다음 정시가 다시 시도하지만 같은 오류면 계속 남는다.
      # 보류는 도입사가 수동 확정으로 끝낼 일이라 청구 예정액 화면이 알리고 여기서는 울리지 않는다. test 환경도 뺀다.
      - uid: invoice-unfinalized-failed
        title: 인보이스 자동 확정 실패 남음
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 자동 확정에 실패한 고객과 달이 남았다 (env {{ $labels.env }}, environment {{ $labels.environment }}). invoice_finalization_attempt의 reason과 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env, environment) (meterengine_invoice_unfinalized{env!~"test-.*", result="failed",environment!="test"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 실패로 끝나 더는 보내지 않는 웹훅이 생겼다(재시도 상한, 선점 만료, 막힌 주소). 도입사가 이벤트를 받지 못했다.
      # 예약 작업 실패와 같은 이유로 15분 안에 새로 생긴 시계열도 센다.
      - uid: webhook-delivery-failed
        title: 웹훅 전송 실패
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 실패로 끝난 웹훅이 최근 15분 안에 생겼다. 전송 기록 조회 API로 엔드포인트와 실패 이유를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env) (meterengine_webhook_delivery_total{env!~"test-.*", result="failed",reason!="endpoint_disabled",environment!="test"} unless meterengine_webhook_delivery_total{env!~"test-.*", result="failed"} offset 15m) > 0)
                or (sum by (env) (increase(meterengine_webhook_delivery_total{env!~"test-.*", result="failed",reason!="endpoint_disabled",environment!="test"}[15m])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 보낼 때가 지난 웹훅이 10분 넘게 밀렸다. 실패가 없어도 발송이 처리량을 따라가지 못하면 도입사 통보가 늦는다.
      # test 환경 적체는 웹훅 전송 실패 경보처럼 뺀다.
      - uid: webhook-delivery-backlog
        title: 웹훅 발송 적체
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 보낼 때가 지난 웹훅이 10분 넘게 밀려 있다. 응답이 느린 수신 주소가 발송 시간을 쓰고 있는지 전송 기록 조회 API와 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env) (meterengine_webhook_delivery_backlog_age_seconds{env!~"test-.*", environment!="test"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [600] }

      # 아래는 카프카를 켠 환경의 경보다. 켜면 서버 그룹이 api, ingest, consumer로 나뉘고 서버에 server_role 라벨이 붙는다.
      # 켜지 않은 환경은 그 라벨도 브로커 지표도 없어 NoData이고, 켜지 않은 것은 장애가 아니므로 모두 OK로 둔다.
      # Prometheus 조회가 실패하면 켜지 않은 환경에도 한꺼번에 울리므로 조회 오류는 DatasourceError 하나로 묶는다.

      # 수집 서버 그룹에 응답하는 서버가 없다. 다른 역할의 서버가 살아 있으면 백엔드 헬스체크 실패와 앱 서버 없음이 울리지 않아 따로 센다.
      # 서버가 0대면 계열이 사라지므로, 역할 라벨이 붙은 다른 서버가 있는 환경에 0을 깐다. 카프카를 켜고 끄는 apply 중에는 한 번 울릴 수 있다.
      - uid: ingest-fleet-empty
        title: 수집 서버 없음
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 수집 서버 그룹에 응답하는 서버가 2분 넘게 없다. 이벤트 수집 API가 요청을 받지 못한다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                count by (env) (up{env!~"test-.*", job="backend", server_role="ingest"} == 1)
                or count by (env) (up{env!~"test-.*", job="backend", server_role=~"api|consumer"}) * 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 관리 API, 화면, 예약 작업을 맡는 api 역할 서버가 없다. 수집과 저장은 이어져도 콘솔과 결제, 인보이스 작업이 멈춘다.
      # 켜고 끄는 apply 중에는 역할 태그가 없는 옛 서버가 이 일을 맡고 있어, 태그가 없는 서버도 센다.
      - uid: api-fleet-empty
        title: API 서버 없음
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 api 역할 서버 그룹에 응답하는 서버가 2분 넘게 없다. 관리 API와 화면이 멈추고 예약 작업이 돌지 않는다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                count by (env) (up{env!~"test-.*", job="backend", server_role=~"api|"} == 1)
                or count by (env) (up{env!~"test-.*", job="backend", server_role=~"ingest|consumer"}) * 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 컨슈머 서버 그룹에 응답하는 서버가 없다. 수집은 202로 계속 받지만 이벤트가 카프카에 쌓이기만 하고 DB에 들어가지 않는다.
      # 컨슈머가 한 대인 환경은 배포가 서버를 내리고 새로 띄우는 약 5분 동안 0대라, 그보다 길게 기다린다.
      - uid: consumer-fleet-empty
        title: 컨슈머 서버 없음
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 컨슈머 서버 그룹에 응답하는 서버가 10분 넘게 없다. 받은 이벤트가 카프카에 쌓이기만 하고 저장되지 않는다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                count by (env) (up{env!~"test-.*", job="backend", server_role="consumer"} == 1)
                or count by (env) (up{env!~"test-.*", job="backend", server_role=~"api|ingest"}) * 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 밀린 메시지가 있는데 컨슈머가 5분 동안 한 건도 끝내지 못했다. 서버는 떠 있지만 DB 장애나 멈춘 스레드로 저장이 서 있는 경우다.
      # 밀린 건수는 브로커가 세어, 컨슈머가 죽어 컨슈머 쪽 지표가 사라져도 남는다. 브로커가 모니터링에 등록되어 있어야 울린다.
      - uid: event-consume-stalled
        title: 이벤트 저장 멈춤
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 카프카에 밀린 이벤트가 있는데 5분 넘게 한 건도 저장되지 않았다. 컨슈머 서버 로그와 DB 상태를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                max by (env) (kafka_consumer_group_ConsumerLagMetrics_Value{env!~"test-.*", name="SumOffsetLag", groupId="event-ingest"}) > 0
                unless on (env) sum by (env) (rate(meterengine_event_consume_total{env!~"test-.*"}[5m])) > 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 컨슈머는 저장에 실패한 묶음을 성공할 때까지 1초마다 다시 한다. 파티션 하나만 멈추면 나머지가 흘러 위 경보가 울리지 않는다.
      # DB 장애 조치처럼 1분 안에 끝나는 재시도는 넘기고, 5분 넘게 이어지는 것만 잡는다.
      - uid: event-consume-retrying
        title: 이벤트 저장 재시도 지속
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 컨슈머가 같은 묶음의 저장을 5분 넘게 다시 시도하고 있다. 그 파티션의 이벤트는 저장되지 않고 밀린다. 컨슈머 서버 로그에서 실패 원인을 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (env) (rate(meterengine_event_consume_retry_total{env!~"test-.*"}[5m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 접수부터 저장까지 걸린 시간의 p99가 반영 목표 60초를 5분 넘게 웃돈다. 평소는 1초 안이고 DB 장애 조치 때 잠깐 30초쯤 된다.
      # 저장한 이벤트만 재므로 저장이 아예 멈춘 경우는 위 경보가 맡는다.
      - uid: event-storage-delay-high
        title: 이벤트 저장 지연
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 이벤트가 접수된 뒤 저장되기까지 60초 넘게 걸리고 있다. 컨슈머가 들어오는 양을 따라가지 못한다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.99, sum by (env, le) (rate(meterengine_event_storage_delay_seconds_bucket{env!~"test-.*"}[5m])))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [60] }

      # 컨슈머가 저장할 수 없는 메시지를 DLQ 토픽으로 보냈다. 그 이벤트는 DB에 없고 사람이 봐야 한다. 카운터는 서버가 뜰 때 0으로 나온다.
      - uid: event-dead-letter
        title: 이벤트 DLQ 발생
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 최근 15분 안에 DLQ로 간 이벤트가 생겼다. 그 이벤트는 저장되지 않았다. 컨슈머 서버 로그에서 이유를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (env) (increase(meterengine_event_consume_total{env!~"test-.*", result="dead_letter"}[15m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 수집 서버가 카프카에 넣지 못해 503으로 돌려준 비율이다. 요청이 없으면 0/0 = NaN이라 NoData가 된다.
      - uid: event-publish-failing
        title: 이벤트 발행 실패
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 최근 5분 이벤트의 5% 넘게 카프카에 넣지 못하고 503으로 돌려주고 있다. 브로커 상태를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (env) (rate(meterengine_event_publish_seconds_count{env!~"test-.*", result="failure"}[5m])) / sum by (env) (rate(meterengine_event_publish_seconds_count{env!~"test-.*"}[5m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # 브로커 한 대라도 10분 넘게 긁히지 않는다. 한 대가 빠져도 수집은 이어지지만(복제 3, 최소 동기 복제 2) 한 대 더 빠지면 멈춘다.
      # 역할 서버는 있는데 브로커 계열이 없으면 등록이 빠진 것이라 0을 깐다. 끈 뒤 남은 대상 파일은 역할 서버가 없어 보지 않는다.
      - uid: kafka-broker-down
        title: 카프카 브로커 응답 없음
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 카프카 브로커가 10분 넘게 지표 수집에 응답하지 않거나, 모니터링 서버에 등록되어 있지 않다.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                min by (env) (up{env!~"test-.*", job="kafka-broker"})
                and on (env) count by (env) (up{env!~"test-.*", job="backend", server_role=~"api|ingest|consumer"})
                or count by (env) (up{env!~"test-.*", job="backend", server_role=~"api|ingest|consumer"}) * 0
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 브로커 데이터 디스크가 차면 브로커가 쓰기를 멈춘다. 보관 기간이 지난 것은 브로커가 지우므로 평소에는 오르지 않는다.
      - uid: kafka-broker-disk
        title: 카프카 브로커 디스크 부족
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 카프카 브로커 {{ $labels.instance }} 데이터 디스크 사용률이 80%를 넘었다. 디스크를 늘리거나 토픽 보관 기간을 줄인다.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (1 - min by (env, instance) (node_filesystem_avail_bytes{env!~"test-.*", job="kafka-node", mountpoint="/kafka/datalogs"} / node_filesystem_size_bytes{env!~"test-.*", job="kafka-node", mountpoint="/kafka/datalogs"}))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
