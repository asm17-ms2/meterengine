# 경보 규칙과 Slack 연동. 임계값은 운영하며 조정하는 시작값이다.
# 발화 테스트: 임계값을 일부러 낮춰 배포해 Slack 수신을 확인하고 원복한다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack
    receivers:
      - uid: slack-webhook
        type: slack
        settings:
          # Grafana가 기동 때 환경변수로 치환한다. 값은 Parameter Store
          # 환경의 Parameter Store 경로 아래 slack-webhook-url 에서 온다 (deploy.sh나 공용 서버의 monitoring/start.sh -> compose environment).
          url: $SLACK_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: slack
    group_by: ["alertname"]
    # 같은 경보의 재알림은 4시간에 한 번. 계속 울리면 아무도 안 보게 된다.
    repeat_interval: 4h

# 블루그린 시절의 두 색 경보다. 이제 서버가 여러 대인 것이 정상이라 이미 만들어진 규칙도 지운다.
deleteRules:
  - orgId: 1
    uid: backend-both-colors-up

groups:
  - orgId: 1
    name: meterengine
    folder: MeterEngine
    interval: 1m
    # 공용 Prometheus는 측정 환경(test-로 시작)도 긁어 모든 선택자에서 빼고 env별로 울린다.
    # 포함 필터를 쓰면 env 라벨이 없는 서버 안 Prometheus에서 경보가 모두 꺼진다.
    rules:
      # 프로세스 다운, 포트 불통, 응답 불능을 잡는다. 환경마다 백엔드 서버 중 최댓값을 봐서 한 대라도 응답하면 울리지 않는다.
      # 롤링은 새 서버가 healthy가 된 뒤 옛 서버를 빼므로 정상 배포로는 울리지 않는다.
      - uid: backend-down
        title: 백엔드 헬스체크 실패
        condition: C
        for: 1m
        # Prometheus 자체가 죽어 평가할 데이터가 없어도 문제 상황이므로 경보로 취급한다.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}에서 백엔드 서버가 하나도 1분 넘게 scrape에 응답하지 않는다. 그 환경의 API가 죽었을 가능성이 높다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env) (up{env!~"test-.*", job="backend"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 서버 찾기는 실행 중인 앱 서버만 보여, 서버가 0대면 up 계열이 사라져 위 경보가 울리지 않는다. 그래서 환경마다 0을 깔고 센다.
      # 찾은 서버를 세므로 서버는 있는데 백엔드가 죽은 경우는 위 경보가 맡는다.
      - uid: app-fleet-empty
        title: 앱 서버 없음
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}에서 공용 모니터링이 찾은 앱 서버가 1분 넘게 0대다. 오토스케일링 그룹의 최소 대수와 활동 기록을 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                count by (env) (up{env!~"test-.*", job="backend"})
                or label_replace(vector(0), "env", "staging", "", "")
                or label_replace(vector(0), "env", "production", "", "")
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # 5xx율 5% 초과가 5분 지속. outcome은 Micrometer가 상태 코드에서 만들어 주는 라벨이다.
      # /actuator는 제외한다. Prometheus scrape가 항상 성공하는 요청을 분당 4건 깔아서,
      # 트래픽이 적을 때 실제 오류율을 임계값 아래로 희석시킨다.
      # 트래픽이 0이면 0/0 = NaN이라 NoData가 되는데, 요청이 없는 것은 장애가 아니므로 OK로 둔다.
      - uid: high-5xx-rate
        title: 5xx 응답 비율 초과
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}에서 최근 5분 요청의 5% 넘게 5xx로 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (env) (rate(http_server_requests_seconds_count{env!~"test-.*", outcome="SERVER_ERROR",uri!~"/actuator.*"}[5m])) / sum by (env) (rate(http_server_requests_seconds_count{env!~"test-.*", uri!~"/actuator.*"}[5m]))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # 서버마다 CPU 5분 평균 80% 초과가 10분 지속. t4g.medium 2vCPU 기준으로, 짧은 스파이크(배포,
      # 마이그레이션)는 넘기고 지속 포화만 잡는 값이다.
      - uid: high-cpu
        title: CPU 사용률 초과
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: 환경 {{ $labels.env }}의 서버 {{ $labels.instance }} CPU가 10분 넘게 80%를 웃돌고 있다. 처리량 한계이거나 폭주하는 프로세스가 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (1 - avg by (env, instance) (rate(node_cpu_seconds_total{env!~"test-.*", mode="idle"}[5m])))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # 예약 작업 경보는 결제와 웹훅, 청구 제외 통보 작업만 본다. 인보이스 쪽 작업은 따로 경보한다.
      # 인스턴스가 둘이어도 맞게 카운터는 sum, 마지막 성공 시각은 max로 묶는다.

      # 실행이 예외로 끝났거나, 실행은 끝났지만 일부 대상이 실패했다.
      # 카운터가 첫 실패 때 값 1로 처음 생기면 increase()가 0으로 보므로, 15분 안에 새로 생긴 시계열도 실패로 센다.
      - uid: scheduled-job-failed
        title: 예약 작업 실패
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 최근 15분 안에 실패했다. scheduled_job_run의 error_summary와 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}
                unless meterengine_scheduled_job_run_total{env!~"test-.*", result="failed"} offset 15m) > 0)
                or (sum by (env, job_name) (increase(meterengine_scheduled_job_run_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}[15m])) > 0)
                or (sum by (env, job_name) (meterengine_scheduled_job_items_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}
                unless meterengine_scheduled_job_items_total{env!~"test-.*", result="failed"} offset 15m) > 0)
                or (sum by (env, job_name) (increase(meterengine_scheduled_job_items_total{env!~"test-.*", result="failed",job_name=~"payment_attempt_confirmation|payment_retry|payment_reconciliation|webhook_delivery|unbilled_usage_report"}[15m])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 마지막 성공 뒤 경과 시간. 성공한 적 없이 지금 프로세스에서 실행만 된 작업은 백엔드 기동 뒤 경과 시간으로 본다.
      # 30초, 1분 주기 작업은 5분 동안 성공이 없으면 울린다.
      - uid: scheduled-job-missed-minute
        title: 예약 작업 미실행 (1분 이하 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 5분 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name=~"payment_attempt_confirmation|webhook_delivery"}))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name=~"payment_attempt_confirmation|webhook_delivery"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }

      # 10분 주기 재시도 작업은 세 번 연속 성공이 없으면 울린다.
      - uid: scheduled-job-missed-ten-minute
        title: 예약 작업 미실행 (10분 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 30분 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name="payment_retry"}))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name="payment_retry"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1800] }

      # 인보이스 자동 확정은 매시 정각에 돌아 마지막 성공이 끝난 뒤 2시간 안에 다음 성공이 없으면 울린다. 꺼져 있어 한 번도 돌지 않았으면 시계열이 없어 울리지 않는다.
      - uid: invoice-auto-finalize-missed
        title: 인보이스 자동 확정 미실행
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 2시간 넘게 성공하지 않았다. 작업이 멈췄거나 계속 실패하고 있다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name="invoice_auto_finalize"}))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name="invoice_auto_finalize"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [7200] }

      # 하루 한 번 도는 작업은 정해진 시각에서 1시간이 지나도록 그날 성공이 없으면 울린다.
      # 슬롯을 이긴 색이 배포로 멈춰 그 시리즈가 사라져도 26시간 안의 가장 최근 성공을 본다.
      - uid: scheduled-job-missed-day
        title: 예약 작업 미실행 (하루 주기)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}의 예약 작업 {{ $labels.job_name }} 이 25시간 넘게 성공하지 않았다. 오늘 실행이 빠졌거나 실패했다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (time() - max by (env, job_name) (max_over_time(meterengine_scheduled_job_last_success_seconds{env!~"test-.*", job_name=~"payment_reconciliation|unbilled_usage_report"}[26h])))
                or on (env, job_name) (count by (env, job_name) (meterengine_scheduled_job_run_total{env!~"test-.*", job_name=~"payment_reconciliation|unbilled_usage_report"}) * 0
                + on (env) group_left () (time() - max by (env) (process_start_time_seconds{env!~"test-.*", job="backend"})))
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90000] }

      # 결제 경보는 테스트 모드도 본다. 테스트 결제에서도 울려야 경보가 살아 있는지 알 수 있다. mode 라벨로 구분한다.

      # 결과를 모르는 결제가 확정 작업으로도 풀리지 않고 10분 넘게 남았다. 고객이 돈을 냈는지 모르는 상태다.
      - uid: payment-stale-pending
        title: 결제 결과 모름 미해결
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 결과를 모르는 결제가 10분 넘게 남아 있다. 토스페이먼츠 조회가 실패하고 있는지 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env, mode) (meterengine_payment_stale_pending{env!~"test-.*", mode="live"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 재시도 상한까지 실패해 더는 자동으로 청구하지 않는 인보이스가 생겼다. 사람이 고객에게 연락해야 한다.
      # 예약 작업 실패와 같은 이유로 1시간 안에 새로 생긴 시계열도 센다.
      - uid: payment-retry-exhausted
        title: 결제 재시도 소진
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 재시도 상한까지 결제가 실패한 인보이스가 최근 1시간 안에 생겼다 (env {{ $labels.env }}, mode {{ $labels.mode }}).
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env, mode) (meterengine_payment_retry_exhausted_total{env!~"test-.*", mode="live"} unless meterengine_payment_retry_exhausted_total{env!~"test-.*", mode="live"} offset 1h) > 0)
                or (sum by (env, mode) (increase(meterengine_payment_retry_exhausted_total{env!~"test-.*", mode="live"}[1h])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 매일 대사에서 우리 결제 기록과 토스페이먼츠 거래가 어긋났다.
      # 예약 작업 실패와 같은 이유로 1시간 안에 새로 생긴 시계열도 센다.
      - uid: payment-reconciliation-mismatch
        title: 결제 대사 불일치
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 결제 대사에서 불일치가 나왔다 (env {{ $labels.env }}, mode {{ $labels.mode }}). GET /v1/payment-reconciliation-mismatches 로 내용을 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env, mode) (meterengine_payment_reconciliation_mismatch_total{env!~"test-.*", mode="live"} unless meterengine_payment_reconciliation_mismatch_total{env!~"test-.*", mode="live"} offset 1h) > 0)
                or (sum by (env, mode) (increase(meterengine_payment_reconciliation_mismatch_total{env!~"test-.*", mode="live"}[1h])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 자동 확정이 서버 쪽 오류로 확정하지 못한 고객과 달이 남았다. 다음 정시가 다시 시도하지만 같은 오류면 계속 남는다.
      # 보류는 도입사가 수동 확정으로 끝낼 일이라 청구 예정액 화면이 알리고 여기서는 울리지 않는다. test 환경도 뺀다.
      - uid: invoice-unfinalized-failed
        title: 인보이스 자동 확정 실패 남음
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 자동 확정에 실패한 고객과 달이 남았다 (env {{ $labels.env }}, environment {{ $labels.environment }}). invoice_finalization_attempt의 reason과 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env, environment) (meterengine_invoice_unfinalized{env!~"test-.*", result="failed",environment!="test"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 실패로 끝나 더는 보내지 않는 웹훅이 생겼다(재시도 상한, 선점 만료, 막힌 주소). 도입사가 이벤트를 받지 못했다.
      # 예약 작업 실패와 같은 이유로 15분 안에 새로 생긴 시계열도 센다.
      - uid: webhook-delivery-failed
        title: 웹훅 전송 실패
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 실패로 끝난 웹훅이 최근 15분 안에 생겼다. 전송 기록 조회 API로 엔드포인트와 실패 이유를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum by (env) (meterengine_webhook_delivery_total{env!~"test-.*", result="failed",reason!="endpoint_disabled",environment!="test"} unless meterengine_webhook_delivery_total{env!~"test-.*", result="failed"} offset 15m) > 0)
                or (sum by (env) (increase(meterengine_webhook_delivery_total{env!~"test-.*", result="failed",reason!="endpoint_disabled",environment!="test"}[15m])) > 0)
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # 보낼 때가 지난 웹훅이 10분 넘게 밀렸다. 실패가 없어도 발송이 처리량을 따라가지 못하면 도입사 통보가 늦는다.
      # test 환경 적체는 웹훅 전송 실패 경보처럼 뺀다.
      - uid: webhook-delivery-backlog
        title: 웹훅 발송 적체
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 환경 {{ $labels.env }}에서 보낼 때가 지난 웹훅이 10분 넘게 밀려 있다. 응답이 느린 수신 주소가 발송 시간을 쓰고 있는지 전송 기록 조회 API와 백엔드 로그를 본다.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (env) (meterengine_webhook_delivery_backlog_age_seconds{env!~"test-.*", environment!="test"})
              instant: true
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [600] }
