# 공용 모니터링 서버의 수집 설정. 서버 안 Prometheus의 설정은 deploy/prometheus/prometheus.yml이다.
# 앱 서버는 EC2 태그로 찾는다. 오토스케일링이 늘리고 줄인 서버를 30초마다 다시 찾아 따라간다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 환경은 Environment 태그에서, instance는 인스턴스 ID에서 붙여 서버가 바뀌어도 어느 환경 어느 서버 값인지 남긴다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8080
        refresh_interval: 30s
        filters: &app_servers
          - name: tag:Role
            values: [app]
          - name: instance-state-name
            values: [running]
    relabel_configs: &app_labels
      - source_labels: [__meta_ec2_tag_Environment]
        target_label: env
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance

  - job_name: node
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9100
        refresh_interval: 30s
        filters: *app_servers
    relabel_configs: *app_labels

  - job_name: cadvisor
    # cAdvisor는 표본에 시각을 붙인다. 이게 없으면 다시 만든 컨테이너의 옛 시계열이 5분 남아 겹쳐 그려진다.
    track_timestamps_staleness: true
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9101
        refresh_interval: 30s
        filters: *app_servers
    relabel_configs: *app_labels

  # DB는 환경마다 exporter가 따로라 env를 직접 붙인다. 파라미터가 없어 띄우지 않은 exporter는 down으로 보인다.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter-production:9187"]
        labels: { env: production }
      - targets: ["postgres-exporter-staging:9187"]
        labels: { env: staging }
      - targets: ["postgres-exporter-test-storage:9187"]
        labels: { env: test-storage }
      - targets: ["postgres-exporter-test-sjpark:9187"]
        labels: { env: test-sjpark }

  # 계정의 모든 RDS를 한 번에 읽으므로 env는 DB 식별자에서 만든다. 운영 DB만 이름에 환경이 없다.
  - job_name: cloudwatch
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets: ["cloudwatch-exporter:9106"]
    metric_relabel_configs:
      - source_labels: [dbinstance_identifier]
        regex: meterengine-db
        target_label: env
        replacement: production
      - source_labels: [dbinstance_identifier]
        regex: meterengine-(.+)-db
        target_label: env

  # 대시보드가 쓰는 경보 지표만 남기고 나머지는 저장 크기 한도를 먹지 않게 버린다.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: grafana_alerting_(rule_evaluation_failures|notifications_failed)_total
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
