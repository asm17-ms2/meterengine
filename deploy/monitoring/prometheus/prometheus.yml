# 공용 모니터링 서버의 수집 설정. 서버 안 Prometheus의 설정은 deploy/prometheus/prometheus.yml이다.
# 앱 서버는 EC2 태그로 찾는다. 오토스케일링이 늘리고 줄인 서버를 30초마다 다시 찾아 따라간다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 환경은 Environment 태그에서, instance는 인스턴스 ID에서 붙여 서버가 바뀌어도 어느 환경 어느 서버 값인지 남긴다.
  - job_name: backend
    metrics_path: /actuator/prometheus
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8080
        refresh_interval: 30s
        filters: &app_servers
          - name: tag:Role
            values: [app]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - &env_from_tag
        source_labels: [__meta_ec2_tag_Environment]
        target_label: env
      - &instance_from_id
        source_labels: [__meta_ec2_instance_id]
        target_label: instance
      # 카프카를 켠 환경만 서버 그룹에 ServerRole 태그(api, ingest, consumer)가 있다. 태그가 없으면 라벨도 붙지 않는다.
      - &role_from_tag
        source_labels: [__meta_ec2_tag_ServerRole]
        target_label: server_role

  - job_name: node
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9100
        refresh_interval: 30s
        filters: *app_servers
    relabel_configs: &app_labels
      - *env_from_tag
      - *instance_from_id
      - *role_from_tag

  - job_name: cadvisor
    # cAdvisor는 표본에 시각을 붙인다. 이게 없으면 다시 만든 컨테이너의 옛 시계열이 5분 남아 겹쳐 그려진다.
    track_timestamps_staleness: true
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9101
        refresh_interval: 30s
        filters: *app_servers
    relabel_configs: *app_labels

  # DB는 환경마다 exporter가 따로라 env를 직접 붙인다. 파라미터가 없어 띄우지 않은 exporter는 down으로 보인다.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter-production:9187"]
        labels: { env: production }
      - targets: ["postgres-exporter-staging:9187"]
        labels: { env: staging }
      - targets: ["postgres-exporter-test-storage:9187"]
        labels: { env: test-storage }
      - targets: ["postgres-exporter-test-sjpark-m7g:9187"]
        labels: { env: test-sjpark-m7g }
      - targets: ["postgres-exporter-test-sjpark-t4g:9187"]
        labels: { env: test-sjpark-t4g }

  # MSK 브로커는 우리 계정의 EC2가 아니라 태그로 찾을 수 없고, 주소가 클러스터를 만들 때마다 바뀐다.
  # 클러스터를 만든 쪽이 대상 파일을 써 두면 다시 띄우지 않아도 따라간다. env 라벨은 그 파일이 붙인다.
  - job_name: kafka-broker
    # AWS는 브로커의 JMX 지표를 60초보다 자주 긁지 말라고 한다. 더 자주 긁으면 브로커 CPU를 쓴다.
    scrape_interval: 60s
    scrape_timeout: 30s
    file_sd_configs:
      - files: [/etc/prometheus-targets/kafka-jmx-*.json]
    # 브로커 3대가 시계열 약 2만 5천 개를 낸다. 늘 켜 두는 환경은 경보와 대시보드가 쓰는 것만 남긴다.
    # 측정 환경(test-)은 켜 있는 동안만 받고 실험마다 보는 지표가 달라 다 남긴다.
    metric_relabel_configs:
      - source_labels: [env, __name__, name]
        regex: "test-[^;]*;.*\
          |[^;]*;kafka_server_BrokerTopicMetrics_Count;(MessagesInPerSec|BytesInPerSec|BytesOutPerSec)\
          |[^;]*;kafka_server_ReplicaManager_Value;(UnderReplicatedPartitions|UnderMinIsrPartitionCount|OfflineReplicaCount)\
          |[^;]*;kafka_controller_KafkaController_Value;(OfflinePartitionsCount)\
          |[^;]*;kafka_consumer_group_ConsumerLagMetrics_Value;(SumOffsetLag)"
        action: keep

  # 브로커 서버의 CPU, 디스크, 네트워크. 가벼워서 앱 서버와 같은 간격으로 긁는다.
  - job_name: kafka-node
    file_sd_configs:
      - files: [/etc/prometheus-targets/kafka-node-*.json]

  # 계정의 모든 RDS와 ALB를 한 번에 읽으므로 env는 DB 식별자와 ALB 이름에서 만든다. 운영 DB만 이름에 환경이 없다.
  - job_name: cloudwatch
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets: ["cloudwatch-exporter:9106"]
    metric_relabel_configs:
      - source_labels: [dbinstance_identifier]
        regex: meterengine-db
        target_label: env
        replacement: production
      - source_labels: [dbinstance_identifier]
        regex: meterengine-(.+)-db
        target_label: env
      - source_labels: [load_balancer]
        regex: app/meterengine-(.+)-alb/.+
        target_label: env
      # 대상 그룹 이름은 Terraform이 접두 뒤를 지어 접두로 서비스를 가린다.
      - source_labels: [target_group]
        regex: targetgroup/back-.+
        target_label: service
        replacement: backend
      - source_labels: [target_group]
        regex: targetgroup/front-.+
        target_label: service
        replacement: frontend
      # 카프카를 켠 환경에서 이벤트 수집 요청만 받는 대상 그룹이다.
      - source_labels: [target_group]
        regex: targetgroup/ingst-.+
        target_label: service
        replacement: ingest

  # 대시보드가 쓰는 경보 지표만 남기고 나머지는 저장 크기 한도를 먹지 않게 버린다.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: grafana_alerting_(rule_evaluation_failures|notifications_failed)_total
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
