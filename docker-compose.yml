# 로컬 개발 환경. 팀원 공통으로 사용한다.
# - 직접 실행: docker compose up -d
# - backend 실행 시 자동 기동: ./gradlew bootRun 또는 IDE에서 직접 실행 (spring-boot-docker-compose)
# name을 고정해 루트/backend 어디서 실행해도 같은 compose 프로젝트를 공유한다
name: meterengine

services:
  postgres:
    image: postgres:18
    container_name: meterengine-postgres
    environment:
      POSTGRES_DB: meterengine
      POSTGRES_USER: meterengine
      POSTGRES_PASSWORD: meterengine
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 이미지부터 데이터 볼륨 마운트 지점이 /var/lib/postgresql 이다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1로 TCP를 확인한다. postgres 이미지는 초기화 중에 유닉스 소켓 전용
      # 임시 서버를 띄우므로, 소켓으로 검사하면 아직 준비되지 않은 서버를 healthy로 읽는다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U meterengine -d meterengine"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 수집 경로를 kafka로 켤 때만 쓴다. 기본 실행에는 뜨지 않는다.
  # - 기동: docker compose --profile kafka up -d
  # - backend: EVENT_WRITE_PATH=kafka METERENGINE_EVENT_KAFKA_CREATE_TOPICS=true METERENGINE_EVENT_KAFKA_REPLICAS=1
  kafka:
    image: apache/kafka:4.3.1
    container_name: meterengine-kafka
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 브로커가 한 대라 내부 토픽도 복제 1로 둔다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"

volumes:
  postgres-data:
