# 로컬 개발 환경. 팀원 공통으로 사용한다.
# - 직접 실행: docker compose up -d
# - backend 실행 시 자동 기동: ./gradlew bootRun 또는 IDE에서 직접 실행 (spring-boot-docker-compose)
# name을 고정해 루트/backend 어디서 실행해도 같은 compose 프로젝트를 공유한다
name: meterengine

services:
  postgres:
    image: postgres:18
    container_name: meterengine-postgres
    environment:
      POSTGRES_DB: meterengine
      POSTGRES_USER: meterengine
      POSTGRES_PASSWORD: meterengine
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 이미지부터 데이터 볼륨 마운트 지점이 /var/lib/postgresql 이다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterengine -d meterengine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
