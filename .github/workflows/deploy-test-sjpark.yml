name: 측정 환경 배포

# 머지 전 브랜치를 측정 환경 test-sjpark-m7g, test-sjpark-t4g 중 하나에 배포한다. 손으로만 실행한다.
# "Use workflow from"에서 고른 브랜치의 최신 커밋을 빌드해 측정 전용 ECR에 올리고 그 커밋으로 서버를 바꾼다.
# GitHub Environment가 모든 브랜치를 허용하고 필수 승인자를 둔다. 승인해야 측정 환경의 배포 역할을 받는다.
# 브랜치에 이 파일과 측정 ECR을 가리키는 deploy/environments 파일이 있어야 하고, 배포한 동안 브랜치를 지우지 않는다(새 서버가 부팅 때 그 커밋을 받는다).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "배포할 측정 환경"
        required: true
        type: choice
        options:
          - test-sjpark-m7g
          - test-sjpark-t4g
      image_tag:
        description: "배포할 이미지 태그(커밋 SHA 40자). 비우면 고른 브랜치를 새로 빌드한다"
        required: false
        default: ""

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  cd:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      aws_role: arn:aws:iam::928618307647:role/meterengine-${{ inputs.environment }}-deploy
      image_tag: ${{ inputs.image_tag }}
