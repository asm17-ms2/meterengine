name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # on.paths로 거르면 필수 체크가 오지 않아 머지가 막힌다. job을 skip하면 통과로 친다
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      demo: ${{ steps.filter.outputs.demo }}
      deploy: ${{ steps.filter.outputs.deploy }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.node-version'
              - '.github/workflows/ci.yml'
            demo:
              - 'demo/**'
              - '.node-version'
              - '.github/workflows/ci.yml'
            # deploy 시험이 읽는 바깥 파일도 넣는다
            deploy:
              - 'deploy/**'
              - '.github/workflows/cd.yml'
              - 'measurements/test-slo/k6/README.md'
              - 'measurements/*/sut/scripts/sut-deploy.sh'
              - '.github/workflows/ci.yml'
            terraform:
              - 'measurements/terraform/**'
              - 'measurements/test-slo/sut/terraform/.terraform.lock.hcl'
              - '.node-version'
              - '.github/workflows/ci.yml'

  backend:
    name: backend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # build = 컴파일 + Spotless 포맷 검사 + 테스트 (Testcontainers가 PostgreSQL 컨테이너 사용)
      - run: ./gradlew build
      - run: |
          if [ -n "$(git status --porcelain -- openapi.yaml)" ]; then
            echo "::error file=backend/openapi.yaml::커밋된 openapi.yaml이 코드와 다르다. ./gradlew build 뒤 바뀐 openapi.yaml을 같이 커밋한다"
            exit 1
          fi

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # pnpm 버전은 frontend/package.json의 packageManager 필드를 따른다
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
      # 계약 명세는 빌드한 standalone 서버와 저장소의 가짜 API로 돈다. 백엔드와 DB가 필요한 real 명세는 넣지 않는다
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:contract
      - run: pnpm exec playwright test -c playwright.payment.config.ts
      - run: pnpm exec playwright test -c playwright.workspace.config.ts

  demo:
    name: demo
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.demo == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: demo/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      # 콘솔 시험은 textual이 있어야 돌고 없으면 건너뛴다
      - run: |
          python3 -m venv "$RUNNER_TEMP/demo-venv"
          "$RUNNER_TEMP/demo-venv/bin/pip" install --quiet "textual==8.2.8"
          "$RUNNER_TEMP/demo-venv/bin/python" -m unittest -v

  deploy:
    name: deploy
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deploy == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 로그 마스킹 시험은 이 이미지가 로컬에 있어야 돈다
      - run: docker pull caddy:2.11.7-alpine
      - run: python3 -m unittest discover -s deploy/tests -v

  terraform:
    name: terraform
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.terraform == 'true') }}
    runs-on: ubuntu-latest
    env:
      MODULE: measurements/terraform/modules/rds-auto-stop
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: terraform fmt -check -recursive "$MODULE"
      # mock_provider라 AWS 자격 증명 없이 돈다. 모듈 README대로 SUT 잠금 파일의 공급자 버전으로 임시 폴더에서 돌린다
      - run: |
          dir="$(mktemp -d)"
          cp "$MODULE"/*.tf "$MODULE"/*.json "$dir/"
          cp measurements/test-slo/sut/terraform/.terraform.lock.hcl "$dir/"
          mkdir "$dir/tests"
          cp "$MODULE"/tests/*.tftest.hcl "$dir/tests/"
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" test
      - run: npm --prefix "$MODULE/tests" ci --ignore-scripts
      - run: npm --prefix "$MODULE/tests" test
