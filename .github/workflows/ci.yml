name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # build = 컴파일 + Spotless 포맷 검사 + 테스트 (Testcontainers가 PostgreSQL 컨테이너 사용)
      # build 안의 OpenApiSnapshotTest가 docs/api/generated/openapi.yaml을 다시 만든다.
      - run: ./gradlew build
      # 위에서 다시 만든 생성물이 커밋된 내용과 다르면 재생성 결과를 함께 커밋하지 않았다는 뜻이다.
      # CI는 파일을 고치거나 커밋하지 않는다. 갱신은 개발자가 로컬에서 한다 (pnpm-lock.yaml과 같은 계약).
      - name: OpenAPI 생성물 최신성 검사
        run: |
          if [ -n "$(git status --porcelain -- ../docs/api/generated/openapi.yaml)" ]; then
            echo "::error::OpenAPI 생성물이 커밋된 내용과 다릅니다. 로컬에서 ./gradlew build 후 docs/api/generated/openapi.yaml을 함께 커밋하세요."
            git diff -- ../docs/api/generated/openapi.yaml
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # pnpm 버전은 frontend/package.json의 packageManager 필드를 따른다
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      # 의존성 없음: 스크립트가 npx로 검사 도구를 버전 고정 실행한다 (docs/api/README.md 참조)
      - run: npm run lint
