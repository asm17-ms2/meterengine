name: 배포

# cd-production.yml(main -> production)과 cd-staging.yml(develop -> staging)이 부른다. 이미지를 굽고 ECR에 올린 뒤, 버전을 기록하고 오토스케일링 그룹 서버를 바꾼다.
# job의 environment가 OIDC subject를 정하고, GitHub Environment가 허용 브랜치를 막는다. 그룹 이름과 도메인은 deploy/environments에서 읽는다.

on:
  workflow_call:
    inputs:
      environment:
        description: "배포 환경. deploy/environments의 파일 이름이자 GitHub Environment 이름이다"
        required: true
        type: string
      aws_role:
        description: "OIDC로 받을 AWS 역할 ARN"
        required: true
        type: string
      image_tag:
        description: "배포할 이미지 태그(커밋 SHA 40자). 비우면 현재 커밋을 새로 빌드한다"
        required: false
        type: string
        default: ""
      external_check:
        description: "배포 뒤 인터넷에서 ALB로 붙어 확인할지. ALB가 인터넷을 받지 않는 환경은 false다"
        required: false
        type: boolean
        default: true

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    # 수동 실행에서 태그를 지정했으면 이미 있는 이미지를 쓰는 것이므로 굽지 않는다.
    if: inputs.image_tag == ''
    name: build
    environment: ${{ inputs.environment }}
    # ARM 러너다. 배포 대상 EC2가 arm64라 x86에서 구우면 서버에서 실행되지 않는다.
    # 퍼블릭 저장소라 이 러너는 무료이고, 네이티브 빌드라 QEMU 에뮬레이션도 없다.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # staging은 저장소를 따로 쓴다. develop 이미지가 production의 롤백 대상을 밀어내지 않고, staging 역할은 production 저장소에 쓸 수 없다.
      - name: 이미지 저장소 이름 읽기
        id: target
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          prefix=$(jq -er .image_repository_prefix "deploy/environments/$DEPLOY_ENV.json")
          echo "repository=$prefix-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      # ECR 태그가 IMMUTABLE이라 같은 태그를 다시 올리면 실패한다. 워크플로 재실행처럼
      # 같은 SHA로 다시 도는 경우가 있어 먼저 확인하고 건너뛴다.
      - name: 이미 올라간 이미지인지 확인
        id: check
        run: |
          if aws ecr describe-images \
               --repository-name "${{ steps.target.outputs.repository }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "이미 있다. 빌드를 건너뛴다"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.target.outputs.repository }}:${{ github.sha }}
          # 백엔드는 Gradle 의존성 다운로드가, 프론트는 pnpm install이 캐시 대상이다.
          # scope를 나누지 않으면 두 job이 같은 캐시를 서로 덮어쓴다.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: deploy
    needs: build
    # build를 건너뛴 경우(수동 롤백)에도 배포는 해야 한다. skipped를 성공으로 친다.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # 새로 고침 15분, 대상 그룹 확인 5분, 실패 때 복구 새로 고침 20분을 담는다.
    timeout-minutes: 50
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      # 수동 실행에서 태그를 줬으면 그것, 아니면 방금 빌드한 커밋.
      SHA: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v7

      # 그룹 이름과 파라미터 경로는 배포할 커밋의 환경 파일에서 읽는다. 그 커밋의 compose가 서버에서 돌기 때문이다.
      - name: 배포 대상 읽기
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "이미지 태그가 커밋 SHA(소문자 16진수 40자)가 아니다: $SHA"
            exit 1
          fi
          git fetch --quiet --depth=1 origin "$SHA"
          if git cat-file -e "$SHA:deploy/caddy/Caddyfile" 2>/dev/null; then
            echo "$SHA 는 Caddy와 블루그린으로 도는 커밋이라 오토스케일링 그룹 서버에서 뜨지 않는다. 그 뒤 커밋을 배포한다"
            exit 1
          fi
          target=$(git show "$SHA:deploy/environments/$DEPLOY_ENV.json")
          {
            echo "AUTOSCALING_GROUP=$(jq -er .autoscaling_group_name <<<"$target")"
            echo "KAFKA_AUTOSCALING_GROUPS=$(jq -r '(.kafka_autoscaling_group_names // []) | join(" ")' <<<"$target")"
            echo "VERSION_PARAMETER=$(jq -er .parameter_path <<<"$target")/app-version"
            echo "IMAGE_REPOSITORY_PREFIX=$(jq -er .image_repository_prefix <<<"$target")"
            echo "SITE_DOMAIN=$(jq -er .site_domain <<<"$target")"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ env.AWS_REGION }}

      # 서버는 부팅 때 두 이미지를 받으므로, 없는 태그를 기록하면 새 서버가 모두 뜨지 못한다.
      - name: 이미지 확인
        run: |
          set -euo pipefail
          for component in backend frontend; do
            aws ecr describe-images --repository-name "$IMAGE_REPOSITORY_PREFIX-$component" \
              --image-ids imageTag="$SHA" >/dev/null || { echo "ECR $IMAGE_REPOSITORY_PREFIX-$component 에 $SHA 이미지가 없다"; exit 1; }
          done

      # 카프카를 켠 환경에만 있는 서버 그룹(컨슈머, 수집)을 먼저 바꾼다. 새 메시지를 읽을 쪽이 먼저 올라가야 한다.
      # 그룹이 없으면(카프카를 켜지 않은 환경) 건너뛴다.
      - name: 카프카 서버 그룹 배포
        run: |
          set -euo pipefail
          # 뒤 그룹이 실패했을 때 되돌릴 값은 첫 그룹을 바꾸기 전의 값이다.
          previous=$(aws ssm get-parameter --name "$VERSION_PARAMETER" --query Parameter.Value --output text)
          export ROLLOUT_PREVIOUS="$previous"
          echo "ROLLOUT_PREVIOUS=$previous" >> "$GITHUB_ENV"
          for group in $KAFKA_AUTOSCALING_GROUPS; do
            found=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$group" \
              --query 'AutoScalingGroups[0].AutoScalingGroupName' --output text)
            if [ "$found" != "$group" ]; then
              echo "$group 이 없어 건너뛴다"
              continue
            fi
            ./deploy/rollout.sh "$group" "$VERSION_PARAMETER" "$SHA" >/dev/null
          done

      # 버전 파라미터에 SHA를 쓰고 서버를 하나씩 새로 바꾼다. 최소 대수가 0이면 기록만 한다.
      - name: 배포
        id: rollout
        run: |
          set -euo pipefail
          ./deploy/rollout.sh "$AUTOSCALING_GROUP" "$VERSION_PARAMETER" "$SHA" | tee -a "$GITHUB_OUTPUT"

      # 인터넷에서 ALB를 거쳐 보이는지 본다. 도메인이 아직 옛 서버를 가리켜도 ALB 주소로 붙어 확인한다.
      # 로그인하지 않은 요청은 로그인 화면으로 리다이렉트되므로 따라가서 마지막 응답을 본다.
      - name: 외부에서 확인
        if: steps.rollout.outputs.recorded_only == 'false' && inputs.external_check
        env:
          ALB_DNS_NAME: ${{ steps.rollout.outputs.alb_dns_name }}
        run: |
          set -euo pipefail
          url="https://$SITE_DOMAIN/usage"
          result=$(curl -sS -L --max-redirs 5 --max-time 20 --connect-to "$SITE_DOMAIN:443:$ALB_DNS_NAME:443" \
            -o /dev/null -w '%{http_code} %{url_effective}' "$url")
          code=${result%% *}
          echo "$url (ALB $ALB_DNS_NAME) -> ${result#* } ($code)"
          [ "$code" = "200" ] || exit 1
