name: 배포

# cd-production.yml(main -> production)과 cd-staging.yml(develop -> staging)이 부른다. 이미지를 굽고 ECR에 올린 뒤, SSM으로 서버의 배포 스크립트를 부른다.
# job의 environment가 OIDC subject를 정하고, GitHub Environment가 허용 브랜치를 막는다. 인스턴스 ID와 도메인은 deploy/environments에서 읽는다.

on:
  workflow_call:
    inputs:
      environment:
        description: "배포 환경. deploy/environments의 파일 이름이자 GitHub Environment 이름이다"
        required: true
        type: string
      aws_role:
        description: "OIDC로 받을 AWS 역할 ARN"
        required: true
        type: string
      image_tag:
        description: "배포할 이미지 태그(커밋 SHA 40자). 비우면 현재 커밋을 새로 빌드한다"
        required: false
        type: string
        default: ""

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    # 수동 실행에서 태그를 지정했으면 이미 있는 이미지를 쓰는 것이므로 굽지 않는다.
    if: inputs.image_tag == ''
    name: build
    environment: ${{ inputs.environment }}
    # ARM 러너다. 배포 대상 EC2가 arm64라 x86에서 구우면 서버에서 실행되지 않는다.
    # 퍼블릭 저장소라 이 러너는 무료이고, 네이티브 빌드라 QEMU 에뮬레이션도 없다.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # staging은 저장소를 따로 쓴다. develop 이미지가 production의 롤백 대상을 밀어내지 않고, staging 역할은 production 저장소에 쓸 수 없다.
      - name: 이미지 저장소 이름 읽기
        id: target
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          prefix=$(jq -er .image_repository_prefix "deploy/environments/$DEPLOY_ENV.json")
          echo "repository=$prefix-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      # ECR 태그가 IMMUTABLE이라 같은 태그를 다시 올리면 실패한다. 워크플로 재실행처럼
      # 같은 SHA로 다시 도는 경우가 있어 먼저 확인하고 건너뛴다.
      - name: 이미 올라간 이미지인지 확인
        id: check
        run: |
          if aws ecr describe-images \
               --repository-name "${{ steps.target.outputs.repository }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "이미 있다. 빌드를 건너뛴다"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.target.outputs.repository }}:${{ github.sha }}
          # 백엔드는 Gradle 의존성 다운로드가, 프론트는 pnpm install이 캐시 대상이다.
          # scope를 나누지 않으면 두 job이 같은 캐시를 서로 덮어쓴다.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: deploy
    needs: build
    # build를 건너뛴 경우(수동 롤백)에도 배포는 해야 한다. skipped를 성공으로 친다.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: 배포 대상 읽기
        run: |
          set -euo pipefail
          target="deploy/environments/$DEPLOY_ENV.json"
          echo "INSTANCE_ID=$(jq -er .instance_id "$target")" >> "$GITHUB_ENV"
          echo "SITE_DOMAIN=$(jq -er .site_domain "$target")" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포
        env:
          # 수동 실행에서 태그를 줬으면 그것, 아니면 방금 빌드한 커밋.
          SHA: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "이미지 태그가 커밋 SHA(소문자 16진수 40자)가 아니다: $SHA"
            exit 1
          fi

          echo "배포 대상: $DEPLOY_ENV $INSTANCE_ID $SHA"

          # 롤백이 그 시점의 compose와 Caddyfile을 쓰도록 checkout을 같은 명령에 넣는다. 환경 파일이 없는 옛 커밋은 옛 deploy.sh의 기본값이 production이라 production에서만 부른다.
          # commands= 값은 AWS CLI shorthand로 읽혀 대괄호와 쉼표를 쓸 수 없다.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD $DEPLOY_ENV ${SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters commands="exec 8>/etc/meterengine/deploy-command.lock && flock -n 8 && cd /opt/meterengine && git fetch --quiet origin 8>&- 9>&- && git checkout --quiet --force $SHA 8>&- 9>&- && if test -f deploy/environments/$DEPLOY_ENV.json; then ./deploy/deploy.sh $DEPLOY_ENV $SHA; elif test $DEPLOY_ENV = production; then ./deploy/deploy.sh $SHA; else echo $SHA 에 환경 파일이 없다 >&2; exit 1; fi" \
            --query 'Command.CommandId' --output text)

          echo "SSM CommandId=$CMD_ID"

          # aws ssm wait는 100초에서 포기해 그보다 긴 배포의 결과를 놓치므로 상태를 직접 묻는다.
          # 실패해도 여기서 끝내지 않는다. 아래에서 로그를 찍어야 원인을 볼 수 있다.
          for _ in $(seq 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text) || STATUS=Pending
            case "$STATUS" in
              Pending|InProgress|Delayed|Cancelling) sleep 5 ;;
              *) break ;;
            esac
          done

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "----- 서버 오류 출력 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text
          echo "---------------------"

          # SSM 응답의 출력은 2500자에서 잘린다. 여기서 원인이 안 보이면 서버에 붙어서 본다:
          #   aws ssm start-session --target <인스턴스> 후 docker compose -p meterengine-prod logs
          [ "$STATUS" = "Success" ] || { echo "배포 실패 (SSM Status=$STATUS)"; exit 1; }

          echo "배포 성공: $SHA"

      # 인터넷에서 보이는지 본다. Caddy나 DNS 문제는 이 단계에서만 드러난다.
      # 로그인하지 않은 요청은 로그인 화면으로 리다이렉트되므로 따라가서 마지막 응답을 본다.
      - name: 외부에서 확인
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          url="https://$SITE_DOMAIN/usage"
          result=$(curl -sS -L --max-redirs 5 --max-time 20 -o /dev/null -w '%{http_code} %{url_effective}' "$url")
          code=${result%% *}
          echo "$url -> ${result#* } ($code)"
          [ "$code" = "200" ] || exit 1
