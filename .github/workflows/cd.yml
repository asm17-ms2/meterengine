name: CD

# main에 머지되면 곧 배포다. 이미지를 굽고 ECR에 올린 뒤, SSM으로 서버의 배포 스크립트를 부른다.
#
# 수동 실행(workflow_dispatch)은 롤백 수단이다. 이미지 태그를 주면 빌드를 건너뛰고 그 태그로
# 배포만 다시 한다. 별도 롤백 장치를 두지 않은 이유는, 이미지 태그가 곧 커밋 SHA라
# "이전 SHA로 다시 배포"가 롤백과 같은 말이기 때문이다.
#
# 주의: IAM 신뢰 정책이 refs/heads/main 한정이다. 다른 브랜치에서 수동 실행하면
# AssumeRole에서 막힌다. Actions 탭에서 "Use workflow from"을 main으로 두어야 한다.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그(커밋 SHA 40자). 비우면 현재 main을 새로 빌드한다"
        required: false
        default: ""

# 배포는 겹치면 안 된다. 앞 배포가 끝날 때까지 기다린다(취소하지 않는다).
concurrency:
  group: cd
  cancel-in-progress: false

# id-token은 OIDC로 AWS 임시 자격을 받기 위한 것이다. 장기 액세스 키는 secrets에 없다.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  # 계정을 옮기거나 인스턴스를 교체하면 이 두 줄과 deploy/deploy.sh를 함께 고친다.
  AWS_ROLE: arn:aws:iam::928618307647:role/meterengine-github-actions-role
  INSTANCE_ID: i-0f47bb1f028cd29a9

jobs:
  # job 이름이 build (backend) / build (frontend)가 되어 main 룰셋의 필수 체크
  # backend / frontend (ci.yml)와 겹치지 않는다.
  build:
    # 수동 실행에서 태그를 지정했으면 이미 있는 이미지를 쓰는 것이므로 굽지 않는다.
    if: github.event_name == 'push' || inputs.image_tag == ''
    name: build
    # ARM 러너다. 배포 대상 EC2가 t4g(arm64)라 x86에서 구우면 서버에서 실행되지 않는다.
    # 퍼블릭 저장소라 이 러너는 무료이고, 네이티브 빌드라 QEMU 에뮬레이션도 없다.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # ECR 태그가 IMMUTABLE이라 같은 태그를 다시 올리면 실패한다. 워크플로 재실행처럼
      # 같은 SHA로 다시 도는 경우가 있어 먼저 확인하고 건너뛴다.
      - name: 이미 올라간 이미지인지 확인
        id: check
        run: |
          if aws ecr describe-images \
               --repository-name "meterengine-${{ matrix.component }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "이미 있다. 빌드를 건너뛴다"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false'
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/meterengine-${{ matrix.component }}:${{ github.sha }}
          # 백엔드는 Gradle 의존성 다운로드가, 프론트는 pnpm install이 캐시 대상이다.
          # scope를 나누지 않으면 두 job이 같은 캐시를 서로 덮어쓴다.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: deploy
    needs: build
    # build를 건너뛴 경우(수동 롤백)에도 배포는 해야 한다. skipped를 성공으로 친다.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포
        env:
          # 수동 실행에서 태그를 줬으면 그것, 아니면 방금 빌드한 커밋.
          SHA: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail

          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "이미지 태그가 커밋 SHA(소문자 16진수 40자)가 아니다: $SHA"
            exit 1
          fi

          echo "배포 대상: $SHA"

          # 배포 스크립트도 그 커밋의 것을 쓴다. checkout을 명령에 함께 넣는 이유는,
          # 롤백으로 옛 커밋에 갈 때 그 시점의 compose와 Caddyfile이 적용되어야 하고,
          # 스크립트가 자기 자신을 덮어쓰기 전에 교체를 끝내 두는 편이 안전해서다.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "CD ${SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters commands="cd /opt/meterengine && git fetch --quiet origin && git checkout --quiet --force $SHA && ./deploy/deploy.sh $SHA" \
            --query 'Command.CommandId' --output text)

          echo "SSM CommandId=$CMD_ID"

          # 실패해도 여기서 끝내지 않는다. 아래에서 로그를 찍어야 원인을 볼 수 있다.
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "----- 서버 오류 출력 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text
          echo "---------------------"

          # SSM 응답의 출력은 2500자에서 잘린다. 여기서 원인이 안 보이면 서버에 붙어서 본다:
          #   aws ssm start-session --target <인스턴스> 후 docker compose -p meterengine-prod logs
          [ "$STATUS" = "Success" ] || { echo "배포 실패 (SSM Status=$STATUS)"; exit 1; }

          echo "배포 성공: $SHA"

      # 서버 안에서의 헬스체크는 deploy.sh가 이미 했다. 여기서는 인터넷에서 보이는지를 본다.
      # Caddy나 DNS 문제는 이 단계에서만 드러난다.
      - name: 외부에서 확인
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://meterengine.com/usage)
          echo "https://meterengine.com/usage -> $code"
          [ "$code" = "200" ] || exit 1
