# tbls: DB 스키마에서 ERD 문서를 생성한다 (docs/erd/generated).
# 정본은 backend/src/main/resources/db/migration/V*.sql 이고 이 문서는 그 렌더링이다.
# 생성/검증 방법은 docs/erd/README.md 참조.
name: meterengine

# 재생성 스크립트(scripts/generate-erd.sh)가 일회용 DB를 띄우고 이 값을 채운다.
dsn: postgres://${TBLS_DB_USER}:${TBLS_DB_PASSWORD}@${TBLS_DB_HOST}:${TBLS_DB_PORT}/${TBLS_DB_NAME}?sslmode=disable

docPath: docs/erd/generated

# 버전이 다르면 생성물이 미묘하게 달라져 CI가 흔들린다. tbls가 직접 막는다.
requiredVersion: ">= 1.95, < 2"

# 42KB짜리 schema.json은 사람이 읽지 않는다.
disableOutputSchema: true

exclude:
  - flyway_schema_history

er:
  # svg는 컬럼과 컬럼을 이어 그린다. mermaid의 erDiagram 문법에는 그 표현이 없다.
  format: svg
  # 다이어그램은 구조만 보여준다. 근거는 각 md의 표에 있다.
  # (graphviz가 글자 폭을 Arial 기준으로 재서 한글 코멘트를 넣으면 박스를 넘친다)
  comment: false
  # FK 정의 문자열이 옆 테이블 위에 겹쳐 그려진다.
  hideDef: true

format:
  # 표의 Comment 칸에는 첫 문단만. 전문은 각 테이블 문서의 Description에 있다.
  showOnlyFirstParagraph: true
  # 참조하는 테이블이 없어 값이 통째로 비는 칸을 뺀다.
  hideColumnsWithoutValues:
    - Children
